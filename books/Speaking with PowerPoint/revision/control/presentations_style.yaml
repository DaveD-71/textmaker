page:
  size: A4
  margins_mm:
    top: 20
    bottom: 25
    left: 40
    right: 25
document:
  language: en-US
  hyphenation: true
footer:
  page_number: true
  odd_even_page_numbers: true
  page_number_alignment: right
fonts:
  body: Noto Serif
  body_medium: Noto Serif Medium
  sans: Noto Sans
  sans_medium: Noto Sans Medium
  sans_semibold: Noto Sans SemiBold
  display: Noto Sans Display SemiBold
  accent: Noto Serif Display
  jp: Noto Sans JP
color_system:
  source: Sanzo Wada, A Dictionary of Color Combinations, Seigensha
  note: Base colors are user-supplied fixed hex values. Use these base colors directly in main headings; derived colors remain
    formula-based for tints, shades, and supporting components.
  mix_formula: mix(base, target, amount) = round(base * (1 - amount) + target * amount) per RGB channel
  base_colors:
    china_rose:
      rgb_hex: '#A24F71'
    geebung:
      rgb_hex: '#C98F21'
    green_blue:
      rgb_hex: '#3366A8'
  derived_colors:
    deep_ink:
      formula: mix(green_blue, black, 0.78)
      hex: '#0B163A'
    graphite:
      formula: mix(green_blue, black, 0.58)
      hex: '#152B46'
    slate:
      formula: mix(green_blue, black, 0.40)
      hex: '#1F3D65'
    rose:
      formula: china_rose
      hex: '#A24F71'
    rose_dark:
      formula: mix(china_rose, black, 0.35)
      hex: '#69334A'
    rose_tint:
      formula: mix(china_rose, white, 0.84)
      hex: '#F6E5EC'
    geebung:
      formula: geebung
      hex: '#C98F21'
    geebung_dark:
      formula: mix(geebung, black, 0.32)
      hex: '#886116'
    geebung_tint:
      formula: mix(geebung, white, 0.78)
      hex: '#F7EAD2'
    green_blue:
      formula: green_blue
      hex: '#3366A8'
    green_blue_dark:
      formula: mix(green_blue, black, 0.30)
      hex: '#244776'
    green_blue_tint:
      formula: mix(green_blue, white, 0.86)
      hex: '#E3EBF6'
    grey_tint:
      formula: mix(green_blue, white, 0.92)
      hex: '#EEF3F9'
    light_grey:
      formula: mix(green_blue, white, 0.96)
      hex: '#F5F7FB'
colors:
  deep_ink: '#0B163A'
  graphite: '#152B46'
  slate: '#1F3D65'
  purple: '#A24F71'
  purple_dark: '#69334A'
