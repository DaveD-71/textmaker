- situation_id: G10
  cefr_target: A2
  purpose_objectives:
    en: 'Information exchange.

      Can ask and answer questions about pastimes and activities.'
    ja: '情報交換をする。

      娯楽や活動について質問し、答えることができる。'
  roleplays:
  - id: 1
    en: You work at the Japanese consulate in Miami. A colleague from another consulate
      calls to inquire about your pastimes and past activities during weekends. Answer
      their questions about your hobbies, interests, and any activities you've done
      recently.
    ja: あなたはマイアミの日本領事館で働いています。他の領事館の同僚から電話があり、あなたの趣味や週末の活動について尋ねられました。あなたの趣味や興味、最近行った活動について質問に答えてください。
  - id: 2
    en: You need to gather information about pastimes and past activities of Japanese
      citizens living in your city for a community event. Call a local Japanese cultural
      center and ask to speak with someone who can provide insights into the typical
      pastimes and past activities of the local Japanese community.
    ja: 地域のイベントのために、あなたの街に住む日本人の娯楽やこれまでの活動について情報を集める必要があります。地元の日本文化センターに電話し、地元の日本人コミュニティの典型的な娯楽やこれまでの活動について教えてくれる人に話を聞きます。
  writing_task:
    description_en: 'Following Roleplay 1, you discussed your weekend activities with
      a colleague from another consulate.

      Write an email that:

      summarizes the pastimes and activities you mentioned,

      offers additional suggestions for things to do during their upcoming trip to
      Miami,

      is friendly and helpful in tone.'
    description_ja: 'ロールプレイ1に基づき、別の領事館の同僚との会話で週末の過ごし方について話しました。

      以下を含むメールを書いてください：

      共有した趣味やアクティビティの要約、

      相手のマイアミ旅行に役立つ追加の提案、

      親しみやすく、前向きなトーンで記述してください。'
  roleplay1_key_expressions:
  - category_en: Asking questions
    category_ja: 質問する
    items:
    - Can you share some insights about your pastimes and past activities during weekends?
  - category_en: Providing information
    category_ja: 情報の提供
    items:
    - I enjoy spending time outdoors, so I often go to the beach for swimming or sunbathing.
  - category_en: Offering assistance
    category_ja: 支援の提供
    items:
    - Let me know if you need more recommendations.
  roleplay_model:
  - role: Student
    utterance: Japanese Consulate in Miami, how can I assist you?
  - role: Teacher
    utterance: Hi Taro, It’s John Addams from the consulate in San Francisco. Listen.
      I’m thinking of planning a trip to Miami, and I thought we could meet but I
      don’t know much about Miami. What’s good to do there? Can you share some insights?
  - role: Student
    utterance: Sure. I enjoy spending time outdoors, so I often go to the beach for
      swimming or sunbathing. I also like exploring local parks and going for walks.
      Recently, I visited the Miami Art Museum and attended a salsa dancing class.
  - role: Teacher
    utterance: That sounds fantastic! Do you have any other suggestions?
  - role: Student
    utterance: Yes, I also like trying new restaurants and cafes in the area. Miami
      has a vibrant food scene, so there's always something new to discover.
  - role: Teacher
    utterance: Thank you for sharing. I'll definitely check out some of those activities
      during my trip. I’ll contact you when I decide the dates.
  - role: Student
    utterance: You're welcome. Let me know if you need more recommendations.
  - role: Teacher
    utterance: I will. Have a great day!
  - role: Student
    utterance: You too. Goodbye.
