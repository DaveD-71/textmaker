- situation_id: D10
  cefr_target: B2
  purpose_objectives:
    en: 'Giving opinions.

      Can contribute, account for, and sustain their opinion, evaluate alternative
      proposals, and make and respond to hypotheses.'
    ja: '意見を述べる。

      自分の意見を述べ、説明し、維持することができる。また、代替案を評価し、仮説を立て、それに対応することができる。'
  roleplays:
  - id: 1
    en: You work at the consulate in Melbourne. You have been asked by your boss to
      choose a hotel for a group of dignitaries visiting Melbourne next month. The
      dignitaries will be attending a conference at the Melbourne Conference and Exhibition
      Centre. They will be in Melbourne for three days. Suggest a hotel and give reasons
      to support it. In the role play, your counterpart will make a counter suggestion
      for a different hotel. You need to explain the pros and cons of the counter
      suggestion and reaffirm why your hotel is the better choice.
    ja: あなたはメルボルンの領事館に勤務しています。あなたは上司から、来月メルボルンを訪れる高官グループのためにホテルを選ぶよう依頼されました。高官たちは、メルボルン会議展示センターで開催される会議に出席する予定です。彼らは
      3 日間メルボルンに滞在する予定です。ホテルの候補を挙げ、そのホテルを勧める理由を述べてください。ロールプレイでは、あなたのパートナーが別のホテルを提案します。あなたは、相手の提案の長所と短所を説明し、自分のホテルがより良い選択である理由を明確にする必要があります。
  - id: 2
    en: You work at the consulate in Auckland. You have been asked by your boss to
      choose a new inkjet printer for the consulate section. Your budget is three
      hundred dollars. Suggest a printer and give reasons to support your suggestion.
      In the role play, your counterpart will make a counter suggestion for a different
      printer. You need to explain the pros and cons of the counter suggestion and
      reaffirm why your printer is the better choice.
    ja: あなたはオークランドの領事館に勤務しています。あなたは上司から領事館のセクションで使う新しいインクジェットプリンターを選ぶよう依頼されました。あなたの予算は300ドルです。あなたの提案するプリンターとその理由を述べてください。ロールプレイでは、あなたのパートナーが別のプリンターを提案します。あなたは、相手の提案の長所と短所を説明し、自分のプリンターがより良い選択である理由を明確にする必要があります。
  writing_task:
    description_en: 'Following Roleplay 1, write an email to your boss summarizing
      your hotel recommendation.

      Your email should:

      outline the advantages of the hotel, including location, pricing, and service
      quality,

      address concerns raised during the discussion,

      reaffirm why the recommended hotel is the best choice for the visiting dignitaries,

      use persuasive and articulate language.'
    description_ja: 'ロールプレイ1での会話に基づき、ホテルの提案内容について上司に要約を報告するメールを作成してください。

      以下を含めてください：

      推薦ホテルの利点（立地、価格、サービス品質）、

      会議中に挙げられた懸念への対応、

      来賓の宿泊先としてそのホテルが最良の選択である理由、

      明確で説得力のある表現を用いること。'
  roleplay1_key_expressions:
  - category_en: Making a suggestion
    category_ja: 提案をする
    items:
    - I think the best option then is the Novotel at South Wharf.
  - category_en: Stating positive attributes
    category_ja: 肯定的な点を述べる
    items:
    - 'Certainly, the Pan Pacific is closer. '
  - category_en: Stating negative attributes
    category_ja: 否定的な点を述べる
    items:
    - But it’s also more expensive
  roleplay_model:
  - role: Teacher
    utterance: Hello Taro.
  - role: Student
    utterance: Hello Andre. How are you?
  - role: Teacher
    utterance: I’m good thanks.
  - role: Student
    utterance: So, I’ve asked you here because I want to get your opinion on which
      hotel we should book for Mr. Kato and his associates. As you know, they will
      be visiting us next month when they attend the SDGs in Oceania conference.
  - role: Teacher
    utterance: I think the conference will be held at the Melbourne Conference and
      Exhibition Centre. Is that right?
  - role: Student
    utterance: Yes, that’s correct. So somewhere nearby and within walking distance
      would be ideal.
  - role: Teacher
    utterance: Okay. I think the best option then is the Novotel at South Wharf.
  - role: Student
    utterance: Really? I thought the Pan Pacific would be better.
  - role: Teacher
    utterance: Certainly, the Pan Pacific is closer. But it’s also more expensive.
      The Novotel is a little further away from the conference centre, but it’s closer
      to the CBD and so it has better access to the embassy. Also, it’s on the CBD
      side of the river. As you know, the area around the conference centre isn’t
      that interesting.
  - role: Student
    utterance: Yes. I guess you are right.
  - role: Teacher
    utterance: At the same time, I think the Novotel might be cheaper than the Pan
      Pacific, while still providing good quality rooms and service.
  - role: Student
    utterance: Okay. Then I will contact the Novotel at South Wharf today and check
      their room availability. Thanks for your recommendation. It’s been very helpful.
  - role: Teacher
    utterance: No problem. I’m happy to help.
  roleplay1_target_vocabulary:
  - term: associate
    level: C1
  - term: availability
    level: B2
  - term: ideal
    level: B2
  writing_task_key_expressions:
  - category_en: Advising strongly on best choice
    category_ja: 明確に推奨する
    items:
    - I'd like to clearly recommend the Novotel at South Wharf.
  - category_en: Explaining clearly the advantages of one choice over another
    category_ja: 選択肢の利点を比較して説明する
    items:
    - The Novotel is a little further away but offers better access to the city centre.
  writing_task_model:
    subject: Hotel Suggestion for Conference Guests
    body: 'Dear Susan,

      Thank you for talking about hotel options with me today. I''d like to clearly
      recommend the Novotel at South Wharf for the dignitaries visiting Melbourne
      next month for the conference.

      The Novotel is a good choice because it is close to the conference centre and
      easy to get to. It offers comfortable rooms, friendly service, and good prices,
      making it very good value.

      The Pan Pacific is closer to the centre but costs more. The Novotel is a little
      further away but offers better access to the city centre and our consulate,
      making it more convenient overall.

      I believe the Novotel is the best choice considering location, cost, and quality.

      Please let me know if you have any questions.

      Best regards,

      Taro Suzuki'
  writing_task_target_vocabulary:
  - term: associate
    level: C1
  - term: availability
    level: B2
  - term: ideal
