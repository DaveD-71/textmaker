- situation_id: D09
  cefr_target: B2
  purpose_objectives:
    en: 'Requesting goods and services.

      Can state requirements and ask detailed questions regarding more complex services,
      e.g., rental agreements.'
    ja: '商品やサービスを依頼する。

      賃貸契約など、より複雑なサービスに関して、要件を述べたり、詳細な質問をすることができる。'
  roleplays:
  - id: 1
    en: 'You have been assigned to the consulate in Canberra. You will be moving to
      an apartment in Canberra next month. You found the apartment online, and you
      have just returned from visiting the apartment. You like it, want to move in.
      Before signing the contract, you need to check the following with the real estate
      agent: (1) the exact payment necessary to secure the apartment and the payment
      procedure; (2) when you can get the keys to the apartment; (3) any contract
      cancellation fees which would apply should you need to suddenly return to Japan.'
    ja: あなたはキャンベラの領事館に赴任することになりました。来月、キャンベラのアパートに引っ越す予定です。あなたはそのアパートをインターネットで見つけ、見学から帰ってきたところです。気に入ったので、入居を希望しています。契約前に不動産会社に、(1)アパートを確保するために必要な支払額と支払方法、(2)アパートの鍵をいつ受け取れるか、(3)突然日本に帰国しなければならなくなった場合の契約解除料などを確認する必要があります。
  - id: 2
    en: 'You were assigned to London for a 2-year placement. You have worked at the
      consulate for the last 18 months. Due to a family emergency, you need to end
      your placement early and return to Japan. Contact your real estate agent and
      explain the situation. Find out the following: (1) what are the costs for ending
      the apartment contract early; (2) can the agent assist you with selling the
      furniture you bought; (3) when do you need to return the apartment key.'
    ja: あなたは2年間の予定でロンドンに配属されました。これまでに18ヶ月間、領事館に勤務しています。家族の緊急事態のため、派遣を早期に終了し、日本に帰国する必要があります。不動産会社に連絡し、状況を説明してください。次のことを確認してください。(1)
      契約の早期終了にかかる費用はどのくらいか (2) 購入した家具の売却を手伝ってもらえるか (3) 鍵はいつまでに返せばよいか。
  writing_task:
    description_en: 'You are relocating to Canberra and have found a suitable apartment.

      Write a polite, clear email to the real estate agent that:

      confirms any details you need before signing the contract (e.g., rent, payment
      method),

      asks about the payment procedure,

      confirms when you will receive the keys,

      inquires about cancellation fees in case of an unexpected return to Japan.'
    description_ja: 'キャンベラの新任地での勤務に伴い、住居として適した物件を見つけました。

      契約前に以下の内容を不動産会社に確認する必要があります：

      契約前に確認したい事項（例：契約金額、支払い方法など）

      支払い方法や金額を含む手続きの詳細

      鍵の受け渡し時期の確認

      急な帰国による契約キャンセル時の費用についての問い合わせ'
  roleplay1_key_expressions:
  - category_en: Asking about costs
    category_ja: 費用について尋ねる
    items:
    - Well the most important thing of course is the cost. I understand what the monthly
      rental fee is, but I’d like to know about the setup costs.
  - category_en: Asking about procedures
    category_ja: 手順について尋ねる
    items:
    - So, how do I go about making the payment? / And what about the monthly rent?
      How do I make the rent payment?
  - category_en: Stating a requirement
    category_ja: 必要条件を述べる
    items:
    - I’ll need to move in the weekend before that, on Saturday, the 13th.
  roleplay_model:
  - role: Teacher
    utterance: So, Mr. Suzuki, what did you think of the apartment?
  - role: Student
    utterance: It’s quite nice. I like the location. The local train station is just
      a short walk from the apartment, which would be very convenient. Also, the area
      seems nice.
  - role: Teacher
    utterance: Yes, it’s quite a popular neighborhood right now. A lot of new cafes
      and restaurant have opened up in the last few years.
  - role: Student
    utterance: That’s good to know. So, I’d like to take the apartment, but there
      are a few things I need to check with you first, if that’s okay.
  - role: Teacher
    utterance: Certainly. Please have a seat and we can discuss the details.
  - role: Student
    utterance: Thank you.
  - role: Teacher
    utterance: So, what would you like to know first?
  - role: Student
    utterance: Well the most important thing of course is the cost. I understand what
      the monthly rental fee is, but I’d like to know about the setup costs.
  - role: Teacher
    utterance: Sure. We ask you to pay a two-month deposit, and the first month’s
      rent up front. The deposit is returned to you when you move out after the apartment
      is inspected. If the apartment is damaged in anyway, or requires cleaning, then
      those costs will come out of the apartment. Of course, we will do an inspection
      with you before you move in, and take note of any already existing scratches
      or marks in the apartment, and you will get a record of that. We do the same
      thing when you leave, and then we simply compare the lists.
  - role: Student
    utterance: I see. That sounds very straightforward. Do I need to pay any additional
      fees?
  - role: Teacher
    utterance: No, there are no additional upfront fees.
  - role: Student
    utterance: Really? That’s a nice surprise. I was expecting to have to pay some
      fees for the preparation of the contract.
  - role: Teacher
    utterance: Well, a small amount of your monthly rent goes to covering administration
      costs.
  - role: Student
    utterance: I see. That makes sense, I guess. So, how do I go about making the
      payment?
  - role: Teacher
    utterance: You can pay cash here at the branch, or you can pay by cheque, or we
      take VISA or Mastercard as well.
  - role: Student
    utterance: I see. That’s easy enough. And what about the monthly rent? How do
      I make the rent payment?
  - role: Teacher
    utterance: There are a few options. We can set up an automatic withdrawal from
      your bank account, or we can charge your credit card monthly.
  - role: Student
    utterance: Okay. I understand. Well, it all sounds very reasonable. So, what’s
      the next step?
  - role: Teacher
    utterance: Great! Well, let me contact the apartment’s owner and let them know.
      They need to give approval. Then, we will write up a rental contract. When can
      you move in?
  - role: Student
    utterance: I will be moving to Canberra next month. As you know, I will be working
      for the Embassy of Japan. I think I will start on Monday, the 15th. I’ll need
      to move in the weekend before that, on Saturday, the 13th.
  - role: Teacher
    utterance: Okay. We will prepare the contract based on a move-in date of Saturday,
      the 13th.
  - role: Student
    utterance: When will I be able to get the apartment keys?
  - role: Teacher
    utterance: After the contract is prepared and signed, and the initial deposit
      and rent is paid, you can pick up the keys from the office here.
  - role: Student
    utterance: Great. Then I will come here early on Saturday, the 13th. One last
      question. It is possible I could be called back to Japan early, before my apartment
      contract ends. What would happen in that situation?
  - role: Teacher
    utterance: Okay, well there is a small fee in that case. It’s half the deposit.
      That gives us some time then to find another occupant.
  - role: Student
    utterance: I see. That seems reasonable.
  - role: Teacher
    utterance: Okay. Let me contact the owner today, and I will contact you afterwards
      about the contract.
  - role: Student
    utterance: Okay. That sounds good. Thank you very much for your time today, Robin.
  - role: Teacher
    utterance: No problem at all Mr. Suzuki. Have a great day.
