  writing_task_key_expressions:
  - category_en: Explaining step-by-step clearly
    category_ja: 手順を明確に説明する
    items:
    - 'To apply, they need: A valid passport with blank pages.'
  - category_en: Encouraging additional questions
    category_ja: 追加の質問を促す
    items:
    - Let me know if you have any questions!
  writing_task_model:
    subject: Visa Application Process for US Citizens
    body: 'Dear Fiona,

      Welcome to the consulate! As part of your training, I want to explain the visa
      application process for US citizens.

      There are different types of visas, such as tourist visas, business visas, and
      student visas. People must apply at our consulate if they live in certain states,
      including Illinois, Indiana, and Wisconsin.

      To apply, they need:

      - A valid passport with blank pages.

      - A visa application form, which they can get online or at our office.

      - A recent passport photo.

      - Extra documents based on the visa type (for example, a company letter for
      a business visa).

      They can apply in person, by mail, or send someone for them.

      Visa rules change sometimes, so always check the consulate’s website for updates.
      Let me know if you have any questions!

      Best regards,

      Taro Suzuki

      Japanese Consulate in Chicago'
