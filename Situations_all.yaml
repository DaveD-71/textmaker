- situation_id: D07
  cefr_target: B2
  purpose_objectives:
    en: 'Dealing with problems.

      Explain the failure of a product purchased for the workplace to the vendor,
      demand satisfactory compensation in a convincing manner, and negotiate based
      on the vendor''s arguments.'
    ja: 'トラブルに対処する。

      職場が購入した製品の故障について、販売業者に対し説明し、満足が得られるような補償を説得力ある言葉で要求し、業者側の言い分を踏まえ、交渉することができる。'
  roleplays:
  - id: 1
    en: 'Recently your office ordered a small laser jet printer. However, since it
      arrived it has had problems: It jams almost every time you try to print an address
      on an envelope, and sometimes the ink smudges after it is printed. You want
      to return the printer. Contact the vendor, explain the situation. Request to
      return to the printer and negotiate a solution to the problem.'
    ja: 最近、あなたのオフィスでは、小型のレーザージェットプリンターを注文しました。しかし、それが届いてから、問題が発生しています。封筒に宛先を印刷しようとすると必ず詰まり、印刷後にインクがにじむこともあります。このプリンターを返品したいと思います。業者に連絡し、状況を説明してください。プリンターの返却を依頼し、問題の解決策を交渉してください。
  - id: 2
    en: 'Recently your office ordered a combined microphone and speaker for video
      conferences. It was expensive. However, since it arrived it has had problems:
      Sometimes the audio cuts out and you cannot hear what is being said. Also, the
      overall sound quality is not great. You want to return the device. Contact the
      vendor, explain the situation. Request to return to the device and negotiate
      a solution to the problem.'
    ja: 最近、あなたのオフィスでは、ビデオ会議用にマイクとスピーカーを組み合わせたものを注文しました。高価なものでした。しかし、それが届いてから、問題が発生しています。時々、音声が途切れ、何を言っているのか聞こえなくなります。また、全体的な音質もよくありません。購入品を返品したいと思います。業者に連絡し、状況を説明してください。購入品の返却を依頼し、問題の解決策を交渉してください。
  writing_task:
    description_en: 'Following Roleplay 1, write an email to the vendor confirming
      your discussion about returning a faulty printer.

      Your email should:

      describe the problems you experienced (e.g., paper jamming, ink smudging),

      confirm the agreement to return the product and discuss compensation,

      express appreciation for their cooperation,

      request written confirmation of the agreed-upon solution,

      maintain a polite and professional tone.'
    description_ja: 'ロールプレイ1での電話を受け、故障したプリンターの返品と補償についての合意内容を業者にメールで確認します。

      メールには以下を含めてください：

      プリンターの問題点（例：紙詰まり、インクのにじみ）の記述、

      返品と補償に関する合意内容の確認、

      協力への感謝の表明、

      書面による確認の依頼、

      丁寧で専門的な文体を使用すること。'
  roleplay1_key_expressions:
  - category_en: Stating a problem
    category_ja: 問題を述べる
    items:
    - We’re having problems with the printer.
  - category_en: Stating uncertainty
    category_ja: 不確実性を述べる
    items:
    - I’m not sure what’s causing it.
  - category_en: Stating desired action
    category_ja: 望ましい行動を述べる
    items:
    - I think it’s a problem with just this printer, so I’m happy to replace it.
  roleplay_model:
  - role: Teacher
    utterance: Office Goods. This is James speaking. How may I help you?
  - role: Student
    utterance: Hello James. This is Taro Suzuki at the Japanese embassy.
  - role: Teacher
    utterance: Hello Mr. Suzuki. How are you today?
  - role: Student
    utterance: I’m fine thanks, James. I’m calling about the laser printer we ordered
      from your company last month.
  - role: Teacher
    utterance: Yes, I remember the order. Is everything okay.
  - role: Student
    utterance: Well, actually, we’re having problems with the printer.
  - role: Teacher
    utterance: I’m sorry to hear that. What seems to be the problem?
  - role: Student
    utterance: Since it arrived, it’s jammed almost every time we try to print address
      on envelopes. It seems it can’t feed the envelope properly through the machine.
      I’m not sure what’s causing it.
  - role: Teacher
    utterance: I see. So, looking at the order information here… You ordered the Canon
      imageCLASS laser printer.
  - role: Student
    utterance: That’s right. That was the recommended printer for our budget.
  - role: Teacher
    utterance: That model should be able to handle envelopes. Are they standard size
      envelopes?
  - role: Student
    utterance: Yes, they are.
  - role: Teacher
    utterance: I see. Are you having any other problems?
  - role: Student
    utterance: Actually, there is one other issue. Sometimes the ink smudges. It’s
      as if it hasn’t set. I don’t know much about printers, but I don’t think we
      need to wait for the ink to dry.
  - role: Teacher
    utterance: No, you certainly don’t. Hmmm. Okay, I’m sorry for the problems you’ve
      been having. How would you like me to address this?
  - role: Student
    utterance: Well, obviously we need to return the printer.
  - role: Teacher
    utterance: Of course. Would you like a refund or would you like us to replace
      it.
  - role: Student
    utterance: Honestly, I think it’s a problem with just this printer, so I’m happy
      to replace it.
  - role: Teacher
    utterance: Okay, we will send one out to you immediately. At the same time, we
      can collect the one you currently have in the office. In addition, we will credit
      your account 15% of the cost of the printer for the inconvenience.
  - role: Student
    utterance: Oh. Well, thank you. That’s very kind of you.
  - role: Teacher
    utterance: No problem at all. So, I’ve checked our inventory and we have a printer
      in stock. We can get it to you in two days. Is that okay.
  - role: Student
    utterance: Yes, that would be fine. Thanks for everything James.
  - role: Teacher
    utterance: No problem, Mr. Suzuki. Again, I’m sorry for the inconvenience. I hope
      you have a good day.
  - role: Student
    utterance: Thanks, you too. Goodbye.
  - role: Teacher
    utterance: Goodbye.
