- situation_id: F05
  cefr_target: B1
  purpose_objectives:
    en: 'Explaining procedures.

      In response to inquiries about tourist visas and other applications, explain
      specific information and answer additional questions.'
    ja: '手順を説明する。

      観光ビザなどの申請についての問い合わせに対し、具体的な情報を説明し、追加での質問に回答することができる。'
  roleplays:
  - id: 1
    en: You work in the Japanese embassy in Sydney. You have received an enquiry asking
      how to apply for a tourist visa. Tell the person she needs to submit visa application
      documents along with her application form. Answer any questions she may ask.
    ja: あなたは在シドニー日本大使館に勤務しています。観光ビザ申請に関する問い合わせを受けました。申請書の他に提出が必要な書類がある旨を伝えてください。また、追加の質問があれば対応してください。
  - id: 2
    en: You are working in the consulate in Los Angeles. You have received a phone
      call from someone asking about a student visa. Answer any questions the person
      may have.
    ja: あなたはロサンゼルスの領事館に勤務しています。学生ビザについて問い合わせの電話がありました。その人の質問に答えてください。
  writing_task:
    description_en: 'Following Roleplay 1, you need to confirm the visa application
      process.

      Write an email that:

      summarizes the key steps in the application process,

      includes a link to the official website containing the full procedure,

      offers to answer any follow-up questions.'
    description_ja: 'ロールプレイ1に基づき、ビザ申請手続きについて確認する必要があります。

      以下の内容を含めたメールを作成してください：

      ビザ申請手続きの主なステップの要約、

      手続きの全体的な流れが記載された公式ウェブサイトのリンクの提示、

      質問があれば対応する旨の申し出。'
  roleplay1_key_expressions:
  - category_en: Giving directions
    category_ja: 案内する
    items:
    - First, please make an appointment at your local Japanese consulate.
  - category_en: Explaining costs
    category_ja: 費用を説明する
    items:
    - Yes, there is a small fee. It’s 3,000 Japanese yen. About 30 US dollars.
  - category_en: Giving extra information
    category_ja: 追加情報を与える
    items:
    - There is also a helpful FAQ.
  roleplay_model:
  - role: Teacher
    utterance: Hello. I would like to know how to apply for a tourist visa.
  - role: Student
    utterance: Hello. First, please make an appointment at your local Japanese consulate.
  - role: Teacher
    utterance: I see. May I ask what documents are needed?
  - role: Student
    utterance: Sure. Please bring your passport. Also, please bring the visa application
      form.
  - role: Teacher
    utterance: Is there a fee? What does it cost?
  - role: Student
    utterance: Yes, there is a small fee. It’s 3,000 Japanese yen. About 30 US dollars.
      The information is on our website.
  - role: Teacher
    utterance: I see. How can I make an appointment?
  - role: Student
    utterance: You can do it on the website. Also, the website has a tourist visa
      form. Please complete it and print it out. There is also a helpful FAQ.
  - role: Teacher
    utterance: I see. Thank you for your help.
  - role: Student
    utterance: No problem. Goodbye.
  - role: Teacher
    utterance: Goodbye.
  roleplay1_target_vocabulary:
  - term: application
    level: B1
  - term: apply
    level: B1
  - term: visa
    level: B1
  writing_task_key_expressions:
  - category_en: Explaining step-by-step process
    category_ja: 手順を明確に説明する
    items:
    - 'To apply, please follow these steps:'
  - category_en: Encouraging follow-up questions
    category_ja: 追加の質問を促す
    items:
    - If you have questions, please contact us.
  writing_task_model:
    subject: Tourist Visa Application Process
    body: 'Dear Sir or Madam,

      Thank you for your question about getting a tourist visa for Japan.

      To apply, please follow these steps:

      Check if you can apply online: Some travelers can use the eVISA system. See
      the list of eligible countries here: www.mofa.go.jp/j_info/visit/visa.

      Prepare your documents: You need a valid passport, a visa application form,
      and a recent passport photo.

      Make an appointment: If you cannot apply online, visit the nearest Japanese
      Embassy or Consulate.

      Pay the fee: The visa costs 3,000 yen (about 30 USD). You must pay when submitting
      your application.

      Submit your application: Give your documents to the consulate and wait for processing.
      Processing time may vary.

      For more details, visit: www.mofa.go.jp/j_info/visit/visa. If you have questions,
      please contact us.

      Best regards,

      Taro Suzuki

      Japanese Embassy in Sydney'
  writing_task_target_vocabulary:
  - term: application
    level: B1
  - term: apply
    level: B1
  - term: visa
    level: B1
- situation_id: F06
  cefr_target: B1
  purpose_objectives:
    en: 'Giving directions.

      When a problem arises in your work, you can give instructions or make a request
      to the older local staff member in charge of that work without being rude.'
    ja: '案内する。

      業務上で問題が生じた際に、その業務担当の年上の現地職員へ失礼のないよう業務の指示や依頼を行うことができる。'
  roleplays:
  - id: 1
    en: You work at the Japanese embassy in Sydney. A newspaper wasn’t delivered this
      morning. Ask a senior local staff member to have it delivered as soon as possible.
    ja: 今朝、朝刊が届きませんでした。至急届けてもらうよう、現地のシニア・スタッフに依頼してください。
  - id: 2
    en: You work in the consulate in Auckland. The electricity in your apartment stopped
      working this morning. Ask a senior local staff member to contact the electricity
      company and fix the problem.
    ja: あなたはオークランドにある領事館に勤務しています。今朝、あなたのアパートの電気が止まってしまいました。現地のシニア・スタッフに電力会社に連絡し、問題を解決してもらうよう依頼してください。
  writing_task:
    description_en: 'Following Roleplay 1, you need to follow up on newspaper delivery
      issues.

      Write an email to the local newspaper agent that:

      explains you have not received the newspaper for the third time in two weeks,

      politely requests an explanation for the recurring problem,

      asks for a solution to ensure reliable delivery.'
    description_ja: 'ロールプレイ1に基づき、最近の新聞配達に関する問題についてフォローアップする必要があります。

      以下の内容を含めて、新聞販売店に送るメールを作成してください：

      ここ2週間で3回新聞が配達されていないことの説明、

      このような問題が繰り返されている理由について丁寧に説明を求める、

      今後確実に配達されるような対応策の依頼。'
  roleplay1_key_expressions:
  - category_en: Making a request
    category_ja: 依頼をする
    items:
    - Can you do me a favor?
  - category_en: Stating a problem
    category_ja: 問題を述べる
    items:
    - This morning’s newspaper hasn’t arrived yet.
  - category_en: Giving directions
    category_ja: 案内する
    items:
    - Please call the news agency.
  roleplay_model:
  - role: Student
    utterance: Excuse me, John.
  - role: Teacher
    utterance: Yes, Mr. Sakamoto. What can I do for you?
  - role: Student
    utterance: Can you do me a favor?
  - role: Teacher
    utterance: Sure. What is it?
  - role: Student
    utterance: This morning’s newspaper hasn’t arrived yet.
  - role: Teacher
    utterance: I see.
  - role: Student
    utterance: Please call the news agency. I want them to deliver it ASAP. There’s
      some important information in it. I need to check it asap.
  - role: Teacher
    utterance: Certainly. I’ll do it straight away.
  - role: Student
    utterance: Thanks John.
  - role: Teacher
    utterance: No problem.
  roleplay1_target_vocabulary:
  - term: agency
    level: B1
  - term: deliver
    level: B1
  - term: favor
    level: B1
  writing_task_key_expressions:
  - category_en: Informing clearly about repeated issues
    category_ja: 繰り返される問題を報告する
    items:
    - This is the third time in two weeks that it has not arrived.
  - category_en: Asking clearly for immediate action
    category_ja: 迅速な解決を求める
    items:
    - Please check why this problem is happening and let us know what you will do
      to fix it.
  writing_task_model:
    subject: Newspaper Delivery Problem
    body: 'Dear Newspaper Agent,

      I am writing from the Japanese Embassy in Sydney. We have a subscription to
      your newspaper, but we did not receive it this morning. This is the third time
      in two weeks that it has not arrived.

      We need the newspaper every day for local news and updates. Please check why
      this problem is happening and let us know what you will do to fix it.

      We hope for a quick solution so we can receive the newspaper on time.

      Thank you for your help.

      Best regards,

      Taro Suzuki

      Administration Section

      Japanese Embassy'
  writing_task_target_vocabulary:
  - term: agency
    level: B1
  - term: deliver
    level: B1
  - term: favor
    level: B1
- situation_id: F07
  cefr_target: B1
  purpose_objectives:
    en: 'Responding to invitations.

      When a counterpart invites you or your boss to dinner, you can simply give the
      reason for your absence without being rude. (For example, if the invitation
      is from an interested party.)'
    ja: '招待に応じる。

      カウンターパートからの上司や自分への会食の招待に対し、簡単に理由を伝えて失礼のないようにことわることができる。（例えば利害関係者からの招待の場合等）'
  roleplays:
  - id: 1
    en: You work at the embassy in Belarus. A local businessman has invited your boss
      to a dinner party next Saturday. Your boss already has a commitment on the date
      of the party. Call the businessman and politely reject his invitation.
    ja: あなたはベラルーシの大使館に勤務しています。地元のビジネスマンがあなたの上司を次の土曜日のディナーパーティーに招待しています。あなたの上司はパーティーの日、すでに別の約束があります。そのビジネスマンに電話をして、丁重に招待を断ってください。
  - id: 2
    en: You work at the consulate in Perth. A local government official has invited
      you to have lunch with him on Friday near your office. However, you now have
      to go out of town on business. Contact the government official and cancel the
      appointment.
    ja: あなたはパースの領事館に勤務しています。ある地方政府の役人から、金曜日にオフィスの近くで一緒に昼食を取らないかと誘われました。しかし、あなたは今、仕事で郊外に行かなければならなくなりました。その役人に連絡を取り、約束をキャンセルしてください。
  writing_task:
    description_en: 'Following Roleplay 1, your boss is unable to attend a dinner
      party invitation.

      Write an email to the local businessman that:

      politely declines the invitation on behalf of your boss,

      expresses sincere apologies for not being able to attend,

      provides a valid reason for the absence,

      maintains a professional and courteous tone.'
    description_ja: 'ロールプレイ1に基づき、上司がディナーパーティーへの招待を辞退しなければならなくなりました。

      以下の内容を含めて、地元の実業家に送るメールを作成してください：

      上司に代わって招待を辞退すること、

      出席できないことへの丁寧なお詫び、

      欠席の正当な理由の説明、

      専門的かつ礼儀正しい文体を保つこと。'
  roleplay1_key_expressions:
  - category_en: Introducing yourself on the phone
    category_ja: 電話で自己紹介をする
    items:
    - This is Taro Suzuki at the Japanese embassy.
  - category_en: Declining an invitation
    category_ja: 招待を断る
    items:
    - I’m sorry but Mr. Hashimoto cannot attend.
  - category_en: Giving a reason
    category_ja: 理由を説明する
    items:
    - He is away on business.
  roleplay_model:
  - role: Teacher
    utterance: Hello. This is Alexsandr Adamovich.
  - role: Student
    utterance: Hello Mr. Adamovich. This is Taro Suzuki at the Japanese embassy.
  - role: Teacher
    utterance: Yes, Mr. Suzuki. What can I do for you?
  - role: Student
    utterance: We received your invitation to Mr. Hashimoto for dinner next Saturday.
  - role: Teacher
    utterance: Good. I look forward to talking with him.
  - role: Student
    utterance: I’m sorry but Mr. Hashimoto cannot attend. He already has another appointment
      at that time. In fact, he will be out of the country.
  - role: Teacher
    utterance: I see. That is a shame. I hope I can get the chance to talk with him
      soon. When will he come back?
  - role: Student
    utterance: He is away on business. He is not yet sure when he can come back.
  - role: Teacher
    utterance: I see. Well, when he comes back. Please ask him to contact me.
  - role: Student
    utterance: I see. I will pass on the message when he returns.
  - role: Teacher
    utterance: Thank you.
  - role: Student
    utterance: Goodbye.
  - role: Teacher
    utterance: Goodbye.
  roleplay1_target_vocabulary:
  - term: chance
    level: B1
  - term: pass on
    level: B1
  writing_task_key_expressions:
  - category_en: Clearly and politely refusing
    category_ja: 丁寧に招待を断る
    items:
    - He already has another plan on that day, so he cannot attend.
  - category_en: Showing interest in future invitations
    category_ja: 今後の招待に関心を示す
    items:
    - Please let us know about any future events. He would be happy to join if possible.
  writing_task_model:
    subject: Apologies - Unable to Attend Dinner
    body: 'Dear Mr. Adamovich,

      I hope you are doing well.

      I am writing to Mr. Hashimoto about your invitation to dinner next Saturday.
      Thank you for inviting him. He is grateful for the invitation and appreciates
      your kindness.

      However, he already has another plan on that day, so he cannot attend. He is
      sorry to miss this chance to meet you. He hopes there will be another opportunity
      to talk in the future.

      We are thankful for your invitation. Please let us know about any future events.
      He would be happy to join if possible.

      Thank you for your understanding.

      Best regards,

      Taro Suzuki

      Japanese Embassy'
  writing_task_target_vocabulary:
  - term: chance
    level: B1
  - term: pass on
    level: B1
- situation_id: F08
  cefr_target: B1
  purpose_objectives:
    en: 'Dealing with problems.

      Can take part in routine formal discussion of familiar subjects which is clearly
      articulated in the standard form of the language or a familiar variety and which
      involves the exchange of factual information, receiving instructions or the
      discussion of sol'
    ja: 'トラブルに対処する。

      身近な話題について、日常行われる公式の話し合いに参加できる。その話し合いは、標準的、もしくはイディオム等を含む言語で明確に表現され、事実関係の情報交換、指示の受領、または実際的な問題を解決するための議論が行われる。'
  roleplays:
  - id: 1
    en: You work in the consulate in Seattle. You are having a meeting about the staff
      schedule. A local staff is sick, and his work for the next few days needs to
      be covered by the other staff. Discuss the schedule options and choose the best
      one.
    ja: あなたはシアトルの領事館に勤務しています。あなたはスタッフのスケジュールについて会議をしています。現地スタッフが病気で、今後数日間、そのスタッフの仕事を他のスタッフがカバーする必要があります。スケジュールについて話し合い、最も良いオプションを選んでください。
  - id: 2
    en: You work in the consulate in Edinburgh. You are having a meeting about a complaint.
      After a recent visa application, the person applying for the visa sent a letter
      to the visa office manager complaining about the service. She said the staff
      was rude to her and did not help her with the application. Discuss and decide
      the best way to respond to the applicant.
    ja: あなたはエジンバラの領事館に勤務しています。あなたはある苦情についてミーティングを行っています。最近ビザを申請した人から、ビザオフィスのマネージャー宛てに、サービスに対する苦情の手紙が送られてきました。その人は、スタッフが自分に対して無礼で、申請の手助けをしてくれなかったと言っています。この申請者への最善の対応方法について話し合い、決定してください。
  writing_task:
    description_en: 'Following Roleplay 1, you are responsible for communicating staff
      coverage for a sick colleague.

      Write an email to consulate staff that:

      explains the situation and the need for coverage,

      briefly outlines the options discussed during the meeting,

      presents the final agreed-upon schedule,

      lists the shifts assigned to each staff member,

      includes any additional instructions.

      Keep your message clear, organized, and professional.'
    description_ja: 'ロールプレイ1に基づき、同僚の病欠に伴う勤務対応について、領事館のスタッフに連絡する必要があります。

      以下の内容を含めたメールを作成してください：

      病欠の状況と勤務対応が必要であることの説明、

      会議で話し合われた対応案の概要、

      最終的に合意された勤務スケジュール、

      各スタッフに割り当てられた勤務シフトの一覧、

      その他の指示事項があればそれも記載。'
  roleplay1_key_expressions:
  - category_en: Discussing options
    category_ja: 選択肢について話し合う
    items:
    - There are just four staff in the consulate section. So, the three of us will
      have to take on his work.
  - category_en: Offering support
    category_ja: 支援を提供する
    items:
    - Well, I can do the back-end visa processing.
  - category_en: Expressing limitations
    category_ja: 制限を述べる
    items:
    - However, I already have a lot of appointments over the next week. So, I can’t
      meet the visa applicants.
  roleplay_model:
  - role: Teacher
    utterance: Hello Taro. Thanks for joining me this morning.
  - role: Student
    utterance: No problem.
  - role: Teacher
    utterance: I think you have probably already heard that John is sick and he won’t
      be able to come to work for the next few days.
  - role: Student
    utterance: Yes. I heard. I hope he gets better soon.
  - role: Teacher
    utterance: Yes, of course. We all do. At the same time though, we need to make
      sure his work is covered.
  - role: Student
    utterance: I see.
  - role: Teacher
    utterance: So, this morning I would like to talk about the options. As far as
      I can see, there aren’t many.
  - role: Student
    utterance: Well, no, I guess not. I mean, there are just four staff in the consulate
      section. So, the three of us will have to take on his work.
  - role: Teacher
    utterance: Yes, that’s right. How do you want to handle it?
  - role: Student
    utterance: Well, I can do the back-end visa processing. However, I already have
      a lot of appointments over the next week. So, I can’t meet the visa applicants.
  - role: Teacher
    utterance: Okay, well let me talk to Satomi. I think she could do that.
  - role: Student
    utterance: Great.
  - role: Teacher
    utterance: And what about the other admin tasks he usually does?
  - role: Student
    utterance: He helps with checking invoice payments each month. But I think Adam
      can do that this month. He has done it before.
  - role: Teacher
    utterance: Oh, okay. I’ll talk with him about it.
  - role: Student
    utterance: No problem. Is there anything else?
  - role: Teacher
    utterance: No. I think that’s it.
  - role: Student
    utterance: Okay. If you need any more help, let me know.
  - role: Teacher
    utterance: Thanks. I’ll do that.
  roleplay1_target_vocabulary:
  - term: handle
    level: B1
  - term: i guess not
    level: B2
  - term: option
    level: B1
  - term: payment
    level: B2
  - term: process
    level: B2
  - term: section
    level: B1
  - term: take on
    level: B2
  - term: task
    level: B2
  - term: though
    level: B1
  writing_task_key_expressions:
  - category_en: Providing detailed schedule updates
    category_ja: 詳細なスケジュールを伝える
    items:
    - 'Monday: Morning: Akiko, Afternoon: Emily.'
  - category_en: Asking clearly for quick updates on issues
    category_ja: 問題があれば迅速な連絡を求める
    items:
    - If you have any problems or need to change shifts, let me know as soon as possible.
  writing_task_model:
    subject: Staff Schedule Update
    body: 'Dear Team,

      I hope you are doing well.

      As we discussed in our meeting today, we need to adjust the schedule while John
      is away. Since we have a small team, we all need to help with his work. After
      thinking about the options, we decided on this plan for the next few days.

      Monday:

      - Morning: Akiko

      - Afternoon: Emily

      Tuesday:

      - Morning: David

      - Afternoon: Emily

      Wednesday:

      - Morning: Akiko

      - Afternoon: David

      Thursday:

      - Morning: Emily

      - Afternoon: Akiko

      Friday:

      - Morning: David

      - Afternoon: Emily

      Please arrive on time for your shifts and check if anything needs to be done.
      If you have any problems or need to change shifts, let me know as soon as possible.

      Thank you for your help. I appreciate your support.

      Best regards,

      Taro Suzuki

      Administration Section

      Japanese Consulate'
