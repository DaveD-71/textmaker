- situation_id: D08
  cefr_target: B2
  purpose_objectives:
    en: 'Dealing with problems.

      Can explain a problem which has arisen and make it clear that the provider of
      the service/customer must make a concession.'
    ja: 'トラブルに対処する。

      問題があることを説明し、サービスを提供する側、または受ける側が譲歩しなければならないことを明確にできる。'
  roleplays:
  - id: 1
    en: You work at the consulate in Sydney and are organizing a dinner party for
      30 people for a visiting Japanese dignitary. The event is scheduled for three
      weeks from now. Last week, a local staff member booked a restaurant at your
      request. Today, that staff member informed you that the restaurant has double
      booked and is asking to change the date. However, you have already sent invitations,
      and the dignitary’s schedule has been arranged around the dinner. Changing the
      date would cause significant inconvenience. Instruct the staff member to contact
      the restaurant and explore options. You are willing to adjust the time by an
      hour or two earlier, but not the date. You are also open to changing the location
      if the restaurant can help find an alternative of equal quality and price. If
      the new venue costs more, tell the restaurant they are expected to cover the
      difference.
    ja: あなたはシドニーの領事館に勤務しており、日本からの来賓のために30名規模の夕食会を企画しています。イベントは3週間後に予定されています。先週、あなたの依頼で現地職員がレストランを予約しましたが、今日、その職員から「レストラン側がダブルブッキングをしてしまい、日程の変更を求めてきた」と報告がありました。
      しかし、すでに招待状は送付済みで、来賓のスケジュールも夕食会を中心に調整されています。日程の変更は大きな支障となります。 現地職員に、レストランに連絡を取り、どのような対応が可能か確認させてください。時間の変更（予定より1〜2時間早める）には応じられますが、日程の変更は不可です。また、同等の品質と価格の別のレストランをレストラン側が紹介してくれるのであれば、場所の変更にも応じられます。もし新しいレストランの費用が当初の見積もりより高い場合は、差額をレストラン側が負担するよう伝えてください。
  - id: 2
    en: You work at the consulate in Toronto. You have booked a flight to Vancouver
      with a domestic airline to attend a meeting tomorrow. Your travel agent has
      called you to tell you the flight has been overbooked, and you no longer have
      a seat. They can put you on a later flight, but it will mean you will be an
      hour late for the meeting. Tell the travel agent you want them to put you on
      an earlier flight. If there is no earlier flight, then they should reduce the
      ticket cost for the later flight due to the inconvenience. You will have to
      get a taxi (instead of the train) to the meeting, and this will cost you extra.
    ja: あなたはトロントの領事館に勤務しています。明日の会議に出席するため、国内航空会社でバンクーバー行きの便を予約しました。旅行代理店から電話があり、その便はオーバーブッキングで、もう席を用意することができないと言われました。遅い便に変更することは可能とのことですが、そうすると会議に1時間遅刻することになります。旅行代理店に、もっと早い便にしてほしいと伝えてください。もし早い便がなければ、不便な分、遅い便のチケット代金は安く提供されるべきです。ミーティングに行くためには、電車ではなく、タクシーを使わなければなら
  writing_task:
    description_en: 'You are organizing a dinner party for a visiting dignitary, and
      the restaurant has reported a double-booking.

      Write an email to the local staff member responsible for the booking that:

      instructs them to maintain the original date while being flexible with time
      or location,

      outlines how to negotiate with the restaurant to find an alternative solution,

      emphasizes the importance of minimizing inconvenience to guests and the dignitary,

      directs them to ensure the restaurant covers any additional costs due to the
      change.'
    description_ja: '日本からの来賓の夕食会について、予約先のレストランが二重予約のため日程変更を要請してきました。

      担当の現地職員に送るメールに、以下を含めてください：

      日付の変更は不可であることを明確にし、時間や場所には柔軟に対応可能であること、

      レストラン側との交渉方法、代替案の提案、

      来賓および招待客への影響を最小限に抑えるように指示、

      費用の追加負担が発生した場合は、レストラン側が負担するよう求めるこ'
  roleplay1_key_expressions:
  - category_en: Expressing a problem
    category_ja: 問題を述べる
    items:
    - I understand that the restaurant has made a double-booking, and they want us
      to reschedule the dinner party. Is that right?
  - category_en: Suggesting solutions
    category_ja: 解決策を提案する
    items:
    - So, we need to talk about options… I think we could change the time of the dinner
      to either an hour earlier or an hour later, so 6:30pm or 8:30pm.
  - category_en: Asking for concessions
    category_ja: 譲歩を求める
    items:
    - Please let the manager know that if we cannot find a restaurant of roughly equal
      value, then he should cover some of the additional cost.
  roleplay_model:
  - role: Teacher
    utterance: Good morning. John Anderson speaking.
  - role: Student
    utterance: Hello John. It’s Taro. I’m calling to talk with you about the dinner
      party next month. I’ve just read the email you sent me last night. I thought
      we should talk about it.
  - role: Teacher
    utterance: Right. Thanks for following up.
  - role: Student
    utterance: So, let me just confirm a few points first if that’s okay.
  - role: Teacher
    utterance: Sure.
  - role: Student
    utterance: From your email, I understand that the restaurant has made a double-booking,
      and they want us to reschedule the dinner party. Is that right?
  - role: Teacher
    utterance: Yes, exactly.
  - role: Student
    utterance: Okay, well I don’t think that would be possible. First of all, the
      invitations have been sent out, and we have started to receive acceptances.
      Secondly, the visiting delegation have a very tight schedule. We cannot ask
      them to change it now.
  - role: Teacher
    utterance: I see.
  - role: Student
    utterance: So, we need to talk about options. I’d like you to follow up with the
      manager at the restaurant and find out what they can suggest. Right now, the
      dinner party is supposed to start at 7:30pm. I think we could change the time
      of the dinner to either an hour earlier or an hour later, so 6:30pm or 8:30pm.
  - role: Teacher
    utterance: Okay, I’ll let him know that. However, what should we do if they are
      still unable to take us?
  - role: Student
    utterance: We will need to find another location. Ask the manager for some recommendations
      in the area for restaurants at a similar price point. We will need to call a
      few and get quotes.
  - role: Teacher
    utterance: Okay, I’ll get onto it straight away.
  - role: Student
    utterance: Okay. John, there’s one more thing. We have paid a deposit to the restaurant,
      and we have confirmation of the schedule in writing in the email they sent us.
      I think it’s clear they should take some of the responsibility here.
  - role: Teacher
    utterance: Yes, I agree.
  - role: Student
    utterance: Please let the manager know that if we cannot find a restaurant of
      roughly equal value, then he should cover some of the additional cost. It was
      their mistake, not ours.
  - role: Teacher
    utterance: Sure. I’ll make sure I let him know.
  - role: Student
    utterance: Great. Thanks John. Let me know how it goes.
  - role: Teacher
    utterance: Sure. I’ll send an email later today with the updates.
  - role: Student
    utterance: Thanks.
  roleplay1_target_vocabulary:
