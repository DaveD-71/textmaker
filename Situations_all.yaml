    category_ja: 感謝を明確に伝える
    items:
    - Thank you for inviting me to the charity dinner.
  - category_en: Expressing willingness to continue support
    category_ja: 今後も関与したい意思を示す
    items:
    - Please let me know how I can help. I would like to stay involved.
  writing_task_model:
    subject: Thank You for the Charity Dinner
    body: 'Dear Mr. Anderson,

      I hope you are well.

      Thank you for inviting me to the charity dinner. I enjoyed meeting you and learning
      about your work. I appreciate what you and your team do for the community.

      Can you tell me about your plans for next year? What are the charity''s goals?
      Are there any events coming up?

      Please let me know how I can help. I would like to stay involved.

      Best regards,

      Taro Suzuki'
