- situation_id: C01
  cefr_target: B2
  purpose_objectives:
    en: 'Explaining a schedule.

      In a meeting to discuss the schedule of a visit by a Japanese dignitary, be
      able to explain the entire schedule in a logical manner, emphasize key points
      and relevant details in a supplementary manner, and respond flexibly to questions
      from the participants.'
    ja: 'スケジュールを説明する。

      日本からの要人来訪日程についての打ち合わせにおいて、日程全体について筋道を立てて説明し、要点や関連する詳細事項を補足的に強調することができ、出席者からの質問に対し、臨機応変に応答することができる。'
  roleplays:
  - id: 1
    en: You work in the Embassy in Washington DC. The assistant to the Minister of
      Foreign Affairs will visit the States to meet with his US counterpart. In the
      meeting, explain the schedule (it’s a 3-day trip), point out the important events
      (his meeting with his counterpart in the afternoon on Day 2, and dinner afterwards),
      and answer any questions that may come up in the meeting.
    ja: あなたはワシントンDCの大使館に勤務しています。外務大臣補佐官が米国を訪問し、米国のカウンターパートと会談します。打ち合わせで、訪問スケジュール（3日間の訪問であること）と、重要な予定（2日目の午後にカウンターパートと会談し、その後夕食会）について説明し、打ち合わせの出席者からの質問に答えてください。
  - id: 2
    en: You work in the Consulate-General in Chiang Mai. A staff member from MOFA
      will visit the consulate. In the meeting, explain the schedule (it’s a 2-day
      trip), point out the important events (a meeting with the consular staff in
      the afternoon on Day 1, and schedule for departure on Day 2), and answer any
      questions that may come up in the meeting.
    ja: あなたはチェンマイ総領事館に勤務しています。外務省の職員が領事館を訪問します。打ち合わせで、訪問スケジュール（2日間の訪問であること）と、重要な予定（1日目午後の領事館職員との打ち合わせ、2日目の出発スケジュール）について説明し、打ち合わせの出席者からの質問に答えてください。
  writing_task:
    description_en: 'Following Roleplay 1, write a detailed 3-day schedule summary.

      Your email must include:

      key events, including the meeting with his U.S. counterpart and other significant
      engagements,

      the date, time, and location of each event,

      any other relevant details.'
    description_ja: 'ロールプレイ1に基づき、3日間の訪問スケジュールを詳しくまとめてください。

      メールには以下を含めてください：

      米国のカウンターパートとの会談を含む主要なイベント

      各イベントの日時と場所

      その他関連する情報'
  roleplay1_key_expressions:
  - category_en: Sharing detailed information
    category_ja: 詳細な情報を共有する
    items:
    - Well, he has a meeting with Ms Sherman, the Deputy Secretary of State at 2pm.
      He is planning to review his speaking points in the morning and attend the meeting
      in the afternoon.
  - category_en: Sequencing
    category_ja: 順序を説明する
    items:
    - Then, on Friday, he will…
  - category_en: Expressing doubt
    category_ja: 疑念を表明する
    items:
    - Ambassador Tomita has been invited, but I do not know if he has confirmed yet
      or not.
  roleplay_model:
  - role: Teacher
    utterance: Okay, so we’re here today to talk about the schedule for Mr. Ando,
      who is arriving tomorrow. Let’s start with a recap of the schedule and then
      I’d just like to ask a couple of questions. Is that okay?
  - role: Student
    utterance: Of course.
  - role: Teacher
    utterance: Can you please go over Mr. Ando’s schedule for us?
  - role: Student
    utterance: Sure. He is going to arrive tomorrow morning at the airport on JAL660.
      Juan has been asked to meet him at the airport and bring him to the embassy.
      He has a couple of meetings here in the afternoon and then I will take him to
      his hotel room and check him in. Juan will pick him up from the hotel in the
      morning and bring him back to the embassy again.
  - role: Teacher
    utterance: So, what will he do when on the first day?
  - role: Student
    utterance: Well, he has a meeting with Ms Sherman, the Deputy Secretary of State,
      at 2pm. He is planning to review his speaking points in the morning and attend
      the meeting in the afternoon.
  - role: Teacher
    utterance: Got it. How long will the meeting last?
  - role: Student
    utterance: The meeting is expected to last a couple of hours. Afterwards, they
      plan to have dinner together from 7pm. I will escort him back to the embassy
      after the meeting and then pick him up at the hotel and take him to his dinner
      appointment.
  - role: Teacher
    utterance: I see. And Friday?
  - role: Student
    utterance: Then, on Friday, he will take the scheduled return flight back to Japan
      in the afternoon on JAL662. Juan will again take him to the airport and check
      him in.
  - role: Teacher
    utterance: Thank you, Taro. That is very clear. Who will attend dinner with him
      and Ms Sherman?
  - role: Student
    utterance: Ambassador Tomita has been invited, but I do not know if he has confirmed
      yet or not.
  - role: Teacher
    utterance: I see. I will check.
  - role: Student
    utterance: Okay.
  - role: Teacher
    utterance: And has an interpreter been confirmed for Mr. Ando?
  - role: Student
    utterance: Yes, Kobayashi san is available and will support him for each day it
      is required.
  - role: Teacher
    utterance: Does that include the dinner?
  - role: Student
    utterance: No. Mr. Ando said he does not require an interpreter for dinner. He
      said he is comfortable enough communicating in English by himself for social
      events.
  - role: Teacher
    utterance: I see. Thanks.
  - role: Student
    utterance: You’re welcome.
