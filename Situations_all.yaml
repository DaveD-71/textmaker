  writing_task_model:
    subject: Hotel for Conference Visitors
    body: 'Dear Colleagues,

      I want to share details about the hotel chosen for our visitors from Japan who
      will attend the international conference in New York.

      We have selected The Hilton Midtown. This hotel is in a central area with easy
      access to public transport. It is also near many restaurants, cafes, and shops.

      The hotel offers comfortable rooms, free Wi-Fi, and a business center. There
      is also a gym and a restaurant inside. These features will help our visitors
      have a good stay.

      We believe this hotel is the best choice. Let me know if you have any questions.

      Best regards,

      Taro Suzuki

      Administration Section

      Japanese Consulate in New York'
