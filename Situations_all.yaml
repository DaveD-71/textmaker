- situation_id: C04
  cefr_target: B2
  purpose_objectives:
    en: 'Dealing with problems.

      In response to an unwarranted complaint from a hotel about damaged equipment
      in a conference room rented for an event, you can negotiate with the hotel to
      avoid conflict while avoiding liability.'
    ja: 'トラブルに対処する。

      イベント用に借用したホテルの会議室において、破損した備品についてのホテル側からのいわれのないクレームに対し、責任を回避しつつ相手と対立しないようにうまく交渉の話し合いができる。'
  roleplays:
  - id: 1
    en: You work at the consulate in New York. You recently rented a conference room
      for three days at a hotel for an event. The hotel is one you use often. It is
      near a train station hub, and the staff there are usually very friendly and
      supportive of Japanese guests. After the event, you received an email from the
      hotel manager claiming some equipment in the conference room was damaged. Now,
      the hotel staff is calling to follow up. You must negotiate with the hotel to
      avoid liability for the damaged goods, while also sustaining a positive relationship
      with the manager and the hotel. You would like to be able to use the hotel again
      in the future.
    ja: あなたはニューヨークの領事館に勤務しています。あなたは最近、あるイベントのためにホテルの会議室を3日間借りました。そのホテルは、あなたがよく利用するホテルで、駅の近くにあり、スタッフはいつも日本人客にとても親切で協力的です。イベント終了後、ホテルのマネージャーから、会議室の備品が破損しているとのメールが届きました。今、ホテルのスタッフがフォローアップの電話をかけている。あなたはホテル側と交渉し、破損品の責任を回避すると同時に、マネージャーやホテル側と良好な関係を維持しなければなりません。あなたは、将来この
  - id: 2
    en: You work at the consulate in London. You recently rented a conference room
      for five days at a hotel for an event. The hotel is one you use often. It is
      near a train station hub, and the staff there are usually very friendly and
      supportive of Japanese guests. After the event, you received an email from the
      hotel manager claiming some equipment in the conference room was damaged. You
      must negotiate with the hotel to avoid liability for the damaged goods, while
      also sustaining a positive relationship with the manager and the hotel. You
      would like to be able to use the hotel again in the future.
    ja: あなたはロンドンの領事館に勤務しています。あなたは最近、あるイベントのためにホテルの会議室を5日間借りました。そのホテルは、あなたがよく利用するホテルで、駅の近くにあり、スタッフはいつも日本人客にとても親切で協力的です。イベント終了後、ホテルのマネージャーから、会議室の備品が破損しているとのメールが届きました。あなたはホテル側と交渉し、破損品の責任を回避すると同時に、マネージャーやホテル側と良好な関係を維持しなければなりません。あなたは、将来このホテルを再び利用したいと
      思っています。
  writing_task:
    description_en: 'After receiving an email from the hotel manager about damaged
      equipment, you scheduled a meeting to discuss the issue and negotiate a resolution.

      Write an email to the hotel manager that:

      expresses your concern about the damaged equipment,

      outlines your reasons for disputing the claim of damages,

      proposes a solution that protects the consulate from liability while maintaining
      a positive relationship with the hotel,

      suggests alternative ways to resolve the issue amicably.'
    description_ja: 'ホテルマネージャーから備品の破損に関するメールを受け、対面で話し合うために面会を設定しました。

      ホテルマネージャーに宛てたメールを作成し、以下を含めてください：

      備品破損についての懸念を表明すること、

      損傷の責任に関する異議の理由を明確にすること、

      領事館の責任を回避しつつ、ホテルとの良好な関係を維持する解決策を提案すること、

      友好的な解決のための代替案を示すこと。'
  roleplay1_key_expressions:
  - category_en: Expressing polite disagreement
    category_ja: 意見の相違を丁寧に表現する
    items:
    - I’m sorry to hear that. However, I am surprised. On the last day of the conference
      as we left, an inspection of the room was done by the manager on duty at the
      time.
  - category_en: Asking for detailed information
    category_ja: 詳細な情報を求める
    items:
    - As for the printer, what exactly is the damage?
  - category_en: Using logical reasoning to negate a claim against you
    category_ja: 論理的な推論を用いて、自分に対する主張を否定する
    items:
    - Okay, but we didn’t have any problems with it. If we had, we would have needed
      to ask for repairs because we used it the entire time. It was important for
      us to be able to print and distribute regular updates to the conference attendees.
      If it had broken and become unusable during the conference, it would have been
      a big problem for us that would have needed to be addressed promptly.
  roleplay_model:
  - role: Student
    utterance: Hello. Taro Suzuki speaking.
  - role: Teacher
    utterance: Hello Mr. Suzuki. This is Peter Brown at the Continental Hotel.
  - role: Student
    utterance: Oh yes, Peter. It’s good to hear from you. What can I do for you?
  - role: Teacher
    utterance: Actually, I’m afraid I’m calling with some bad news.
  - role: Student
    utterance: Really? What’s up?
  - role: Teacher
    utterance: Well, it’s with regard to the conference room you rented last week.
  - role: Student
    utterance: Yes?
  - role: Teacher
    utterance: I’m afraid there was some damage done to some of the equipment. Specifically,
      the printer seems to be broken. In addition, there seems to be a cigarette burn
      in the carpet in the corner.
  - role: Student
    utterance: Oh really. I’m sorry to hear that. However, I am surprised. On the
      last day of the conference as we left, an inspection of the room was done by
      the manager on duty at the time. I forget his name.
  - role: Teacher
    utterance: That was John Anderson.
  - role: Student
    utterance: Yes, John. That’s right. We went around the room together. I don’t
      remember seeing a cigarette burn. Although, admittedly, I didn’t look at every
      corner of the carpet. At the same time, all the attendees were aware that the
      hotel is non-smoking so I would be surprised if they burnt the carpet. And also,
      John didn’t mention it at the time.
  - role: Teacher
    utterance: Right. I see. Okay, I will check with John.
  - role: Student
    utterance: As for the printer, what exactly is the damage?
  - role: Teacher
    utterance: It looks like the paper feed jammed, and it’s been broken while trying
      to unjam it.
  - role: Student
    utterance: Hmmm. Okay, but we didn’t have any problems with it. If we had, we
      would have needed to ask for repairs because we used it the entire time. It
      was important for us to be able to print and distribute regular updates to the
      conference attendees. If it had broken and become unusable during the conference,
      it would have been a big problem for us that would have needed to be addressed
      promptly.
  - role: Teacher
    utterance: I see. So you don’t think it could have happened during the conference.
  - role: Student
    utterance: That’s right. It must have happened after. And as I said, John went
      over everything. In fact, I think I still have the copy of inspection report.
      I can send it to you if you’d like.
  - role: Teacher
    utterance: No. That’s okay. I’ll talk again with John.
  - role: Student
    utterance: I’m sorry I can’t help you. I hope you will let us come back to the
      hotel next spring. We enjoy working with you and your staff.
  - role: Teacher
    utterance: Of course. Thank you for your time.
  - role: Student
    utterance: No problem Peter. Have a great day.
  - role: Teacher
    utterance: You too. Mr. Suzuki.
  - role: Student
    utterance: Goodbye.
