- situation_id: D01
  cefr_target: B2
  purpose_objectives:
    en: 'Explaining procedures.

      When handing over pay slips to local staff, you can decline unrealizable requests
      from the other party with specific reasons.'
    ja: '手順を説明する。

      現地職員に給与明細を渡す際に、相手からの実現可能でない要望を具体的な理由とともに断ることができる。'
  roleplays:
  - id: 1
    en: You work in the Accounting Department at a diplomatic mission abroad. A local
      staff member has requested his social insurance premium not to be deducted from
      his salary as he wants to pay it separately by himself. You need to tell him
      that you can’t approve his request as local staff social insurance premium must
      be paid by the mission to the authorities.
    ja: あなたは在外公館で会計を担当しています。現地スタッフから、社会保険料は自分で払うので、給与から天引きしないで欲しいと依頼されました。社会保険料は、雇用している現地スタッフ全員分をまとめて納める必要があるので、それはできないと説明してください。
  - id: 2
    en: You are working at the Embassy of Japan in Myanmar. When giving out the monthly
      pay slips, a local staff member has asked for an advance on his next pay so
      he can pay off a debt he owes. Explain to him that the policy of the embassy
      is not to provide advances to staff.
    ja: あなたは在ミャンマー日本大使館に勤務しています。毎月の給与明細を渡す際、ある現地職員が、借金を返済するために次の給与を前払いしてほしいと頼んできました。大使館の方針として、職員に給与の前払いは行えないことを説明してください。
  writing_task:
    description_en: 'Following Roleplay 1, you need to respond to a local staff member’s
      request about paying his social insurance premium separately.

      Write an email that:

      explains the request cannot be approved,

      clearly outlines the policy stating that social insurance premiums for local
      staff must be paid by the diplomatic mission to the authorities,

      expresses understanding for the staff member’s situation,

      offers further assistance or clarification if needed.'
    description_ja: 'ロールプレイ1に基づき、現地職員からの社会保険料支払いに関する要望に対して返信する必要があります。

      以下を含めたメールを作成してください：

      要望が承認できない旨の説明、

      現地職員の社会保険料は在外公館が当局に直接支払う必要があるという方針の明示、

      要望への理解を示すこと、

      必要に応じて支援や追加説明の申し出を行うこと。'
  roleplay1_key_expressions:
  - category_en: Declining a request
    category_ja: 要望を断る
    items:
    - I’m sorry but that’s just not possible.
  - category_en: Explaining a policy
    category_ja: 方針を説明する
    items:
    - Our policy requires all local staff’s insurance premiums to be directly deducted
      from their salary and paid directly to the appropriate authorities.
  roleplay_model:
  - role: Teacher
    utterance: Mr. Sakamoto? Could I have a word?
  - role: Student
    utterance: Certainly, Juan. How can I help you?
  - role: Teacher
    utterance: I want to talk with you about my social insurance.
  - role: Student
    utterance: Okay.
  - role: Teacher
    utterance: I would prefer to pay my social insurance myself instead of having
      it deducted from my salary. Is that possible?
  - role: Student
    utterance: I’m sorry, but that’s just not possible. Our policy requires all local
      staff’s insurance premiums to be directly deducted from their salary and paid
      directly to the appropriate authorities.
  - role: Teacher
    utterance: I see. Thanks anyway.
  - role: Student
    utterance: No problem. Let me know if you need anything else.
  - role: Teacher
    utterance: Okay.
  roleplay1_target_vocabulary:
  - term: appropriate
    level: B2
  - term: authority
    level: B2
  - term: insurance
    level: B2
  - term: let me
    level: B2
  - term: policy
    level: B2
  - term: premium
    level: C2
  writing_task_key_expressions:
  - category_en: Explaining rules clearly
    category_ja: 規則を明確に説明する
    items:
    - According to our policy, social insurance premiums for local staff must be deducted
      directly from salaries.
  - category_en: Offering additional help
    category_ja: 更なる支援を申し出る
    items:
    - If you have any further questions or need clarification, please feel free to
      contact me.
  writing_task_model:
    subject: Social Insurance Premium - Request Clarification
    body: 'Dear Juan san,

      Thank you for discussing your request regarding social insurance premium payments.

      I understand you would prefer to pay your social insurance premium yourself.
      Unfortunately, this is not possible. According to our policy, social insurance
      premiums for local staff must be deducted directly from salaries and paid by
      our diplomatic mission to the authorities.

      This policy ensures that everyone receives reliable social insurance coverage.
      If you have any further questions or need clarification, please feel free to
      contact me.

      Thank you for your understanding.

      Best regards,

      Taro Suzuki

      Accounting Department'
