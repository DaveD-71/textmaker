  writing_task_model:
    subject: ''
    body: 'Announcement Script:

      Date: March 15, 2024

      Venue: Delhi University, Business Department, Auditorium

      Time: 10:00 AM

      Good morning, everyone.

      My name is Taro Suzuki. I represent the Embassy of Japan in New Delhi. Thank
      you very much for inviting us to BizFest 2024. We are pleased to join you today.

      The Embassy of Japan aims to build stronger relationships between Japan and
      India. Our main focus includes education, culture, and business cooperation.
      We understand how important universities, like Delhi University, are for developing
      future business leaders and entrepreneurs.

      We work closely with universities to build strong connections between Japan
      and India. Events like BizFest are very important because they allow students
      and businesses from both countries to share ideas and work together.

      I am looking forward to talking with you and answering your questions about
      our embassy and Japan''s relationship with your university.

      Thank you.

      Taro Suzuki

      Embassy of Japan, New Delhi'
