- situation_id: G09
  cefr_target: A2
  purpose_objectives:
    en: 'Information exchange.

      Can ask and answer questions about habits and routines.'
    ja: '情報交換をする。

      習慣や日課について質問し、答えることができる。'
  roleplays:
  - id: 1
    en: You work at the Japanese consulate in Houston. A colleague from another consulate
      calls to inquire about your daily routine and habits. Answer their questions
      about your typical workday, including tasks you handle and your regular schedule.
    ja: あなたはヒューストンの日本領事館で働いています。他の領事館の同僚から、あなたの日常業務や習慣について尋ねる電話がかかってきました。あなたが担当する業務や普段のスケジュールなど、通常の勤務について質問に答えてください。
  - id: 2
    en: You need to gather information about the daily routines and habits of Japanese
      citizens living in your city for a cultural exchange program. Call a Japanese
      community center and ask to speak with someone who can provide insights into
      the typical daily routines and habits of the local Japanese community.
    ja: 文化交流プログラムのために、あなたの街に住む日本人の日常生活や習慣について情報を集める必要があります。日系コミュニティセンターに電話し、地元の日本人コミュニティの典型的な日常生活や習慣について教えてくれる人に話を聞きます。
  writing_task:
    description_en: 'Following Roleplay 1, your colleague in Los Angeles has asked
      for details about your work routine.

      Write an email that:

      describes your typical workday in detail,

      includes specific routines or habits you follow,

      highlights anything that contributes to your productivity or organization.'
    description_ja: 'ロールプレイ1に基づき、ロサンゼルスの同僚から日々の業務内容についての情報提供依頼を受けました。

      以下を含むメールを作成してください：

      典型的な一日の業務内容の説明、

      実施しているルーティンや習慣の共有、

      生産性向上に役立つ工夫などがあれば記載。'
  roleplay1_key_expressions:
  - category_en: Asking questions
    category_ja: 質問する
    items:
    - Can you tell me about your typical workday?
  - category_en: Providing information
    category_ja: 情報の提供
    items:
    - I usually start my day by checking emails and handling administrative tasks.
  - category_en: Offering assistance
    category_ja: 支援の提供
    items:
    - Let me know if you need more information.
  roleplay_model:
  - role: Student
    utterance: Japanese Consulate in Houston, how may I help you?
  - role: Teacher
    utterance: Hi, this is John Addams from the consulate in Los Angeles. I'm participating
      in a cultural exchange at a high school. I have been asked to give a presentation
      on the daily life of a diplomat. Can you tell me about your typical workday?
  - role: Student
    utterance: Sure. It's fairly typical. I usually start my day by checking emails
      and handling administrative tasks. Then, I assist visitors with inquiries and
      process documents. In the afternoon, I attend meetings and prepare reports.
      My workday typically ends around 5 p.m.
  - role: Teacher
    utterance: Thank you for sharing. Do you have any routines or habits you follow
      that help you stay productive?
  - role: Student
    utterance: Yes, I make sure to take short breaks throughout the day to stay refreshed
      and focused. I also prioritize tasks based on their urgency.
  - role: Teacher
    utterance: That's helpful. Thank you for your time.
  - role: Student
    utterance: You're welcome. Let me know if you need more information.
  - role: Teacher
    utterance: I will. Goodbye.
