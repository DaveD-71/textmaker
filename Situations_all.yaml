- situation_id: F03
  cefr_target: B1
  purpose_objectives:
    en: 'Inviting a guest to an event.

      In organizing a formal dinner, you can contact the invited guests, adjust the
      schedule, etc., and exchange necessary procedures, and then contact the relevant
      departments, etc.'
    ja: 'イベントにゲストを招待する。

      フォーマルな会食の開催にあたって、招待客に連絡をし、日程等の調整や必要な手続きのやり取りを行った上で、関連諸部署などへの連絡をすることができる。'
  roleplays:
  - id: 1
    en: You work in the Public Diplomacy Department at a diplomatic mission abroad.
      You are arranging a dinner party on behalf of the ambassador who wants to develop
      ties with local business leaders. Call and invite local business leaders to
      the party. Get any additional necessary information.
    ja: あなたは在外公館で広報外交を担当しています。現地のビジネスリーダーとの関係を発展させるため、大使から、ディナ―パーティーの手配を依頼されました。電話、もしくは書面で、現地のビジネスリーダーをパーティーに招待してください。その他、必要な情報を入手してください。
  - id: 2
    en: You work in the consulate in Honolulu. You arranged a dinner party on behalf
      of the ambassador with local business leaders. You sent the invitations and
      have started to receive replies. However, due to an emergency, you need to reschedule
      the event. It will be delayed for one full month. Contact the people who replied
      and tell them about the delay. Make sure you also apologize.
    ja: あなたはホノルルの領事館に勤務しています。あなたは大使の代理として、地元のビジネスリーダーとのディナーパーティーを手配しました。招待状を送り、返信が届き始めています。しかし、緊急事態が発生し、イベントの予定を変更する必要があります。丸
      1 カ月遅れることになります。返信をくれた人たちに連絡を取り、延期について伝えてください。また、謝罪も忘れず行ってください。
  writing_task:
    description_en: 'Following Roleplay 1, you need to notify dinner party guests
      of a schedule change.

      Write an email that:

      informs them of the new date,

      apologizes for any inconvenience caused by the rescheduling,

      provides any additional relevant information.

      Keep your message polite and professional.'
    description_ja: 'ロールプレイ1に基づき、ディナーパーティーの出席者にスケジュール変更を知らせる必要があります。

      以下の内容を含めたメールを作成してください：

      新しい日程のお知らせ、

      日程変更に伴うご不便へのお詫び、

      その他必要な情報があればそれを記載。

      文体は丁寧かつ専門的にしてください。'
  roleplay1_key_expressions:
  - category_en: Inviting someone to an event
    category_ja: 誰かをイベントに招待する
    items:
    - Ambassador Takahashi wants to invite your General Manager, Mr. Lee, to a dinner
      party.
  - category_en: Expressing a reason
    category_ja: 理由を述べる
    items:
    - The Ambassador wants to have good relationships with local business leaders.
      He wants to meet local businesspeople.
  - category_en: Sharing an event schedule
    category_ja: イベントのスケジュールを共有する
    items:
    - It will be on the fourth of August at 7 p.m.
  roleplay_model:
  - role: Student
    utterance: Hello, this is Misaki Takahashi from the Japanese Embassy. I work in
      the Public Diplomacy Department. Ambassador Takahashi wants to invite your General
      Manager, Mr. Lee, to a dinner party.
  - role: Teacher
    utterance: Thank you for the invitation. Mr. Lee will be very happy when I tell
      him. May I ask what this party is in regard to?
  - role: Student
    utterance: Yes, the Ambassador wants to have good relationships with local business
      leaders. He wants to meet local businesspeople.
  - role: Teacher
    utterance: I see. When will this dinner be held?
  - role: Student
    utterance: It will be on the fourth of August at 7 p.m. Will Mr. Lee be able to
      attend?
  - role: Teacher
    utterance: Thank you. Let me check his schedule. Yes, he is available.
  - role: Student
    utterance: Thank you. Also, he can bring his partner or friends. Please tell us
      who will come with him.
  - role: Teacher
    utterance: Okay, I will do so after I collect all the information.
  - role: Student
    utterance: Great, can you send me information by email?
  - role: Teacher
    utterance: Yes, I can. Could I have your email address?
  - role: Student
    utterance: Sure, it’s t.misaki@cb.mofa.go.jp.
  - role: Teacher
    utterance: Ok, could I confirm? That’s t-dot-m-i-s-a-k-i-at-c-b-dot-mofa-dot-go-jp?
  - role: Student
    utterance: That’s right.
  - role: Teacher
    utterance: Thank you very much. I will send you an e-mail shortly with the details.
  - role: Student
    utterance: Thank you.
