  writing_task_key_expressions:
  - category_en: Offering practical solutions
    category_ja: 実用的な提案をする
    items:
    - Change regular lights to energy-saving LED bulbs.
  - category_en: Clarifying advantages
    category_ja: 利益や利点を説明する
    items:
    - Bulk buying will help us save money on everyday office supplies.
  writing_task_model:
    subject: Cost Reduction Ideas for Next Quarter
    body: 'Dear Mr. Addams,

      Thank you for our recent budget meeting. Based on our discussion, I''ve put
      together the following proposals to help reduce costs next quarter:

      1. Energy-Saving Actions:

      - Change regular lights to energy-saving LED bulbs.

      - Set clear rules for turning off lights and equipment when not in use.

      Reason: This will lower our electricity bills and support our environmental
      goals.

      2. Better Purchasing Practices:

      - Buy office supplies in bulk to get discounts.

      - Review current suppliers to find better prices.

      Reason: Bulk buying will help us save money on everyday office supplies.

      3. Review Travel Costs:

      - Require advance approval for all business trips.

      - Encourage using less expensive travel options.

      Reason: Careful planning will help reduce unnecessary travel expenses.

      4. Use More Virtual Meetings:

      - Hold meetings online instead of traveling.

      - Improve our current technology to support better virtual meetings.

      Reason: Reducing travel saves money and time, making our work more efficient.

      Thank you for considering these suggestions. I look forward to discussing them
      further at our next meeting.

      Best regards,

      Taro Suzuki

      Financial Analyst

      Consulate of Japan, New York'
