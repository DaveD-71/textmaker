- situation_id: D06
  cefr_target: B2
  purpose_objectives:
    en: 'Presenting an argument.

      In workplace meetings, clarify one''s own position on agenda items such as the
      introduction of telework, taking into account the advantages and disadvantages,
      and reinforce one''s own opinions while presenting new arguments in response
      to the opinions of other meeting participants.'
    ja: '論点を提示する。

      職場内の会議において、テレワークの導入等の議題について、利点と欠点を踏まえて、自分の立場を明らかにし、他の会議参加者の意見に対し、新たな論点を示しつつ自己の意見を補強することができる。'
  roleplays:
  - id: 1
    en: You will participate in a meeting about working overtime. The management want
      to increase the number of overtime hours because there are fewer staff in the
      office. Give your opinion in the meeting, and clearly support it with reasons
      and when possible, strong supporting evidence.
    ja: 残業についての会議に参加することになりました。経営陣は、職場の人員が少ないため、残業時間を増やしたいと考えています。会議であなたの意見を述べ、その意見を支持する明確な理由と、可能であれば強力な裏付けとなる証拠を示してください。
  - id: 2
    en: Your department is considering changing to a four-day work week in order to
      increase staff satisfaction while reducing costs. Give your opinion in the meeting,
      and clearly support it with reasons and when possible, strong supporting evidence.
    ja: あなたの部署では、コストを削減する一方、スタッフの満足度を高めるため、週4日勤務に変更することを検討しています。会議であなたの意見を述べ、その意見を支持する明確な理由と、可能であれば強力な裏付けとなる証拠を示してください。
  writing_task:
    description_en: 'Write an email to your supervisor expressing your opinion on
      the proposal to increase overtime hours due to a staff shortage.

      Your email should:

      clearly state your position,

      provide reasons and examples to support your view,

      include any relevant evidence,

      be professional and persuasive in tone.'
    description_ja: '人手不足による残業時間増加案について、自身の意見を上司に伝えるメールを作成します。

      以下を含めてください：

      賛成または反対の立場を明確にすること、

      自身の意見を支持する理由や具体例の提示、

      関連するデータや根拠があれば示すこと、

      専門的で説得力のある文体を使用すること。'
  roleplay1_key_expressions:
  - category_en: Confirming your understanding
    category_ja: 理解度を確認する
    items:
    - Is my understanding correct?
  - category_en: Sharing your opinion
    category_ja: 自分の意見を共有する
    items:
    - Okay, in my opinion, that’s already quite a lot.
  - category_en: Making a suggestion
    category_ja: 提案をする
    items:
    - Well, how about we see if we can borrow some staff from some departments which
      are not as busy at this time of year.
  roleplay_model:
  - role: Teacher
    utterance: Okay, let’s begin. Thanks for coming everyone. As you would have read
      in the email, the purpose of today’s meeting is to decide whether we should
      increase the overtime hours to cover all the work we have to do in the next
      month. So, first I’d like to hear everyone’s opinions, and then we can move
      towards making a decision. Taro, can you go first?
  - role: Student
    utterance: 'Sure, I’d be happy to. So, let me just confirm one thing first: The
      idea is that we should increase the amount of allowed overtime, right? By that,
      I mean, we’re not forcing people to do additional overtime, we’re just changing
      the limits of what’s possible in the department? Is my understanding correct?'
  - role: Teacher
    utterance: Yes, that’s right. Of course, we don’t want to force people to work
      long hours, but I think everyone understands that when there is a lot of work
      to do, we all need to pitch in and help.
  - role: Student
    utterance: Okay, so the current overtime limit is forty hours per month, or roughly
      ten hours a week, right?
  - role: Teacher
    utterance: Yes, that’s right.
  - role: Student
    utterance: Okay, in my opinion, that’s already quite a lot. I mean, it’s roughly
      an additional twenty-five percent of the standard forty-hour work week. So,
      I think we can increase, but not by much. I think fifty hours would be okay
      but I’m not sure about sixty. That would become an additional twenty hours a
      month, or a fifty-percent increase of the previous limit.
  - role: Teacher
    utterance: Yes, that’s true. However, even with some staff working 50-hour work
      weeks I don’t know if we can get all the work done.
  - role: Student
    utterance: Well, how about we see if we can borrow some staff from some departments
      which are not as busy at this time of year.
  - role: Teacher
    utterance: Hmmm. That’s a good suggestion. Let me look into it. Thanks for your
      input Taro.
  - role: Student
    utterance: No problem.
  - role: Teacher
    utterance: Okay, now, I’d like to move onto the next item on the agenda…
  roleplay1_target_vocabulary:
  - term: additional
    level: B2
  - term: agendum
    level: C1
  - term: current
    level: B2
  - term: force
    level: B2
  - term: input
    level: B2
