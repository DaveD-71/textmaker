- situation_id: E04
  cefr_target: B1
  purpose_objectives:
    en: 'Dealing with problems.

      When a problem such as loss of a visitor''s baggage occurs at the airport counter,
      the visitor''s complaint can be heard, understood, and apologized for the time
      being.'
    ja: 'トラブルに対処する。

      空港のカウンターで、来訪者の手荷物の紛失などの問題が生じたとき、来訪者の苦情を聞いて理解し、謝るなどの当座の対処をすることができる。'
  roleplays:
  - id: 1
    en: You work at the consulate in Cape Town. You have received a phone call from
      someone who has applied for a student visa. They were told it will take four
      weeks to process the visa, but it is now six weeks and the visa has not arrived.
      Listen to the complaint, apologize, and tell them what you can do.
    ja: あなたはケープタウンの領事館に勤務しています。学生ビザを申請した人から電話がかかってきました。彼らは、ビザの手続きに4週間かかると言われましたが、6週間経ってもビザが届いていません。苦情を聞き、謝罪し、あなたにできることを伝えてください。
  - id: 2
    en: You work at the consulate in Houston. You have received a phone call from
      someone who has applied for a work visa. The applicant has not been vaccinated
      against COVID-19. They are not happy that their application has been rejected.
      Listen to the complaint, apologize, and explain the COVID policy.
    ja: あなたはヒューストンの領事館に勤務しています。あなたは就労ビザを申請した人から電話を受けました。その申請者はCOVID-19の予防接種を受けていません。申請書が却下されたことに不満があるようです。苦情を聞き、謝罪し、COVIDの方針について説明してください。
  writing_task:
    description_en: 'Following Roleplay 1, you received a complaint from an applicant
      waiting for their student visa.

      Write an email to the applicant that:

      apologizes for the inconvenience caused by the delay,

      assures them that steps are being taken to expedite the process,

      provides an update on the current status of their application,

      outlines any further steps they need to take.

      Keep your tone polite, empathetic, and informative.'
    description_ja: 'ロールプレイ1に基づき、学生ビザの遅延に関して苦情を申し立てた申請者への返信メールを作成します。

      以下を含めてください：

      遅延による不便についての謝罪、

      手続きの迅速化に向けた対応策の説明、

      現在の申請状況の共有、

      申請者が取るべき追加手続きがあれば案内。

      丁寧で共感のある文章にしてください。'
  roleplay1_key_expressions:
  - category_en: Offering assistance
    category_ja: 支援を提供する
    items:
    - What can I do for you?
  - category_en: Stating standard procedure
