- situation_id: F04
  cefr_target: B1
  purpose_objectives:
    en: 'Making decisions.

      In order to hire a new local staff member, you can discuss and decide who to
      hire on the spot after exchanging questions to confirm the information needed
      for the hiring interview.'
    ja: '意思決定をする。

      新たに現地職員を雇うために、採用面接で必要な情報の確認のための質問のやりとりを行った上で、その場で協議して採用者を決定することができる。'
  roleplays:
  - id: 1
    en: A new local staff member will be hired. You will interview the applicants.
      Conduct an interview.
    ja: 新たに現地スタッフを雇うことになりました。応募者の面接を行ってください。
  - id: 2
    en: You are working in the consulate in Vancouver. One of the local staff has
      resigned, and you need to find a replacement. You will interview a candidate.
      At the end, decide whether to offer him the job, or to call him later with the
      result.
    ja: あなたはバンクーバーの領事館に勤務しています。現地スタッフの一人が退職してしまったので、後任を探す必要があります。あなたは候補者を面接します。最後に、その候補者に仕事を依頼するか、後で結果を電話するか決めてください。
  writing_task:
    description_en: 'Following Roleplay 1, you conducted interviews for a new local
      staff member.

      Write an email to the hiring manager that:

      summarizes the interviews,

      provides feedback on each candidate’s strengths, weaknesses, and qualifications,

      recommends the most suitable candidate for the position.

      Keep your message clear, concise, and professional.'
    description_ja: 'ロールプレイ1に基づき、新規の現地職員採用に関する面接を実施しました。

      以下の内容を含めて、採用責任者に送るメールを作成してください：

      面接内容の概要、

      各候補者の長所・短所・資格に関するフィードバック、

      最も適任と考えられる候補者の推薦。

      メールは明確・簡潔・専門的に仕上げてください。'
  roleplay1_key_expressions:
  - category_en: Expressing thanks
    category_ja: 感謝の気持ちを伝える
    items:
    - Thank you very much for coming to this interview today.
  - category_en: Requesting information
    category_ja: 情報を求める
    items:
    - Please give me a brief summary of your career experience.
  - category_en: Asking for more detail
    category_ja: より詳しい情報を求める
    items:
    - What exactly did you do there?
  roleplay_model:
  - role: Student
    utterance: Hello Mr. Adams. Thank you very much for coming to this interview today.
  - role: Teacher
    utterance: Thank you very much for asking me to come in.
  - role: Student
    utterance: I read your resume last weekend. Please give me a brief summary of
      your career experience.
  - role: Teacher
    utterance: Sure. I was a Housing Specialist at a company called IHS, the Institute
      for Human Services. I did this for nearly five years.
  - role: Student
    utterance: I see. What exactly did you do there?
  - role: Teacher
    utterance: Certainly. I helped our homeless applicants find housing. I specialized
      in assessing each person’s situation in order to provide tailored housing solutions
      for them.
  - role: Student
    utterance: Thank you for sharing that. And what do you know about Japanese business,
      and Japanese people?
  - role: Teacher
    utterance: I understand Japanese embrace a group mentality and look to their superiors
      for approval before making decisions.
  - role: Student
    utterance: I think you have a good understanding of Japanese culture.
  - role: Teacher
    utterance: Thank you. I’m very interested in Japan and Japanese culture.
  - role: Student
    utterance: Okay, so that’s all we need for today. Again, thank you for coming
      in for this interview. We will contact you soon to let you know the result.
  - role: Teacher
    utterance: Thank you very much for your time. I look forward to hearing from you
      soon.
  - role: Student
    utterance: Let me walk with you to the elevator.
