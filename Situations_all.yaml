    level: B1
  - term: replacement
    level: B2
  - term: service
    level: B1
  - term: support
    level: B1
  writing_task_key_expressions:
  - category_en: Describing equipment problems
    category_ja: 問題を明確に報告する
    items:
    - It often gets jammed, and the copies have lines on them.
  - category_en: Asking for quick service
    category_ja: 迅速な対応を求める
    items:
    - Could you please send someone to fix it soon?
  writing_task_model:
    subject: Photocopier Repair Request
    body: 'Dear Support Centre,

      Our office photocopier is not working properly. It often gets jammed, and the
      copies have lines on them. This makes it hard to print clear documents.

      Could you please send someone to fix it soon? Also, let us know how much the
      repair will cost and how long it will take.

      If the repair takes a long time, is there a way for us to borrow another photocopier
      for free?

      Thank you for your help. Please let me know if you need more information.

      Best regards,

      Taro Suzuki

      Japanese Embassy'
