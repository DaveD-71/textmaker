    level: A2
  writing_task_key_expressions:
  - category_en: Clearly confirming arrangements
    category_ja: 予約内容を明確に伝える
    items:
    - You will stay at the Hilton Midtown Hotel.
  - category_en: Encouraging contact if needed
    category_ja: 追加の支援を申し出る
    items:
    - If you have any questions or there are any changes, please contact me.
  writing_task_model:
    subject: Hotel Reservation, September 17
    body: 'Dear Watanabe-san and Michael-san,

      I hope you are well.

      I booked your hotel in New York. You will stay at the Hilton Midtown Hotel.

      Please go there on September 17 after 10 p.m. The reception is open 24 hours.
      You can go there anytime. You have non-smoking rooms on different floors.

      Also, breakfast is included. It is served in the hotel restaurant every morning.

      If you have any questions or there are any changes, please contact me.

      I hope you have a good trip.

      Best regards,

      Taro Suzuki'
