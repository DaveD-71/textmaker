      films.'
    ja: '意見を述べる。

      音楽や映画など、抽象的・文化的なテーマについて自分の考えを述べることができる。'
  roleplays:
  - id: 1
    en: You work in the embassy in Melbourne. You are attending an embassy party celebrating
      obon. One of the party guests, an Australian citizen, asks you to tell her what
      obon is. Explain your own understanding of obon. Make sure to include a general
      statement describing obon, and your own experience. Importantly, give your own
      opinion about the holiday.
    ja: あなたはメルボルンの大使館に勤務しています。あなたはお盆を祝う大使館のパーティーに出席しています。パーティーの招待客の一人であるオーストラリア市民が、あなたにお盆とは何か教えてほしいと頼んできました。あなた自身のお盆に対する理解を説明してください。お盆についての一般的な説明と、あなた自身の経験を必ず含めてください。重要なのは、この祝日についてあなた自身の意見を述べることです。
  - id: 2
    en: You work in the consulate in Cape Town. You are having lunch with a local
      staff member who has a keen interest in Japanese manga. Share your own understanding
      of manga as a cultural phenomenon in Japan, its influence on the world, and
      your own experience. Importantly, make sure you also share your opinion.
    ja: あなたはケープタウンの領事館に勤務しています。日本のマンガに強い関心を持つ現地スタッフと昼食をとっているところです。あなた自身が理解する日本の文化現象としてのマンガ、世界への影響、そしてあなた自身の経験を共有してください。重要なのは、あなたの意見も伝えることです。
  writing_task:
    description_en: 'Following Roleplay 1, you explained the concept of obon at an
      embassy event.

      Write a blog post that:

      describes obon and its cultural traditions,

      shares your understanding and the significance of the holiday,

      includes personal experiences or memories,

      expresses your opinion about its meaning to you.

      Keep your post informative, engaging, and reflective.'
    description_ja: 'ロールプレイ1に基づき、あなたは大使館のイベントでお盆について説明しました。

      以下の内容を含めたブログ投稿を書いてください：

      お盆の概要とその文化的な伝統について、

      あなた自身の理解とお盆の意義、

      お盆にまつわる個人的な経験や思い出、

      お盆があなたにとってどんな意味を持つかという意見。

      読みやすく、親しみやすく、かつ振り返りを含んだ内容にしてください。'
  roleplay1_key_expressions:
  - category_en: Giving a general statement
    category_ja: 一般的な事実を述べる
    items:
    - It’s a Buddhist custom and it’s a time for family to come together.
  - category_en: Making a personal statement
    category_ja: 個人的なことを述べる
    items:
    - For my family, it usually means we all get together for a few days.
  - category_en: Giving a personal opinion
    category_ja: 個人的な意見を述べる
    items:
    - I think it’s one of my favorite holidays.
  roleplay_model:
  - role: Teacher
    utterance: Hello, Taro. It’s good to see you.
  - role: Student
    utterance: Oh, hi there Angela. Thank you for coming to the party.
  - role: Teacher
    utterance: Thanks for inviting me. You know I always love the events the embassy
      puts on.
  - role: Student
    utterance: And we are very happy to see you here each time.
  - role: Teacher
    utterance: So, today’s party is a celebration of ‘obon’, right?
  - role: Student
    utterance: Yes, that’s right. Do you know ‘obon’?
  - role: Teacher
    utterance: I think I’ve heard of it. Doesn’t it have something to do with ancestors?
  - role: Student
    utterance: Yes, that’s right. Every year, around this time, we welcome our ancestors
      back to visit us for the obon period. It’s a Buddhist custom and it’s a time
      for family to come together.
  - role: Teacher
    utterance: What does that involve?
  - role: Student
    utterance: Well, many people return to their home town and go to and visit their
      deceased relatives’ graves. We usually clean the graves.
  - role: Teacher
    utterance: Is that what you do?
  - role: Student
    utterance: For my family, it usually means we all get together for a few days.
      My grandfather passed away a couple of years ago, so we will go to the cemetery
      and clean his grave together.
  - role: Teacher
    utterance: It sounds like a nice tradition.
  - role: Student
    utterance: It is. Obon is celebrated at different times in Japan, but it’s usually
      sometime between the middle of July and early September. In Japan there are
      some festivals, called bon matsuri, and a special dance, called bon-odori which
      is a celebration of our ancestors. In fact, I think we will see some bon-odori
      tonight.
  - role: Teacher
    utterance: Oh, that sounds like fun. I’m looking forward to it.
  - role: Student
    utterance: Great. I hope you will join in. I don’t see my family often, so it’s
      nice to be able to go back to my hometown and see everyone. I think it’s one
      of my favorite holidays.
  - role: Teacher
    utterance: It sounds nice.
  - role: Student
    utterance: Yes, I think it is.
