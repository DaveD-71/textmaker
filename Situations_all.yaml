    level: A2
  - term: request
    level: B1
- situation_id: H05
  cefr_target: A2
  purpose_objectives:
    en: 'Making inquiries.

      You can ask questions about the transaction details of the embassy''s bank account
      and complete simple matters (such as incorrect statement amount).'
    ja: '問い合わせをする。

      大使館の銀行口座の取引内容に関し、疑問点を質問し、簡単な用件を済ますことができる（ステートメントの金額の記載誤りなど）。'
  roleplays:
  - id: 1
    en: You work in the consulate in Honolulu. You are responsible for checking the
      consulate’s accounts each month. You received a bank statement for an account
      held at a local bank. The statement shows a withdrawal of $500 that you have
      no record of. Call the bank and ask what time the transaction happened, and
      whether it was an ATM withdrawal or over the counter.
    ja: あなたはホノルルの領事館に勤務しています。あなたは毎月領事館の口座をチェックする責任者です。あなたは、地元の銀行から口座の明細書を受け取りました。その明細には覚えのない500ドルの引き出しが記載されています。銀行に電話して、その取引があった時間と、ATMでの引き出しか窓口での引き出しか尋ねてください。
  - id: 2
    en: You work in the consulate in Los Angeles. You are responsible for checking
      the consulate’s accounts each month. You received a bank statement for an account
      held at a local bank. The total amount in the account is $500 less than your
      calculations. Call the bank and ask about the monthly transactions to make sure
      you have not missed anything.
    ja: あなたはロサンゼルスの領事館に勤務しています。あなたは毎月領事館の口座をチェックする責任者です。あなたは、地元の銀行から口座の明細書を受け取りました。その口座の残高が、あなたの計算より500ドル少なくなっています。銀行に電話をして、その月の取引について尋ね、見落としがないか確認してください。
  writing_task:
    description_en: 'Based on Role Play 1, report to your supervisor at the Honolulu
      Consulate the results of your check with the bank regarding the $500 withdrawal.

      Write an email that:

      reports when and how the withdrawal occurred (ATM or in-person),

      shares any additional details provided by the bank,

      suggests steps to fix the issue and prevent future problems,

      is brief and polite.'
    description_ja: 'ロールプレイ1に基づき、500ドルの引き出しについて銀行に確認した結果をホノルル領事館の上司に報告してください。

      以下を含めてください：

      引き出しが行われた日時と方法（ATMか対面か）、

      銀行から提供された追加情報、

      問題解決と再発防止に向けた提案、

      簡潔かつ丁寧な表現を用いてください。'
  roleplay1_key_expressions:
  - category_en: Stating the purpose
    category_ja: 目的を述べる
    items:
    - I want to check a bank account statement.
  - category_en: Giving a polite command
    category_ja: 丁寧な命令
    items:
    - Please tell me what time and where it happened.
  - category_en: Checking information
    category_ja: 情報の確認
    items:
    - Can I check? You said .... Is that right?
  roleplay_model:
  - role: Teacher
    utterance: Hello. Bank of Hawaii. How can I help you?
  - role: Student
    utterance: Hello. I work for the Japanese consulate. I want to check a bank account
      statement.
  - role: Teacher
    utterance: I see. Do you have the account information with you?
  - role: Student
    utterance: Yes, I have the bank book. The account number is 011-12378.
  - role: Teacher
    utterance: Thank you. What is the problem?
  - role: Student
    utterance: Someone took out 500 dollars. It was made three days ago. Please tell
      me what time and where it happened.
  - role: Teacher
    utterance: I see. Let me check.
  - role: Student
    utterance: Okay.
  - role: Teacher
    utterance: Okay, so that transaction happened via an ATM after the bank closed.
      It happened at 8:05 pm on November 5. The ATM is on Lyons Street in Waikiki.
  - role: Student
    utterance: I see. Thank you. Can I check? You said November 5 at 8:05pm. And the
      ATM is on Lyons Street. Is that right?
  - role: Teacher
    utterance: That’s correct.
  - role: Student
    utterance: Thank you.
  - role: Teacher
    utterance: You’re welcome.
  - role: Student
    utterance: Goodbye.
  - role: Teacher
    utterance: Goodbye.
