    category_ja: 日常業務を明確に説明する
    items:
    - In the morning, I check emails and do paperwork.
  - category_en: Encouraging further inquiries
    category_ja: 追加の質問を促す
    items:
    - Let me know if you need more information.
  writing_task_model:
    subject: My Workday
    body: 'Dear John,

      I hope you are well.

      Thank you for your email. Here is a simple outline of my daily work.

      In the morning, I check emails and do paperwork. After that, I help visitors
      and answer questions. In the afternoon, I join meetings and write reports. I
      finish work at 5 p.m.

      To stay on track, I write a to-do list every morning. I also take short breaks
      to stay fresh.

      I hope this helps. Let me know if you need more information.

      Best,

      Taro Suzuki'
