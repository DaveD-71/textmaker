    level: B2
  writing_task_key_expressions:
  - category_en: Explaining why the situation is problematic
    category_ja: 不満の原因を説明する
    items:
    - Late deliveries make it difficult for us to do our work.
  - category_en: Asking clearly for steps to avoid repetition
    category_ja: 再発防止策を明確に求める
    items:
    - What steps will your company take to make sure this does not happen again?
  writing_task_model:
    subject: Late Delivery Issue
    body: 'Dear Mr. Allen,

      I hope you are doing well.

      I am writing about our recent order. The office paper was supposed to arrive
      last Wednesday, but it came a week late. This has happened three times in the
      last six months. Late deliveries make it difficult for us to do our work because
      we rely on these supplies.

      Can you tell us why the order was delayed? Also, what steps will your company
      take to make sure this does not happen again? We want to continue working with
      you, but we need deliveries to be on time.

      Please let me know as soon as possible. I look forward to your reply.

      Best regards,

      Taro Suzuki

      Administration Section

      Japanese Consulate'
