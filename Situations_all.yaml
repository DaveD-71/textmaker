  writing_task_model:
    subject: ''
    body: 'Title: Obon - A Time to Remember

      Obon is a special time in Japan. It is when families remember and honor their
      ancestors. Many believe that the spirits of loved ones return during this time.
      Obon takes place in July or August, depending on the region.

      During Obon, families visit the graves of their ancestors. They clean the graves
      and leave food, flowers, and incense. There are also summer festivals called
      bon matsuri. People enjoy bon odori (a traditional dance) and fireworks.

      For me, Obon is important because I can see my family and join in old traditions.
      I enjoy dancing bon odori and eating festival food like yakitori and shaved
      ice.

      I think Obon is a special holiday because it brings families together and helps
      us remember the past.

      Taro Suzuki

      Japanese Consulate in Melbourne'
