  writing_task_key_expressions:
  - category_en: Clearly explaining a financial issue
    category_ja: 金融上の問題を明確に説明する
    items:
    - I called the bank about the $500 withdrawal from our account.
  - category_en: Clearly advising next steps
    category_ja: 次の対応を明確に提案する
    items:
    - To fix this, we must check who used the ATM card on March 1.
  writing_task_model:
    subject: Problem with our bank account
    body: 'Dear Mr. Jones,

      I called the bank about the $500 withdrawal from our account. The bank said
      it happened on March 1 at 1:05 pm. It was an ATM withdrawal. They did not have
      any more information about who took the money.

      To fix this, we must check who used the ATM card on March 1. Also, we can ask
      the bank to make our account safer. I will check our account again soon.

      If you have questions, please tell me. Thank you very much for your help.

      Best regards,

      Taro Suzuki

      Consulate staff, Honolulu'
