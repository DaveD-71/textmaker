  writing_task_model:
    subject: School Fees and Student Numbers
    body: 'Dear Ms. Malone,

      I hope you are well. My name is Hikari Sato, and I work at the Consulate-General
      of Japan. I am writing to ask about school fees and the number of Japanese students
      at your school.

      We are making a report. Can you tell me the tuition fee for this year? Also,
      are there extra costs for books, uniforms, or school activities?

      I would also like to know how many Japanese students are studying at your school.
      If possible, please tell me what part of the total student number they make
      up.

      Thank you for your help. I look forward to your reply.

      Best regards,

      Hikari Sato

      Consulate-General of Japan'
