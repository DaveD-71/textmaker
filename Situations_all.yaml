- situation_id: F09
  cefr_target: B1
  purpose_objectives:
    en: 'Making complaints.

      Can make a complaint.'
    ja: '苦情を申し立てる。

      不満や苦情を言うことができる。'
  roleplays:
  - id: 1
    en: You ordered paper for the office photocopier from a local vendor but the delivery
      is a week late. This is the third time the vendor has not delivered on time.
      Contact them and complain about the late delivery.
    ja: オフィスのコピー機用の紙を地元の業者に注文しましたが、納品が1週間遅れています。この業者が期日通りに納品しないのはこれで3度目です。業者に連絡し、配達の遅れについて苦情を言ってください。
  - id: 2
    en: You are having a routine annual review meeting with your boss about your performance.
      You like your job, but you are not happy about the work schedule. You have to
      work on Saturdays and you do not want to. Tell your boss you are not happy with
      this situation.
    ja: あなたは、上司と自分の業績について年1回の定期的な面談を行っています。あなたは自分の仕事が好きですが、仕事のスケジュールには不満があります。あなたは土曜日に仕事をしなければなりませんが、それを望んでいるわけではありません。この状況に満足していないことを上司に伝えてください。
  writing_task:
    description_en: 'Based on role play 1, you need to send an email to the vendor
      complaining about the late delivery of copy paper for your office.

      Write an email that:

      expresses dissatisfaction with the late delivery,

      states that this is the third late delivery,

      requests an explanation for the repeated delays,

      maintains a polite, assertive, and professional tone.'
    description_ja: 'ロールプレイ1に基づき、事務所用コピー用紙の納品が遅れた件について、業者に苦情のメールを送る必要があります。

      以下の内容を含めてください：

      納品遅延への不満の表明、

      過去にも同様の遅延が3回あったことの指摘、

      遅延の理由に関する説明の要請、

      d) 文体は丁寧かつ主張のある、専門的なものにすること。'
  roleplay1_key_expressions:
  - category_en: Stating the problem
    category_ja: 問題を述べる
    items:
    - Well, we were told the paper would be delivered yesterday, but it still hasn’t
      arrived.
  - category_en: Giving detailed background information
    category_ja: 詳しい背景を説明する
    items:
    - This is the third time we have had a late delivery in the last six months.
  - category_en: Stating possible consequences
    category_ja: 起こりうる結果を述べる
    items:
    - If it happens again, I think we will look for another supplier.
  roleplay_model:
  - role: Teacher
    utterance: Good morning. Thank you for calling Paper Supplies. This is John. How
      may I help you?
  - role: Student
    utterance: Hello John. My name is Taro Suzuki. I work at the Embassy of Japan
      here in Toronto. I’m calling about an order we made with your company.
  - role: Teacher
    utterance: I see. How can I help?
  - role: Student
    utterance: Well, we were told the paper would be delivered yesterday, but it still
      hasn’t arrived.
  - role: Teacher
    utterance: I see. Do you know the order number?
  - role: Student
    utterance: Yes, it’s 181-485-632
  - role: Teacher
    utterance: Thank you. Okay, I’ll check the system…. Yes. I see the order there.
      And you are correct, it’s late. According to the schedule, it will be leaving
      the company today. You will receive it later this afternoon.
  - role: Student
    utterance: Okay, well that’s fine. However, this is the third time we have had
      a late delivery in the last six months. It’s usually okay because we always
      order supplies well before we run out, but we want to work with reliable business
      partners.
  - role: Teacher
    utterance: Yes, I understand. I’m very sorry for the delay with the delivery.
  - role: Student
    utterance: Okay, but if it happens again, I think we will look for another supplier.
  - role: Teacher
    utterance: Again, I’m very sorry. I will talk with my manager about it and see
      what we can do to improve the situation.
  - role: Student
    utterance: I think that is a good idea.
  - role: Teacher
    utterance: Thank you for your time. If you need anything else, please do not hesitate
      to call me directly. My name is John Acostas.
  - role: Student
    utterance: Okay John. I’ll do that.
  - role: Teacher
    utterance: Have a nice day.
  - role: Student
    utterance: Thank you. You too.
  - role: Teacher
    utterance: Goodbye.
  - role: Student
    utterance: Goodbye.
  roleplay1_target_vocabulary:
  - term: accord to
    level: B1
  - term: delivery
    level: B1
  - term: directly
    level: B1
  - term: do not hesitate
    level: B2
  - term: reliable
    level: B1
  - term: run out
    level: B1
  - term: supply
    level: B2
  - term: system
    level: B1
