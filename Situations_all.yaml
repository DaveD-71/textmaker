- situation_id: G04
  cefr_target: A2
  purpose_objectives:
    en: 'Giving directions.

      At receptions and other events, you can answer inquiries, give brief introductions
      and directions (location, characteristics, etc.) about specific people to invited
      guests, and exchange questions with them.'
    ja: '案内する。

      レセプション会場などで、招待客に対し、照会に答えて、特定の人物について、簡単な紹介や案内（居場所や特徴など）をし、質問のやりとりをすることができる。'
  roleplays:
  - id: 1
    en: You work in the embassy in Boston. You are supporting a reception for local
      businesspeople. Your role is to greet guests at the door, guide them to the
      reception room, and answer any questions. A guest arrives and asks you where
      he can find the staff member responsible for arranging the reception. Give the
      guest the name of the person, a brief physical description, and his or her current
      location.
    ja: あなたはボストンの大使館に勤務しています。地元のビジネスマンを招いたレセプションのサポートをしています。あなたの役割は、ゲストを玄関で出迎え、レセプションルームに案内し、質問に答えることです。あるゲストが到着し、レセプションの手配を担当するスタッフはどこにいるかと尋ねてきました。そのゲストに、その人の名前と現在いる場所を伝えてください。身体的な特徴も簡単に伝えましょう。
  - id: 2
    en: You work in the embassy in New Zealand. You are supporting a reception for
      the local film industry. Your role is to greet guests at the door, guide them
      to the reception room, and answer any questions. A guest arrives and asks you
      where he can find the organizer of the event. Give the guest the name of the
      person, a brief physical description, and the organizer’s current location.
    ja: あなたは、ニュージーランドの大使館に勤務しています。現地の映画関係者のためのレセプションのサポートをしています。あなたの役割は、ゲストを玄関で出迎え、レセプションルームに案内し、質問に答えることです。あるゲストが到着し、イベントの主催者はどこにいるかと尋ねてきました。そのゲストに、主催者の名前と現在いる場所を伝えてください。身体的な特徴も簡単に伝えましょう。
  writing_task:
    description_en: 'Following Roleplay 1, a guest has requested contact information
      for the staff who arranged a reception.

      Write an email to the guest that:

      thanks them for attending the event,

      provides the name of the staff member responsible for the reception,

      shares that staff member’s email address,

      is polite, helpful, and easy to understand.'
    description_ja: 'ロールプレイ1に基づき、ゲストがレセプションを手配したスタッフの連絡先を求めてきました。

      ゲストに次の内容を含むメールを書いてください：

      イベントへの参加に対するお礼、

      レセプション担当スタッフの氏名、

      そのスタッフのメールアドレス、

      d) 礼儀正しく、親切で、わかりやすい文面にすること。'
  roleplay1_key_expressions:
  - category_en: Asking someone the purpose of their visit
    category_ja: 訪問の目的を尋ねる
    items:
    - Are you here for the reception?
  - category_en: Giving a polite direction
    category_ja: 丁寧な案内をする
    items:
    - Please take the stairs.
  - category_en: Describing physical traits
    category_ja: 身体的特徴を説明する
    items:
    - He is about 175 centimeters tall. He has grey hair and wears glasses. He will
      be wearing a name tag.
  roleplay_model:
  - role: Student
    utterance: Hello. Are you here for the reception?
  - role: Teacher
    utterance: Yes, I am.
  - role: Student
    utterance: Okay, the reception is in the Hiramoto Dining Room. It’s on the second
      floor. Please take the stairs.
  - role: Teacher
    utterance: Actually, I’d like to say thank you to Mr. Ono for inviting me, but
      I have never met him. Can you tell me what he looks like?
  - role: Student
    utterance: Certainly. He is about 175 centimeters tall. He has grey hair and wears
      glasses. He will be wearing a name tag. He is in the dining room now.
  - role: Teacher
    utterance: I see. Sorry, can you tell me again, where is the dining room?
  - role: Student
    utterance: It’s the Hiramoto Dining Room, on the second floor, and on the left
      side.
  - role: Teacher
    utterance: I see. Thank you.
  - role: Student
    utterance: You’re welcome.
  roleplay1_target_vocabulary:
  - term: actually
    level: A2
  - term: centimeter
    level: A2
  - term: look like
    level: B1
