- situation_id: C09
  cefr_target: B2
  purpose_objectives:
    en: 'Requesting goods and services.

      Can outline a case for compensation, using persuasive language to demand satisfaction
      and state clearly the limits to any concession they are prepared to make.'
    ja: '商品やサービスを依頼する。

      満足のいく結果を得るために説得力のある言葉を使って、補償を受けるべき根拠を説明するとともに、いかなる条件に対してもその上限を明確に述べることができる。'
  roleplays:
  - id: 1
    en: You work at the consulate in Sydney. You were involved in a minor car accident
      this morning. There was some damage to your vehicle. There are some bents and
      scratches on one of the panels. You believe you were driving safely and appropriately,
      and the other party was responsible for the collision. At the accident site,
      you exchanged insurance details with the other driver. You have now arrived
      at work. Call your insurance company, explain the situation, and make it clear
      that the other party needs to pay the full cost of the repairs.
    ja: あなたはシドニーの領事館に勤務しています。今朝、軽い交通事故に遭いました。あなたの車には多少の損傷があります。パネルの1つが少し曲がり、傷がついています。あなたは自分の運転は安全かつ適切であり、衝突したのは相手の責任であると考えています。事故現場で、あなたは相手の運転手と保険の詳細を交換しました。あなたは今、職場に到着しています。保険会社に電話し、状況を説明し、相手が修理費を全額負担する必要があることを明確に伝えてください。
  - id: 2
    en: You work at the consulate in Toronto. You recently purchased a heater for
      your apartment as it will soon be winter. You have had the heater for a month,
      and it has been working fine until yesterday, when it stopped working. Call
      the store where you purchased the heater and explain the situation. You want
      the store to pick up the heater and replace it with a new one without any additional
      cost to you. You want them to do this on Saturday morning as you have plans
      for the rest of the weekend, and the weather forecast for next week is snow
      every day.
    ja: あなたはトロントの領事館に勤務しています。もうすぐ冬になるので、最近アパート用にヒーターを購入しました。購入してから1ヶ月が経ち、昨日まで問題なく動いていたのですが、動かなくなりました。ヒーターを購入した店に電話し、状況を説明してください。あなたは、その店がヒーターを引き取り、無償で新しいヒーターと交換してくれることを望んでいます。週末は予定があり、来週の天気予報は連日雪なので、土曜日の午前中に交換してほしいと思っています。
  writing_task:
    description_en: 'Following the phone call in Roleplay 1, you need to send an email
      to the insurance company formally reporting the accident and requesting compensation.

      Your email should:

      clearly explain the sequence of events that led to the accident,

      emphasize that you were not at fault and that the other party is responsible
      for the full cost of repairs,

      provide relevant details such as the location, time, and extent of the damage
      to your vehicle,

      use persuasive language to assert your case for full compensation.'
    description_ja: 'ロールプレイ1での電話を受けて、事故について保険会社に正式に報告し、補償を求めるメールを作成してください。

      メールには以下を含めてください：

      事故に至るまでの経緯を明確に説明すること

      自身に責任がないこと、また修理費用は相手側が全額負担すべきであることを主張すること

      発生場所、時間、車両の損傷状況などの詳細を記載すること

      修理費全額の補償を求めるための説得力のある表現を用いること'
  roleplay1_key_expressions:
  - category_en: Rejecting a claim
    category_ja: 主張を却下する
    items:
    - That’s just not true.
  - category_en: Stating a position
    category_ja: 立場を述べる
    items:
    - I don’t think I should have to pay anything for an accident that is not my fault.
  - category_en: Stating a desire with supporting reasons
    category_ja: 裏付けとなる理由とともに願望を述べる
    items:
    - I’d like to get the car fixed asap. I don’t think it’s roadworthy in its current
      condition.
  roleplay_model:
  - role: Teacher
    utterance: Good morning. Thank you for calling RACV Car insurance. This is Andrew.
      How may I help you today?
  - role: Student
    utterance: Hello Andrew. My name is Taro Suzuki. I have insurance with your organization.
      I need to report an accident.
  - role: Teacher
    utterance: I see. First Mr. Suzuki, are you okay? Do you need an ambulance?
  - role: Student
    utterance: No. I’m okay, thank you. The accident happened a little while ago.
      I am now at my office.
  - role: Teacher
    utterance: I see. Thank you for calling. Can I check some things first?
  - role: Student
    utterance: Of course. Go ahead.
  - role: Teacher
    utterance: Was another vehicle involved in the accident?
  - role: Student
    utterance: Yes, there was one other car involved.
  - role: Teacher
    utterance: I see. Did you get the contact information for the other driver?
  - role: Student
    utterance: Yes, I did.
  - role: Teacher
    utterance: Did you get the insurance information?
  - role: Student
    utterance: Yes, I did.
  - role: Teacher
    utterance: Okay, can you tell me what happened?
  - role: Student
    utterance: Okay. I was driving straight down Centre Road heading west from Bentleigh
      Station, heading towards the Nepean Highway. I was in the left lane. All of
      a sudden, the car in the right lane hit my car.
  - role: Teacher
    utterance: I see. Can you give me some more information about how the accident
      happened?
  - role: Student
    utterance: Yes. The driver merged into the left lane without checking. He didn’t
      see me and wasn’t aware that I was already in the left-hand lane when he started
      merging. As a result, the front left side of his car hit the back right bumper
      of my car.
  - role: Teacher
    utterance: I see. How bad is the damage?
  - role: Student
    utterance: It’s not too bad, to be honest. However, the driver said there was
      room for him to merge into the lane, and I must have slowed down after he started
      to merge, causing the accident. That’s just not true, and I don’t think I should
      have to pay anything for an accident that is not my fault.
  - role: Teacher
    utterance: I see. I need to ask you to fill out an online accident report on our
      website. Just go to RACV.com, and click ‘Make a claim’ and then choose ‘Car
      insurance claims’ and it will take you through the online claim process.
  - role: Student
    utterance: Okay, I will do that. How long will it take to process the claim? I’d
      like to get the car fixed asap. I don’t think it’s roadworthy in its current
      condition.
  - role: Teacher
    utterance: We will need to conduct an investigation. They usually take a week
      or two. We will let you know.
  - role: Student
    utterance: I see. Okay, I will make the claim today.
