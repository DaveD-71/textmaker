  writing_task_model:
    subject: Japanese Cultural Event Proposal
    body: 'Dear John san,

      I hope you are well.

      I''m writing to summarize our plan for the next Japanese cultural event, as
      discussed today.

      We propose hosting an event focused on Japanese crafts, specifically ikebana
      (flower arranging). We considered other ideas like Sports Day, but we believe
      a craft event will be more appealing to local citizens in Sydney. Last year''s
      sports-related event did not attract many visitors, so we think a craft activity
      will be more popular.

      Ikebana is an excellent choice because it''s interesting and cost-effective.
      We can keep costs low by using seasonal flowers from the embassy garden. We
      will only need to pay for an ikebana teacher to lead the session.

      We believe this plan is very achievable and appealing to local people interested
      in Japanese culture. This event will be a good way to build connections and
      share Japanese culture in Sydney while staying within our budget.

      Please let me know your thoughts or if you have any questions.

      Best regards,

      Taro Suzuki

      Embassy of Japan, Sydney'
