- situation_id: D04
  cefr_target: B2
  purpose_objectives:
    en: 'Dealing with problems.

      When you are at an airline counter and your scheduled flight is cancelled, you
      can negotiate by showing the impact you will suffer and by stating alternatives
      and concessions.'
    ja: 'トラブルに対処する。

      航空会社のカウンターで、予定していた飛行機が欠航になったときなど、自分が被る被害を示したり、代案や譲歩案などを述べたりしながら交渉することができる。'
  roleplays:
  - id: 1
    en: You work for the consulate in Brisbane. You have booked a flight to Sydney
      to attend an important meeting that starts tomorrow. The booking is for an economy
      class seat. When you arrive at the airport, you are informed that your flight
      has been cancelled. The staff tell you that the next available flight with an
      economy seat of equal value is tomorrow morning, which means you will miss the
      meeting. However, there is another flight this evening with a business class
      seat available. Explain your situation and request the seat on this evening’s
      flight but for a reduced cost.
    ja: あなたはブリスベンの領事館に勤務しています。明日から始まる重要な会議に出席するため、シドニー行きのフライトを予約しました。予約はエコノミークラスの座席です。空港に着くと、フライトがキャンセルされたことが告げられました。係員から、次に利用可能な同価格のエコノミー席のフライトは明日の朝であることを告げられましたが、それは会議に間に合わないことを意味します。しかし、今晩、ビジネスクラスの座席が空いている便があります。状況を説明し、その便の座席を割引料金で利用できるよう要請してください。
  - id: 2
    en: You work for the consulate in Toronto. You have booked a flight to Calgary
      to attend an important conference that starts tomorrow. The booking is for an
      economy class seat. When you arrive at the airport, you are informed that your
      flight has been cancelled. The staff tell you that the next available flight
      with an economy seat of equal value is tomorrow morning, which means you will
      miss the meeting. However, there is another flight this evening with a business
      class seat available. Explain your situation and request the seat on this evening’s
      flight but for a reduced cost.
    ja: あなたはトロントの領事館に勤務しています。明日から始まる重要な会議に出席するため、カルガリー行きの便を予約しました。予約はエコノミークラスの座席です。空港に着くと、フライトがキャンセルされたことが告げられました。係員から、次に利用可能な同価格のエコノミー席のフライトは明日の朝であることを告げられましたが、それは会議に間に合わないことを意味します。しかし、今晩、ビジネスクラスの座席が空いている便があります。状況を説明し、その便の座席を割引料金で利用できるよう要請してください。
  writing_task:
    description_en: 'Write an email to the airline about your cancelled flight and
      request a seat on the evening’s business class flight at a reduced cost.

      Your email should:

      explain the urgency of attending your meeting in Sydney,

      describe the inconvenience caused by the cancellation,

      explain why a business class seat is necessary to arrive on time,

      be polite yet assertive in tone.'
    description_ja: 'フライトのキャンセルにより、今晩のビジネスクラスの便への搭乗を要望する内容のメールを航空会社に送ります。

      以下を含めてください：

      シドニーでの会議の重要性と緊急性、

      フライトキャンセルによる不都合の説明、

      会議に間に合うためにビジネスクラスが必要な理由、

      丁寧だが主張のあるトーンで書くこと。'
  roleplay1_key_expressions:
