    category_ja: 詳細な情報を尋ねる
    items:
    - How much exactly do I need to pay to secure the apartment?
  - category_en: Requesting information about possibilities
    category_ja: 仮定的な状況について尋ねる
    items:
    - If I suddenly have to return to Japan, will there be any fees for ending the
      contract early?
  writing_task_model:
    subject: Questions About Renting the Apartment
    body: 'Dear Real Estate Agent,

      Thank you for showing me the apartment in Canberra. I liked it and would like
      to rent it. Before signing the contract, I have a few questions:

      1. How much exactly do I need to pay to secure the apartment? Also, how can
      I make this payment?

      2. After payment, when can I receive the keys to the apartment?

      3. If I suddenly have to return to Japan, will there be any fees for ending
      the contract early?

      Thank you for your assistance. I look forward to hearing from you soon.

      Best regards,

      Taro Suzuki'
