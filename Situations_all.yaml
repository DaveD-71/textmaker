  - role: Teacher
    utterance: Hello. How may I help you?
  - role: Student
    utterance: I’ve just arrived at the airport only to find out that my flight has
      been cancelled.
  - role: Teacher
    utterance: Okay. What flight were you on?
  - role: Student
    utterance: It was QA62 from Brisbane to Sydney, and scheduled to depart at 7pm.
  - role: Teacher
    utterance: That’s right. As you said, unfortunately the flight has been cancelled.
  - role: Student
    utterance: When is the next available flight?
  - role: Teacher
    utterance: Can I have your booking information?
  - role: Student
