  writing_task_model:
    subject: Damaged Equipment Issue
    body: 'Dear Mr. Brown,

      Thank you for your email about the equipment in the conference room we used
      at the Continental Hotel last week.

      We were surprised to hear about this issue because the room was checked carefully
      by your staff immediately after our event, and no damage was reported at that
      time. We always make sure to leave the rooms in good condition, so this claim
      was unexpected.

      To resolve this quickly and keep our good relationship, I suggest meeting at
      the hotel soon. We can review the reported damage together and discuss possible
      solutions. I believe this will help clear up any misunderstandings.

      We greatly value our ongoing relationship with your hotel and look forward to
      using your facilities again in the future.

      Please let me know a suitable time for this meeting.

      Thank you for your understanding.

      Best regards,

      Taro Suzuki

      Consulate of Japan, New York'
