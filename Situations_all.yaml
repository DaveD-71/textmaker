- situation_id: G02
  cefr_target: A2
  purpose_objectives:
    en: 'Requesting goods and services.

      On a business trip, you can call a hotel, tell them about your specific needs,
      confirm the conditions, etc., and then make a reservation.'
    ja: '商品やサービスを依頼する。

      出張に際してホテルに電話をして、具体的な要望を伝えて、条件等を確認した上で、予約をすることができる。'
  roleplays:
  - id: 1
    en: Your boss and one other staff member are going to New York on a business trip.
      Contact a travel agent and reserve a hotel room. You want a non-smoking room
      for each person, and they prefer to have rooms on different floors. They will
      check in to the hotel around 10 p.m. as they need to go to a business dinner
      directly from the airport. Tell the staff their check-in time will be around
      10 p.m.
    ja: あなたの上司とスタッフ一人がニューヨークに出張するため、旅行会社に連絡をとって、ホテルを予約してください。2室とも禁煙で、異なる階の部屋を手配してください。到着日は空港から直接会食に向かうため、ホテル到着は夜10時頃になる予定です。チェックインが夜10時ごろになることをホテルに伝えてください。
  - id: 2
    en: Your boss and one other staff member are going to New York on a business trip.
      Contact a travel agent and book a flight. You need to book a business class
      seat for your boss and an economy class seat for the other staff. They will
      have a business dinner on September 17 at 6 p.m. You need to book a flight which
      will arrive in time for them to attend the dinner. They will also attend a conference
      in New York between September 18 and September 21.
    ja: あなたの上司とスタッフ一人がニューヨークに出張するため、旅行会社に連絡をとって、飛行機の予約をしてください。上司はビジネスクラスを、スタッフはエコノミークラスを手配してください。9月17日の夜6時からはじまる会食に間に合うフライトを手配してください。二人は9月18日から9月21日まで行われる会議にも出席します。
  writing_task:
    description_en: 'Following Roleplay 1, you need to confirm hotel reservations
      for a business trip to New York.

      Write an email to your boss and colleague that:

      confirms the reservation,

      mentions that both rooms are non-smoking,

      states that rooms have been arranged on different floors as requested,

      includes the check-in time.

      Keep the message polite, clear, and professional.'
    description_ja: 'ロールプレイ1に基づき、上司と同僚のニューヨーク出張に関するホテル予約の確認メールを作成してください。

      メールには以下を含めてください：

      予約の確認、

      両室が禁煙であることの確認、

      リクエスト通り別々のフロアでの部屋割り、

      チェックイン時間の明記。

      丁寧で明確、かつプロフェッショナルな文体を使用してください。'
  roleplay1_key_expressions:
  - category_en: Stating your purpose
    category_ja: 目的を述べる
    items:
    - I want to book two rooms, please.
  - category_en: Exchanging information
    category_ja: 情報交換をする
    items:
    - The guests will arrive around 10 p.m. on the 17th.
  - category_en: Confirming a request
    category_ja: 要望を確認する
    items:
    - Is that okay?
  roleplay_model:
  - role: Teacher
    utterance: Good morning. Hilton Midtown Hotel. This is Shawna speaking. How may
      I help you?
  - role: Student
    utterance: Good morning. I want to book two rooms, please.
  - role: Teacher
    utterance: Certainly. When will you be checking-in?
  - role: Student
    utterance: September 17.
  - role: Teacher
    utterance: And how long will you stay?
  - role: Student
    utterance: Until September 22.
  - role: Teacher
    utterance: I see. Do you have any requests?
  - role: Student
    utterance: Can I have non-smoking rooms, please?
  - role: Teacher
    utterance: All our rooms are non-smoking.
  - role: Student
    utterance: I see. And can I have different floors, please?
  - role: Teacher
    utterance: Do you mean you want each room on a different floor?
  - role: Student
    utterance: Yes, that’s right.
  - role: Teacher
    utterance: Please wait a moment while I check our room availability.
  - role: Student
    utterance: Okay.
  - role: Teacher
    utterance: Okay, we have two single rooms available for five nights each on different
      floors, checking in on September the 17th, and checking out on the 22nd. Because
      you are staying five nights, we can include breakfast for both guests at no
      extra charge.
  - role: Student
    utterance: Oh, good. The guests will arrive around 10 p.m. on the 17th. Is that
      okay?
  - role: Teacher
    utterance: Yes, that’s fine. Guests can check-in at any time.
  - role: Student
    utterance: Great.
  - role: Teacher
    utterance: Could I have the name of the guests and the payment information please?
  - role: Student
    utterance: Yes. It’s… (The caller gives the information).
  - role: Teacher
    utterance: Thank you for your call. We will send a confirmation email immediately.
      Please check the information and let us know if you need anything else.
  - role: Student
    utterance: Thank you. I’ll do that. Have a nice day.
  - role: Teacher
    utterance: Thank you. Goodbye.
  - role: Student
    utterance: Goodbye.
  roleplay1_target_vocabulary:
  - term: around
    level: A2
  - term: availability
    level: B2
  - term: certainly
    level: A2
  - term: charge
    level: B1
