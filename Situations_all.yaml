    level: B2
  - term: make it
    level: C1
  writing_task_key_expressions:
  - category_en: Informing clearly about a problem
    category_ja: 問題を明確に報告する
    items:
    - I am writing to report that one of my suitcases did not arrive at New York's
      airport today.
  - category_en: Asking for quick help
    category_ja: 迅速な支援を求める
    items:
    - Could you please help locate it as soon as possible?
  writing_task_model:
    subject: Missing Luggage Report
    body: 'Dear Airline Staff,

      I am writing to report that one of my suitcases did not arrive at New York''s
      airport today, after my flight from Narita Airport on March 15, 2024 (Flight
      NH010).

      I checked in two suitcases at Narita Airport around 11:00 AM. Upon arrival at
      JFK Airport in New York at approximately 10:30 AM local time, only one suitcase
      arrived.

      The missing suitcase is a large black suitcase, approximately 75 cm in height,
      with four wheels and a blue luggage strap around it. It also has a small white
      name tag with my contact details attached to the handle. I have attached a copy
      of my luggage check-in slip for your reference.

      I am very concerned as the suitcase contains important documents and personal
      items needed urgently. Could you please help locate it as soon as possible?

      Thank you very much for your assistance. Please let me know if you need any
      further information.

      Best regards,

      Taro Suzuki'
