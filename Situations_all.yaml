  writing_task_key_expressions:
  - category_en: Explaining clearly the problem encountered
    category_ja: 具体的な問題を説明する
    items:
    - First, it often jams when we try to print addresses on envelopes.
  - category_en: Seeking confirmation of planned actions
    category_ja: 今後の対応の確認を求める
    items:
