- situation_id: H10
  cefr_target: A2
  purpose_objectives:
    en: 'Using telecommunications.

      Can understand a simple message (e.g., “My flight is late. I will arrive at
      ten o’clock.”), confirm details of the message and pass it on by phone to other
      people concerned.'
    ja: 'テレコミュニケーションの利用。

      簡単なメッセージ（例：飛行機が遅れているので、10時に到着します。）を理解し、メッセージの詳細を確認し、関係者に電話で伝えることができる。'
  roleplays:
  - id: 1
    en: You work at the Japanese consulate in Chicago. Your colleague calls to inform
      you that a scheduled meeting with a delegation from Japan is delayed due to
      flight delays. You need to receive the message, confirm the new arrival time,
      and relay this information to the consul general.
    ja: あなたはシカゴの日本領事館で働いています。同僚から電話があり、予定されていた日本からの代表団との面会が、飛行機の遅れにより遅れるとのことです。あなたはメッセージを理解し、新しい到着時間を確認し、この情報を総領事に伝える必要があります。
  - id: 2
    en: You are tasked with informing a business partner about a change in meeting
      time. Due to unforeseen circumstances, the meeting scheduled for 2 p.m. has
      been rescheduled to 3 p.m. Confirm the change with the business partner over
      the phone.
    ja: あなたはビジネスパートナーに会議時間の変更を伝えるタスクを与えられています。不測の事態により、午後2時に予定されていた会議が午後3時に変更になりました。電話でビジネスパートナーに変更を確認してください。
  writing_task:
    description_en: 'Based on Role Play 1, write an email to inform your colleagues
      in San Francisco that the flight of the delegation from Japan has been delayed.

      Write an email that:

      informs them of the delay,

      provides the updated arrival time,

      includes any other relevant details about the flight change,

      is clear, concise, and informative.'
    description_ja: 'ロールプレイ1に基づき、日本からの代表団のフライトが遅延したことをサンフランシスコの同僚に知らせるメールを作成してください。

      以下を含めてください：

      遅延の発生と理由（わかれば）、

      新しい到着時刻、

      その他必要な情報（ゲート変更、便名など）、

      明確で簡潔な表現で書いてください。'
  roleplay1_key_expressions:
  - category_en: Understanding a message
    category_ja: メッセージを理解する
    items:
    - I'm calling to let you know that the delegation's flight from Tokyo is delayed
      due to bad weather.
  - category_en: Confirming details
    category_ja: 詳細を確認する
    items:
    - Did you say the new arrival time is 10 o'clock?
  - category_en: Relaying information
    category_ja: 情報の伝達
    items:
    - Alright, I'll pass this information on to the consul-general.
  roleplay_model:
  - role: Student
    utterance: Japanese Consulate in Chicago. How can I assist you?
  - role: Teacher
    utterance: Hello Taro. It’s John, John Addams from the consulate. I'm calling
      to let you know that the delegation's flight from Tokyo is delayed due to bad
      weather. They will now arrive at 10 o'clock instead of 9.
  - role: Student
    utterance: Thank you for informing me, John. Did you say the new arrival time
      is 10 o'clock?
  - role: Teacher
    utterance: Yes, that's correct.
  - role: Student
    utterance: Alright, I'll pass this information on to the consul-general. Thank
      you.
  - role: Teacher
    utterance: You're welcome. Bye.
