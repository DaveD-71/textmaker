- situation_id: H08
  cefr_target: A2
  purpose_objectives:
    en: 'Information exchange.

      Can ask and answer questions about what they do at work and in their free time.'
    ja: '情報交換をする。

      仕事と余暇の過ごし方について質問し、答えることができる。'
  roleplays:
  - id: 1
    en: You are visiting the consulate in Toronto from Japan, on business. The staff
      in the consulate have arranged a small welcoming dinner for you at a nearby
      restaurant. You are sitting next to one of the local staff. Ask her about her
      job, and what she does in her free time.
    ja: あなたはトロントの領事館を訪問しています。領事館のスタッフが、近くのレストランであなたのために小さな歓迎の夕食を用意してくれました。あなたは現地スタッフの一人の隣に座っています。彼女の仕事について、また自由な時間に何をしているのか尋ねてみてください。
  - id: 2
    en: You are visiting the consulate in Boston. You are having lunch with some of
      the staff. Ask one of the local staff questions about his job and what he does
      in his free time.
    ja: あなたはボストンの領事館を訪問しています。職員と一緒に昼食をとっているところです。現地スタッフの一人に、彼の仕事と余暇の過ごし方について質問してください。
  writing_task:
    description_en: 'Following Roleplay 1, you attended a welcoming dinner hosted
      by the Toronto consulate.

      Write a short email to a non-Japanese colleague that:

      describes your experience at the dinner,

      shares your conversation with Emily, a local staff member,

      explains what you learned about her role and her work with Japanese businesses
      in Toronto,

      uses simple and clear language.'
    description_ja: 'ロールプレイ1に基づき、トロントの領事館が主催した歓迎ディナーでの体験について、非日本人の同僚にメールを書いてください。

      以下を含めてください：

      ディナーの概要と印象、

      現地職員エミリーとの会話内容、

      彼女の仕事内容や日本企業との関わりで学んだこと、

      簡潔で親しみやすい日本語で書いてください。'
  roleplay1_key_expressions:
  - category_en: Responding by asking the same question
    category_ja: 同じ質問で返す
    items:
    - How about you?
  - category_en: Inquiring about someone’s job
    category_ja: 相手の仕事について尋ねる
    items:
    - What do you do at the embassy?
  - category_en: Responding by making a comment
    category_ja: コメントをして答える
    items:
    - It sounds interesting.
  roleplay_model:
  - role: Teacher
    utterance: Hello, welcome to Toronto! I'm Emily, one of the local staff members
      here at the consulate. It's great to have you here, Taro.
  - role: Student
    utterance: Hi Emily, nice to meet you. Thank you for arranging this dinner. It
      all looks great. So, what do you do at the embassy?
  - role: Teacher
    utterance: Well, my role involves assisting with various administrative tasks
      at the consulate, such as processing visa applications and organizing events.
      I also work closely with Japanese businesses in Toronto, providing support for
      their operations and helping them navigate local regulations.
  - role: Student
    utterance: It sounds interesting. I'm here for a few days. What can I do on the
      weekend?
  - role: Teacher
    utterance: On weekends, I like to explore the city and discover new restaurants.
      Toronto has a vibrant food scene, and I enjoy trying out different cuisines.
      I also enjoy outdoor activities like hiking and biking when the weather is nice.
  - role: Student
    utterance: That's great. Toronto seems like a wonderful place to explore…
