  writing_task_model:
    subject: Update on Your Student Visa
    body: 'Dear Mr. Potgeiter,

      I hope you are well.

      I am writing with an update about your student visa. First, I am sorry for the
      delay. I understand this is important.

      Your application is still in process. The immigration office is reviewing your
      documents. We are trying to get your result asap. We will contact you as soon
      as there is news.

      Right now, you do not need to do anything. But if your travel plans change,
      please tell us soon.

      Thank you for waiting. If you have questions, feel free to ask.

      Best regards,

