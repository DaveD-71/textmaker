source: Situations_All.docm
situation_count: 60
cefr_target:
- situation_id: H01
  cefr_target: A2
  purpose_objectives:
    en: 'Giving directions.

      Visitors can be guided at reception, etc., by explaining the location of the
      toilet.'
    ja: '案内する。

      レセプション等で、トイレの場所の説明等、来訪者の案内をすることができる。'
  roleplays:
  - id: 1
    en: You work at the Japanese consulate in Sydney. A visitor has arrived at the
      embassy and has asked if he can use the bathroom. Give him directions to the
      bathroom, and any other information he may need to know.
    ja: あなたはシドニーの日本大使館に勤務しています。訪問者が大使館に到着し、トイレを使いたいと言っています。トイレへの行き方と、その他必要な情報を伝えてください。
  - id: 2
    en: You work in the Consulate General in Toronto. A visitor has arrived and has
      a scheduled meeting to apply for a visa. Give her directions to the Visa Section’s
      waiting room.
    ja: あなたはトロントの総領事館に勤務しています。訪問者が到着しました。ビザ申請のための面談が予定されています。訪問者に査証課の待合室への行き方を教えてください。
  writing_task:
    description_en: 'After Roleplay 1, you need to create a notice for visitors near
      the lobby.

      Write a notice that:

      clearly informs visitors where the bathrooms are located,

      uses polite and simple language,

      is suitable for being posted on a public wall near the lobby.'
    description_ja: 'ロールプレイ1に基づき、ロビー付近に掲示する案内文を作成してください。

      以下を明記してください：

      トイレの場所、

      誰でも理解できるよう、簡潔で丁寧な表現を使用すること、

      公共の場に適したレイアウトや語調を意識すること。'
  roleplay1_key_expressions:
  - category_en: Greetings
    category_ja: 挨拶
    items:
    - Welcome to the Japanese Embassy.
  - category_en: Giving directions
    category_ja: 案内する
    items:
    - The men’s bathroom is down the hall, on the right.
  roleplay_model:
  - role: Student
    utterance: Hello. Welcome to the Japanese Embassy. Do you have an appointment?
  - role: Teacher
    utterance: Yes. I have a meeting from 3pm to apply for a visa. However, I’d like
      to use the bathroom first. Can you tell me where it is?
  - role: Student
    utterance: Yes. The men’s bathroom is down the hall, on the right.
  - role: Teacher
    utterance: Thank you.
  - role: Student
    utterance: You’re welcome.
  roleplay1_target_vocabulary:
  - term: apply
    level: B1
  - term: appointment
    level: A2
  - term: embassy
    level: B1
  - term: hall
    level: A2
  - term: however
    level: A2
  - term: visa
    level: B1
  - term: welcome
    level: A2
  writing_task_key_expressions:
  - category_en: Explaining location clearly
    category_ja: 場所を明確に説明する
    items:
    - Go up the stairs, then turn right. Walk straight, and you will see the bathrooms
      on your left.
  - category_en: Encouraging visitors to ask for help
    category_ja: 援助を申し出る
    items:
    - If you need help, please ask the staff at reception.
  writing_task_model:
    subject: ''
    body: 'Welcome to the Japanese Consulate in Sydney.

      The bathrooms are on the second floor. Go up the stairs, then turn right. Walk
      straight, and you will see the bathrooms on your left. There are signs on the
      wall. The men''s bathroom is first, and the women''s bathroom is next to it.

      If you need help, please ask the staff at reception. They are happy to help
      you.

      We hope you have a nice visit.

      Thank you very much for your cooperation.'
  writing_task_target_vocabulary:
  - term: apply
    level: B1
  - term: appointment
    level: A2
  - term: embassy
    level: B1
  - term: hall
    level: A2
  - term: however
    level: A2
  - term: visa
    level: B1
  - term: welcome
    level: A2
- situation_id: H02
  cefr_target: A2
  purpose_objectives:
    en: 'Giving directions.

      In order to welcome business travelers, you can instruct local staff and exchange
      questions about simple information such as business trip schedules and transfers.'
    ja: '案内する。

      出張者を迎えるために、出張日程や送迎などの簡単な情報について、現地職員に指示したり、質問のやりとりをすることができる。'
  roleplays:
  - id: 1
    en: You work in the embassy in Belgium. A staff member from MOFA will arrive on
      Saturday. Ask local staff to go to the airport to meet him. Give information
      about his arrival schedule and answer any questions the staff asks.
    ja: あなたはベルギーの大使館に勤務しています。外務省の職員が土曜日に到着します。現地スタッフに空港に出迎えに行くよう依頼してください。外務省職員の到着予定を伝え、現地スタッフからの質問に答えてください。
  - id: 2
    en: You work in the Consulate General in Auckland. A staff member from MOFA will
      arrive next Thursday. Ask local staff to go to the airport to meet him. Give
      information about his arrival schedule and answer any questions the staff asks.
    ja: あなたはオークランド総領事館に勤務しています。外務省の職員が来週の木曜日に到着します。現地スタッフに空港に出迎えに行くよう依頼してください。外務省職員の到着予定を伝え、現地スタッフからの質問に答えてください。
  writing_task:
    description_en: 'Following Roleplay 1, write an email to the staff member you
      spoke with by phone.

      Your email should:

      mention your recent phone conversation,

      confirm that the itinerary is attached,

      be polite and clear.'
    description_ja: 'ロールプレイ1に基づき、電話で話した職員に旅程表を送付するメールを作成してください。

      以下を含めてください：

      先ほどの電話のやり取りについて触れる、

      旅程表を添付ファイルとして送付したことの明記、

      丁寧で明確な文体を用いること。'
  roleplay1_key_expressions:
  - category_en: Requesting assistance
    category_ja: 支援を求める
    items:
    - I need your help.
  - category_en: Giving instructions
    category_ja: 指示を与える
    items:
    - Please go to the airport tomorrow and meet Mr. Saito.
  - category_en: Exchanging information
    category_ja: 情報交換をする
    items:
    - He will come from Tokyo. He will arrive on flight UA880.
  roleplay_model:
  - role: Student
    utterance: Hello, John?
  - role: Teacher
    utterance: Yes, Mr. Tsukada. What can I do for you?
  - role: Student
    utterance: I need your help.
  - role: Teacher
    utterance: What is it?
  - role: Student
    utterance: Please go to the airport tomorrow and meet Mr. Saito. He will come
      from Tokyo. He will arrive on flight UA880.
  - role: Teacher
    utterance: Okay. What time?
  - role: Student
    utterance: At 11am.
  - role: Teacher
    utterance: I see. Should I bring him to the embassy, or take him directly to his
      hotel?
  - role: Student
    utterance: Please bring him here. He will have a meeting at 12:00. We will have
      lunch after the meeting.
  - role: Teacher
    utterance: I understand. I will go straight to the airport tomorrow morning to
      meet him.
  - role: Student
    utterance: Thank you. If you have a problem, please call us.
  - role: Teacher
    utterance: I will.
  - role: Student
    utterance: Thank you.
  roleplay1_target_vocabulary:
  - term: airport
    level: A2
  - term: arrive
    level: A2
  - term: bring
    level: A2
  - term: call
    level: A2
  - term: directly
    level: B1
  - term: flight
    level: A2
  - term: should
    level: A2
  - term: straight
    level: A2
  writing_task_key_expressions:
  - category_en: Clearly instructing on meeting arrangements
    category_ja: 詳細な指示を伝える
    items:
    - Please meet him at the airport. After that, take him to his hotel.
  - category_en: Clearly inviting questions
    category_ja: 更なる支援を申し出る
    items:
    - Do you have any questions? Please email or call me anytime.
  writing_task_model:
    subject: Mr. Saito's visit
    body: 'Hello John,

      Mr. Saito from MOFA will come on Saturday. His plane arrives at 11:00 am. The
      flight number is UA880 from Tokyo.

      Please meet him at the airport. After that, take him to his hotel. I attached
      his plan with this email. Please check it.

      Do you have any questions? Please email or call me anytime. Thank you very much
      for your help.

      See you soon and have a nice day.

      Taro Suzuki'
  writing_task_target_vocabulary:
  - term: airport
    level: A2
  - term: arrive
    level: A2
  - term: bring
    level: A2
  - term: call
    level: A2
  - term: directly
    level: B1
  - term: flight
    level: A2
  - term: should
    level: A2
  - term: straight
    level: A2
- situation_id: H03
  cefr_target: A2
  purpose_objectives:
    en: 'Requesting goods and services.

      When attending to a business traveler, you can call the restaurant, make a reservation,
      change or cancel it.'
    ja: '商品やサービスを依頼する。

      出張者のアテンドに際して、レストランに電話し、予約をしたり、変更やキャンセルしたりすることができる。'
  roleplays:
  - id: 1
    en: You work in the consulate in Brisbane. A visitor from MOFA has come to Brisbane
      to meet with staff at the consulate. They have asked you to make a reservation
      at a local restaurant. The visitor has an allergy to seafood.
    ja: あなたはブリスベンの領事館に勤務しています。外務省からの訪問者が領事館の職員と会うためにブリスベンにやってきました。彼らはあなたに地元のレストランを予約するよう依頼してきました。この訪問者には魚介類アレルギーがあります。
  - id: 2
    en: You made a reservation for a visitor from MOFA while working in the consulate
      in Brisbane. However, the staff meeting is running late by about an hour. Call
      the restaurant and ask to change the reservation to a later time. If it’s not
      possible, cancel the reservation.
    ja: あなたはブリスベンの領事館に勤務しています。外務省からの訪問者のために地元のレストランを予約しましたが、会議が1時間ほど長引いています。レストランに電話し、予約を遅い時間に変更するよう依頼してください。変更ができない場合、予約をキャンセルしてください。
  writing_task:
    description_en: 'Following Roleplay 1, write a short email to the visitor with
      details of the reservation.

      Your email should:

      confirm the reservation,

      provide the relevant details (e.g., location, time, and any booking reference),

      be polite and easy to understand.'
    description_ja: 'ロールプレイ1に基づき、予約の詳細を来訪者に共有するための短いメールを作成してください。

      以下を含めてください：

      予約の確認、

      日時、場所、予約番号などの詳細、

      丁寧でわかりやすい表現を使用してください。'
  roleplay1_key_expressions:
  - category_en: Making a reservation
    category_ja: ご予約
    items:
    - Can I make a reservation, please?
  - category_en: Giving a phone number
    category_ja: 電話番号の通知
    items:
    - Sure. It’s 03-5706-7878.
  - category_en: Confirming information
    category_ja: 情報の確認
    items:
    - Yes, that’s right.
  roleplay_model:
  - role: Teacher
    utterance: Hello. Asian Fusion. How can I help you.
  - role: Student
    utterance: Hello. Can I make a reservation, please?
  - role: Teacher
    utterance: Certainly. When is the reservation for?
  - role: Student
    utterance: Next Tuesday.
  - role: Teacher
    utterance: And what time?
  - role: Student
    utterance: 8pm, please.
  - role: Teacher
    utterance: Okay. Let me check… Okay, we have seats available. How many people
      will there be?
  - role: Student
    utterance: Eight people.
  - role: Teacher
    utterance: I see. Sure, we can do that.
  - role: Student
    utterance: Thank you.
  - role: Teacher
    utterance: Can I have your name please?
  - role: Student
    utterance: My name is Taro Suzuki.
  - role: Teacher
    utterance: Okay. And a contact phone number?
  - role: Student
    utterance: Sure. It’s 03-5706-7878.
  - role: Teacher
    utterance: That’s 03-5705-7878?
  - role: Student
    utterance: Yes, that’s right.
  - role: Teacher
    utterance: Okay, we look forward to seeing you next Tuesday.
  - role: Student
    utterance: Thank you.
  - role: Teacher
    utterance: Goodbye.
  - role: Student
    utterance: Goodbye.
  roleplay1_target_vocabulary:
  - term: available
    level: A2
  - term: certainly
    level: A2
  - term: check
    level: A2
  - term: contact
    level: A2
  - term: let me
    level: B2
  - term: look forward to
    level: B1
  - term: make a
    level: B2
  - term: reservation
    level: B1
  - term: seat
    level: A2
  - term: sure
    level: A2
  writing_task_key_expressions:
  - category_en: Clearly stating reservation details
    category_ja: 予約内容を明確に伝える
    items:
    - I made a reservation for lunch tomorrow. The restaurant is The Green Garden.
      The time is 12:00 pm.
  - category_en: Clearly addressing dietary restrictions
    category_ja: 特別な配慮を明確に伝える
    items:
    - They do not have seafood. I remember you cannot eat seafood.
  writing_task_model:
    subject: Lunch reservation details
    body: 'Hello Mr. Jones,

      I made a reservation for lunch tomorrow. The restaurant is The Green Garden.
      The time is 12:00 pm. It is near the consulate. You can walk there in about
      ten minutes.

      They serve many kinds of food. They do not have seafood. I remember you cannot
      eat seafood. The restaurant knows about this. They will be careful. If you need
      help finding it, please ask me. I can show you the way.

      Please email me if you have questions. I hope you enjoy your meal.

      Thank you and have a nice day.

      Taro Suzuki'
  writing_task_target_vocabulary:
  - term: available
    level: A2
  - term: certainly
    level: A2
  - term: check
    level: A2
  - term: contact
    level: A2
  - term: let me
    level: B2
  - term: look forward to
    level: B1
  - term: make a
    level: B2
  - term: reservation
    level: B1
  - term: seat
    level: A2
  - term: sure
    level: A2
- situation_id: H04
  cefr_target: A2
  purpose_objectives:
    en: 'Showing appreciation.

      In response to a vendor or subordinate, you can use short, simple words to specifically
      thank or apologize for the situation.'
    ja: '感謝の気持ちを伝える。

      業者や部下の対応に対し、状況に応じたお礼や謝罪などを、短い簡単な言葉で具体的に伝えることができる。'
  roleplays:
  - id: 1
    en: You work at the Japanese consulate in New York. You are responsible for ordering
      office supplies. The office printer ran out of ink and you had to order it urgently.
      The vendor changed his delivery schedule so he can bring the printer ink to
      your office the same day. Thank him for his quick service.
    ja: あなたは事務用品の発注を担当しています。オフィスのプリンターのインクが切れてしまい、早急に注文する必要がありました。業者は納品スケジュールを変更し、その日のうちにプリンターインクをあなたのオフィスに届けることができるようになりました。迅速なサービスにお礼を言ってください。
  - id: 2
    en: You are responsible for ordering office supplies. You ordered a large amount
      of paper for the next month. The vendor has offered you a discount. Thank her
      and accept the offer.
    ja: あなたは事務用品の発注を担当しています。あなたは来月分の紙を大量に注文しました。業者はあなたに割引を申し出ています。お礼を言って、その申し出を受け入れてください。
  writing_task:
    description_en: 'Following Roleplay 1, you need to thank the vendor for their
      quick delivery of printer ink.

      Write an email that:

      expresses your appreciation for the same-day delivery,

      thanks them for responding quickly to your urgent request,

      is polite and professional.'
    description_ja: 'ロールプレイ1に基づき、緊急対応にもかかわらずプリンター用インクを即日で納品してくれた業者に感謝のメールを送ってください。

      以下を含めてください：

      迅速な対応への感謝、

      効率的なサービスに対する感謝の意、

      丁寧で礼儀正しい表現を使用してください。'
  roleplay1_key_expressions:
  - category_en: Introducing yourself on the phone
    category_ja: 電話で自己紹介をする
    items:
    - This is James from Office Goods
  - category_en: Stating appreciation
    category_ja: 感謝の気持ちを伝える
    items:
    - Thank you. This helps us a lot.
  - category_en: Ending conversation positively
    category_ja: 良い印象を与え会話を終了する
    items:
    - Have a great day.
  roleplay_model:
  - role: Teacher
    utterance: Hello, Mr. Suzuki?
  - role: Student
    utterance: Yes. I’m Taro Suzuki.
  - role: Teacher
    utterance: This is James from Office Goods. I have arrived at your office. I have
      your printer ink.
  - role: Student
    utterance: Oh James. Of course. Please come in.
  - role: Teacher
    utterance: Thank you... So here is the order you requested. As promised, I brought
      it as fast as I could.
  - role: Student
    utterance: Thank you, James. We must print these documents quickly. This helps
      us a lot.
  - role: Teacher
    utterance: No problem. Is there anything else you need?
  - role: Student
    utterance: No, that’s it. Thanks again.
  - role: Teacher
    utterance: No problem. Okay, then I’ll get going. Goodbye.
  - role: Student
    utterance: Goodbye James. Have a great day.
  - role: Teacher
    utterance: Thank you. You, too.
  roleplay1_target_vocabulary:
  - term: come in
    level: A2
  - term: document
    level: A2
  - term: else
    level: A2
  - term: good
    level: B1
  - term: must
    level: A2
  - term: office
    level: A2
  - term: order
    level: A2
  - term: print
    level: A2
  - term: printer
    level: A2
  - term: promise
    level: B1
  - term: quickly
    level: A2
  - term: request
    level: B1
  writing_task_key_expressions:
  - category_en: Clearly thanking someone for prompt service
    category_ja: 明確に感謝を伝える
    items:
    - Thank you very much for bringing the printer ink today. It was very fast.
  - category_en: Clearly stating future intent
    category_ja: 今後の協力意向を明確に伝える
    items:
    - Next time we need supplies, we will call you again.
  writing_task_model:
    subject: Thank you for your quick help
    body: 'Hello James,

      Thank you very much for bringing the printer ink today. It was very fast. We
      needed it quickly for our work. Now we can print important papers again. Your
      quick help was very important to us. We are very happy with your service.

      Next time we need supplies, we will call you again. Thank you again for your
      help today.

      Have a good day, and see you soon.

      Taro Suzuki

      Japanese Consulate, New York'
  writing_task_target_vocabulary:
  - term: come in
    level: A2
  - term: document
    level: A2
  - term: else
    level: A2
