  writing_task_key_expressions:
  - category_en: Describing an event clearly
    category_ja: 出来事を明確に伝える
    items:
    - The accident occurred at around 8:30 a.m. on Centre Road.
  - category_en: Clarifying incorrect information
    category_ja: 誤った情報を正す
    items:
    - The other driver said I slowed down suddenly, causing the accident. However,
      this is not correct.
  writing_task_model:
    subject: Accident Report and Insurance Claim
    body: 'Dear RACV Claims Department,

      I am writing to report a car accident that happened earlier today and to request
      your assistance with my claim.

      The accident occurred at around 8:30 a.m. on Centre Road, close to Bentleigh
      Station. I was driving in the left lane when another driver suddenly merged
      from the right lane without checking for traffic. His vehicle hit mine, causing
      damage to the right side of my car.

      The other driver said I slowed down suddenly, causing the accident. However,
      this is not correct. I was driving safely and at a steady speed. He merged without
      properly checking if the lane was clear. Therefore, I believe his insurance
      should cover the full repair costs.

      I''ve already completed the accident report form online. Please process this
      claim as soon as possible because my car is not safe to drive in its current
      condition.

      Thank you very much for your assistance. Please contact me if you need any additional
      information.

      Best regards,

      Taro Suzuki

      Consulate of Japan, Melbourne'
