- situation_id: E10
  cefr_target: B1
  purpose_objectives:
    en: 'Giving directions.

      Can describe how to do something, giving detailed instructions.'
    ja: '案内する。

      何かをする方法を詳しく説明できる。'
  roleplays:
  - id: 1
    en: You work at the consulate in Chicago. The consulate has recently hired a new
      local staff member. As part of her training, you need to explain the visa application
      procedure so she can answer basic questions about visa applications to US citizens
      over the telephone.
    ja: あなたはシカゴの領事館に勤務しています。領事館は最近、新しい現地スタッフを採用しました。彼女のトレーニングの一環として、米国市民へのビザ申請に関する基本的な質問に電話で答えられるよう、ビザ申請手続きについて説明する必要があります。
  - id: 2
    en: You have worked at the embassy in London for two years, and your placement
      is coming to an end. Your replacement arrived two weeks ago, and you are in
      the process over handing over your job. Give detailed instructions on how to
      perform one of your job duties.
    ja: あなたはロンドンの大使館に2年間勤務し、もうすぐ派遣期間が終了します。2週間前に後任者が着任し、あなたは仕事の引継ぎをしているところです。あなたの職務のひとつについて、どのように行うか詳しく説明してください。
  writing_task:
    description_en: 'Following Roleplay 1, a newly hired local staff member has asked
      about the visa application process.

      Write an email that:

      explains the visa application procedure for US citizens,

      includes types of visas, required documents, application forms, and relevant
      steps or guidelines,

      keeps the explanation simple and easy to understand,

      encourages them to ask questions or request help if needed.'
    description_ja: 'ロールプレイ1に基づき、新たに雇用された現地職員から、米国市民のビザ申請手続きについて質問がありました。

      以下の内容を含めたメールを作成してください：

      米国市民向けのビザ申請手続きの概要（ビザの種類、必要書類、申請用紙、手順、ガイドラインなど）、

      複雑な情報を分かりやすく簡潔に伝えること、

      質問やサポートを気軽に求められるよう促すこと、

      明確で親切な文体を心がけること。'
  roleplay1_key_expressions:
  - category_en: Giving instructions
    category_ja: 指示を与える
    items:
    - All the information is on our website. So please check it.
  - category_en: Confirming understanding
    category_ja: 理解度を確認する
    items:
    - What do you know about visa applications?
  - category_en: Giving a reason
    category_ja: 理由を説明する
    items:
    - Because of COVID, it’s important to have correct information. It often changes.
  roleplay_model:
  - role: Student
    utterance: Good morning Fiona.
  - role: Teacher
    utterance: Good morning Taro. It’s nice to see you.
  - role: Student
    utterance: You too. How is your new job?
  - role: Teacher
    utterance: Good I think. There’s a lot to learn.
  - role: Student
    utterance: Yes, there is. Today, I will talk about the visa applications. You
      won’t do visa applications, but I want to give you some basic information. Then
      you can answer questions on the phone.
  - role: Teacher
    utterance: Okay, sure.
  - role: Student
    utterance: What do you know about visa applications?
  - role: Teacher
    utterance: Well, I know that we receive and process applications for visas to
      Japan.
  - role: Student
    utterance: That’s right.
  - role: Teacher
    utterance: And I know that there are different kinds of visas people can apply
      for.
  - role: Student
    utterance: Great. All the information is on our website. So please check it. Because
      of COVID, it’s important to have correct information. It often changes.
  - role: Teacher
    utterance: Sure.
  - role: Student
    utterance: We accept applications from US citizens, or non-US citizens with a
      green card. They must live in our area. So that’s people in Illinois, Indiana,
      Wisconsin, Missouri, Kansas, Minnesota, Nebraska, North Dakota, South Dakota
      or Iowa.
  - role: Teacher
    utterance: Got it.
  - role: Student
    utterance: Please check the website for visa information. People can apply by
      mail or in person. They can also send another person if they cannot come here.
  - role: Teacher
    utterance: I see. How much does it cost to apply for a visa?
  - role: Student
    utterance: There are no visa fees for US citizens. You must have a passport, with
      two or more blank pages. You must complete the visa application form and sign
      it. Please also include a passport photo.
  - role: Teacher
    utterance: Got it.
  - role: Student
    utterance: Okay. I think that’s enough for now. Please read the website information.
      And we’ll talk again next week about the different visa types.
  roleplay1_target_vocabulary:
