    category_ja: 社交的交流を明確に伝える
    items:
    - I sat next to Emily. She works at the consulate.
  - category_en: Clearly conveying enjoyment
    category_ja: 楽しさを明確に表現する
    items:
    - The dinner was very good, too. It was a nice evening.
  writing_task_model:
    subject: Welcome dinner in Toronto
    body: 'Hi Michael,

      I went to a welcome dinner in Toronto. I sat next to Emily. She works at the
      consulate. She helps people with visas. She also helps Japanese businesses in
      Toronto. Emily likes her job. On weekends, she enjoys walking and biking. She
      also likes to eat at restaurants. She said Toronto is a nice city. I enjoyed
      talking with her.

      The dinner was very good, too. It was a nice evening. I liked meeting new people
      here.

      Please email me if you have any questions.

      Best regards,

      Taro Suzuki'
