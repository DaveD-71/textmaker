- situation_id: C05
  cefr_target: B2
  purpose_objectives:
    en: 'Giving opinions.

      Can express their ideas and opinions with precision, and present and respond
      to complex lines of argument convincingly.'
    ja: '意見を述べる。

      自分の考えや意見を正確に表現することができ、複雑な議論にも説得力を持って対応することができる。'
  roleplays:
  - id: 1
    en: You work at the consulate in Melbourne. You are participating in a meeting
      about catering an upcoming event. You favor a local caterer you have worked
      with before. They have always been reliable and provided high quality food.
      However, your counterpart wants to use a new caterer who is popular on Instagram.
      They feel their social media presence would help promote the activities of the
      embassy. You need to argue in favor of your preferred caterer in detail giving
      reasons and evidence to support your preferred choice. You also need to listen
      and respond to the arguments presented by your counterpart.
    ja: あなたはメルボルンの領事館に勤務しています。あなたは今度のイベントのケータリングについてのミーティングに参加しています。あなたは、以前一緒に仕事をしたことのある地元のケータリ
      ング会社を推薦しました。彼らはいつも信頼でき、質の高い料理を提供してくれます。しかし、あなたのカウンターパートは、Instagramで人気のある新しいケータリングを使いたいと言っています。彼らは、彼らのソーシャルメディアでの存在が、大使館の広報活動に役立つと考えています。あなたは、自身が選んだケータリングを支持する理由と証拠を詳細に
  - id: 2
    en: You work at the consulate in Auckland. You are participating in a meeting
      about hiring a band for an upcoming embassy party. You favor a local band you
      have worked with before. They have always been reliable and can play a range
      of music. However, your counterpart wants to use a new band which is popular
      on Instagram. They feel their social media presence would help promote the activities
      of the embassy. You need to argue in favor of your preferred band in detail
      giving reasons and evidence to support your preferred choice. You also need
      to listen and respond to the arguments presented by your counterpart.
    ja: あなたはオークランドの領事館に勤務しています。あなたは今度行われる大使館のパーティーでバンドを雇うための会議に参加しています。あなたは以前一緒に仕事をしたことのある地元のバンドを推薦しました。彼らはいつも信頼でき、様々な音楽を演奏することができます。しかし、あなたのカウンターパートは、Instagramで人気のある新しいバンドを使いたいと言っています。彼らは、彼らのソーシャルメディアでの存在が、大使館の活動を促進するのに役立つと考えています。あなたは、自分が選んだバンドを支持する理由と根拠を詳しく説明する
  writing_task:
    description_en: 'Following a meeting about catering for an upcoming event, you
      need to write an email to your counterpart.

      Your email should:

      summarize the main points discussed during the meeting,

      present persuasive arguments in favor of continuing with the reliable caterer
      you have worked with before,

      address concerns raised about the popularity of the new caterer on Instagram,

      provide evidence to support your position.

      Use clear, persuasive language throughout.'
    description_ja: 'イベントのケータリングについての会議後、あなたの担当する業者を推す内容で、同僚にメールを書く必要があります。

      以下を含めてください：

      会議で話し合われた主なポイントの要約

      以前利用した信頼できるケータラーを継続することの利点と理由

      新しい業者のInstagramでの人気に関する懸念への対応

      自身の立場を支持する証拠の提示

      明確で説得力のある表現を用いてください。'
  roleplay1_key_expressions:
  - category_en: Expressing a clear opinion with strong supporting evidence
    category_ja: 強力な裏付けとともに、明確な意見を述べる
    items:
    - I was thinking we should use Best Foods again. They always give us good quality
      food at a reasonable price, and they have always been reliable. Last year they
      really helped us out when we had that unexpected visit from the American delegation.
      They were fast and professional and really very helpful.
  - category_en: Responding to alternative suggestions
    category_ja: 代替案に反応する
    items:
    - That’s an interesting idea. I hadn’t thought of that. Would they help us promote
      the event through their social media?
  - category_en: Stating conditions and outcomes
    category_ja: 条件と結果を述べる
    items:
    - Well. I think that would be the deciding factor. I am willing to give them a
      go if they will promote the event. Otherwise, I think we’d be better off going
      with Best Foods.
  roleplay_model:
  - role: Student
    utterance: Hi Mary. Thanks for coming today.
  - role: Teacher
    utterance: No problem Taro. I understand we need to choose a caterer.
  - role: Student
    utterance: That’s right. I was thinking we should use Best Foods again. They always
      give us good quality food at a reasonable price, and they have always been reliable.
      Last year they really helped us out when we had that unexpected visit from the
      American delegation. They were fast and professional and really very helpful.
  - role: Teacher
    utterance: Yes, that’s true. However, do you know the company Better Parties?
      They launched about a year ago.
  - role: Student
    utterance: No. I’ve never heard of them. Who are they?
  - role: Teacher
    utterance: Really? They are huge on Instagram. I think they have over half a million
      followers, and they post regularly. Their food looks great, and they have lots
      of positive reviews?
  - role: Student
    utterance: They sound expensive. I don’t know if we could afford them.
  - role: Teacher
    utterance: Well, I will look into the cost, but with such a popular presence on
      social media, we are paying not just for the food, but also the media coverage.
  - role: Student
    utterance: That’s an interesting idea. I hadn’t thought of that. Would they help
      us promote the event through their social media?
  - role: Teacher
    utterance: Possibly. I’d have to check. But I think it would be mutually beneficial,
      so I can’t see why they wouldn’t.
  - role: Student
    utterance: Well. I think that would be the deciding factor. I am willing to give
      them a go if they will promote the event. Otherwise, I think we’d be better
      off going with Best Foods. We have worked with them for a long time, and that
      relationship is important to us. I don’t want to upset them by choosing a competitor
      of theirs.
  - role: Teacher
    utterance: Yes, I understand. Well, let me reach out to Better Parties and see
      what they say.
  - role: Student
    utterance: If you can get back to me within the week, I’d appreciate it. We need
      to start making the arrangements.
  - role: Teacher
    utterance: Yes, I understand. Okay, I’ll contact them today.
  - role: Student
    utterance: Thanks Mary. That would be very helpful.
  - role: Teacher
    utterance: No problem.
