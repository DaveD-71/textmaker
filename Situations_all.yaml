    ja: '意思決定をする。

      依頼に同意したり許可を与える際に、保留や消極的な態度を示したり、条件を述べたり、自分の立場を理解するよう求めることができる。'
  roleplays:
  - id: 1
    en: 'You work at the consulate in Sydney and have a meeting with a local staff
      member. He wants to request a personal loan from the embassy to cover unexpected
      expenses. The embassy can approve this as an advance on his salary. However,
      you need to make the following clear: (1) You are reluctant to approve it, as
      it means his salary—paid in five weeks (two weeks after the end of the calendar-month
      pay period)—will be reduced. (2) He must agree to the conditions: the advance
      is limited to one-third of the monthly salary and can only be granted once.
      (3) Approval requires a special request to the head office in Tokyo, and a response
      may take several days.'
    ja: あなたはシドニーの領事館に勤務しています。あなたは現地の職員と打ち合わせをすることになりました。その職員は、予期せぬ支払いが発生したため、大使館に給料の個人ローンを依頼したいとのことです。大使館は、彼の給与の前払いとしてその要求を承諾することができます。しかし、その職員に以下のことを明確にする必要があります。
      (1) 5週間後（暦月である給与計算期間の終了から2週間後）の給与支給時に支給額が減少することになるため、本来、この要求は許可したくないこと。(2) 前払いに関する条件を承諾すること（前払いできる上限は月給総額の3分の1、前払いできるのは1回のみ）。(3)
      融資を受けるには、あなたが東京のオフィスに特別な依頼をする必要があり、回答が得られるまで数日かかること。
  - id: 2
    en: You work at the consulate in Toronto. A local staff member, who has worked
      at the embassy for one year and has built good relationships, plans to move
      to Japan next month due to his strong interest in the country. He contacted
      a real estate agent in Tokyo and was told he needs a guarantor. Since he knows
      no one in Japan, he has asked you to be his guarantor. Although you like him,
      you don’t know him well and are hesitant. Discuss the matter, explain your reluctance,
      and ask for his understanding. Then decide whether to accept or decline the
      request. If you accept, set conditions. If you decline, do so politely and suggest
      an alternative.
    ja: あなたはトロントの領事館に勤務しています。ある現地スタッフが、日本への強い関心から、日本に移住することになりました。彼は大使館の人たちと良い関係を築いていますが、大使館に勤めてまだ1年です。日本には来月引っ越す予定です。東京の不動産屋に連絡し、アパートを探していますが、保証人が必要だと言われました。彼は日本に知り合いがいないので、あなたに保証人になってもらえないかと頼んできました。あなたは、そのスタッフのことを好きではありますが、あまりよく知らないので、あまり引き受けたくありません。そのスタッフと相談し、保証人になりたくないことを説明し、あなたの立場を理解してもらいましょう。最後に、その依頼を受けるか断るかを決めます。承諾する場合は、条件をつけます。断る場合は、機転を利かせ、別の解決策を提示します。
  writing_task:
    description_en: 'After meeting with a local staff member about a personal loan
      request, you need to send a follow-up email.

      Your email should:

      summarize the discussion,

      explain the conditions and implications of granting the loan, including the
      maximum advance amount and the reduction in the next salary,

      outline the process for submitting the request to the head office in Tokyo.'
    description_ja: '現地職員からの個人ローンの相談を受けた後、その要点をまとめたメールを送る必要があります。

      以下を含めてください：

      面談内容の要約、

      最大貸付額や翌月の給与控除など、ローン提供条件と影響の説明、

      東京本部への申請手続きについて。'
  roleplay1_key_expressions:
  - category_en: Stating conditions when granting permission
    category_ja: 許可を与える際に条件を述べる
    items:
    - We do have a provision for this type of situation, and we can provide you with
      an advance on your salary. However, there are some limitations and conditions
      that you will have to agree to in writing before the payment can be processed…
  - category_en: Expressing reluctance
    category_ja: 不本意であること述べる
    items:
    - I am always reluctant to approve these types of requests.
  roleplay_model:
  - role: Student
    utterance: Hello Paul.
  - role: Teacher
    utterance: Hello Mr. Suzuki. Thanks for agreeing to meet with me.
  - role: Student
    utterance: No problem. What can I do for you?
  - role: Teacher
    utterance: I’m a little embarrassed to ask, but I need a loan, and I was hoping
      the embassy could help.
  - role: Student
    utterance: I see. What kind of loan.
  - role: Teacher
    utterance: I’m afraid I was involved in a car accident last week, and I’m sorry
      to say it was my fault. I have third party insurance, but the insurance company
      has told me it would be cheaper for me to pay the repair cost than process the
      claim because it will mean my insurance payments will go up in the long run.
  - role: Student
    utterance: I see. Why are you asking the embassy?
  - role: Teacher
    utterance: Well, as you know, I moved here six months ago, and I don’t really
      have anyone who I can ask to help. As my employer, I’m hoping you can help.
  - role: Student
    utterance: How much do you need?
  - role: Teacher
    utterance: About 1,000 dollars.
  - role: Student
    utterance: I see. So, let me explain what the embassy can do. We do have a provision
      for this type of situation, and we can provide you with an advance on your salary.
      However, there are some limitations and conditions that you will have to agree
      to in writing before the payment can be processed.
  - role: Teacher
    utterance: I see. Can you tell me what they are?
  - role: Student
    utterance: Okay. First of all, the maximum amount we can provide is equal to one
      third of your salary for the next month, after all taxes and deductions are
      calculated. In your case, we could provide you with the 1000 dollars.
  - role: Teacher
    utterance: I see. Thank you.
  - role: Student
    utterance: However, it is an advance, not a loan. It will be deducted from your
      scheduled salary payment in the middle of next month.
  - role: Teacher
    utterance: Oh, I see. That would make the next month quite difficult.
  - role: Student
    utterance: Also, this type of advance requires approval from the head office in
      Tokyo. It will take a few days to get approval and process the payment.
  - role: Teacher
    utterance: I see.
  - role: Student
    utterance: Do you want me to make the request to the head office?
  - role: Teacher
    utterance: Yes please.
  - role: Student
    utterance: Okay. There is some paperwork you will need to submit. I’ll email it
      to you today. After you return it to me, I’ll submit the request to the head
      office. The advance will be deposited directly into your bank account within
      the next five business days.
  - role: Teacher
    utterance: I understand. Thank you very much for your help. I really appreciate
      it.
  - role: Student
    utterance: Oh, there is one more thing you need to understand. I am always reluctant
      to approve these types of requests. The reason for this is because this type
      of advance can only be granted once in an employee’s career. You cannot request
      it again. Are you okay with that?
  - role: Teacher
    utterance: I see. I understand. Yes, I am okay with that. But I don’t really have
      any other options. I appreciate your support.
  - role: Student
    utterance: You’re welcome.
