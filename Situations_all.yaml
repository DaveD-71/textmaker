  writing_task_model:
    subject: ''
    body: 'Title: Enjoy Japanese Summer Festivals

      Summer in Japan is a time for exciting festivals called matsuri. These events
      bring people together to celebrate with music, dancing, and food. If you visit
      Japan in summer, you can see these wonderful traditions.

      One famous festival is Gion Matsuri in Kyoto. It has big, colorful floats and
      a fun parade. Another exciting festival is Nebuta Matsuri in Aomori, where large
      lanterns light up the streets.

      At festivals, people wear yukata (light cotton kimono) and enjoy street food
      like takoyaki (octopus balls) and yakisoba (fried noodles). At night, hanabi
      (fireworks) fill the sky with beautiful colors.

      If you like dancing, you can join a bon odori festival. People of all ages dance
      in a circle to traditional music. It is a great way to have fun and meet new
      people.

      Japanese summer festivals are full of culture, music, and delicious food. Plan
      your visit and enjoy the celebrations!

      Taro Suzuki

      Japanese Consulate in Chicago'
