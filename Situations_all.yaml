  writing_task_model:
    subject: Instructions for Ordering Office Supplies
    body: 'Dear John,

      I hope you''re doing well. Since I''ll be moving to a new department next month,
      you''ll be taking over the task of ordering office supplies. I''d like to give
      you clear instructions on how to handle this responsibility:

      1. At the beginning of each month, check our inventory in the cabinet near the
      printer.

      2. Order enough paper to have 20 boxes of A4 and 15 boxes of A3 at the start
      of each month.

      3. Place your order online using our Office Goods Pty Ltd account. The login
      details are on the order form in the cabinet. Delivery usually takes about three
      days.

      Extra advice: Keep a few extra boxes as a backup to avoid shortages. If you
      ever have questions, Beth is also familiar with this procedure.

      I''m sure you''ll do great. Feel free to contact me if you have any questions.

      Best regards,

      Taro Suzuki'
