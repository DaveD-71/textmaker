- situation_id: E03
  cefr_target: B1
  purpose_objectives:
    en: 'Dealing with problems.

      Collaborate with local staff to request local vendors to respond to sudden,
      everyday problems that occur on a daily level.'
    ja: 'トラブルに対処する。

      突発的に発生した日常レベルの問題に対して、現地職員と協力し、現地業者への対応依頼をすることができる。'
  roleplays:
  - id: 1
    en: You were informed by residence staff that there is a stain on a wall in one
      of the buildings. It is possible that water is seeping from a pipe inside the
      wall. Ask the local staff in the Repair Division to contact a plumber. Ask him
      or her to make sure the plumber sends you an estimate first.
    ja: 大使公邸のスタッフから、壁にしみが出来ているとの報告がありました。壁内で漏水している可能性があります。営繕担当の現地スタッフに、配管工に連絡するよう依頼してください。また、まず見積書を入手するよう、依頼してください。
  - id: 2
    en: You work in the consulate London. You have booked a trip to Rome but you need
      to change the schedule. Ask the local staff to contact the travel agent to change
      the flight and hotel bookings. Ask them to find out if there will be any additional
      charges for the change.
    ja: あなたはロンドンの領事館に勤務しています。ローマへの旅行を予約していますが、スケジュールを変更する必要があります。現地スタッフに、飛行機とホテルの予約を変更するために旅行代理店に連絡するよう依頼してください。その際、変更に伴う追加料金が発生するかどうかも調べてもらってください。
  writing_task:
    description_en: 'Following Roleplay 1, you contacted the Repair Division about
      a potential water-seepage issue.

      Write an email to the local staff that:

      explains the issue with water seepage in the building,

      requests that a plumber be sent to investigate and fix the problem,

      asks the plumber to provide a repair estimate before beginning any work.

      Ensure your message is polite, clear, and professional.'
    description_ja: 'ロールプレイ1に基づき、建物内の水漏れの可能性について修理担当の現地職員に連絡する必要があります。

      以下を含むメールを作成してください：

      水漏れの詳細な状況説明、

      配管業者の派遣依頼、

      修理開始前に見積書を提出するよう依頼。

      文面は丁寧で、明確かつ専門的にしてください。'
  roleplay1_key_expressions:
  - category_en: Asking to speak to someone
    category_ja: 誰かと話すことを求める
    items:
    - May I speak to Mr. Ron James from the Repair Division?
  - category_en: Making a request for action
    category_ja: 行動を要請する
    items:
    - Can you call a plumber?
  - category_en: Giving directions
    category_ja: 案内する
    items:
    - Please get an estimate first?
  roleplay_model:
  - role: Student
    utterance: Hello. May I speak to Mr. Ron James from the Repair Division?
  - role: Teacher
    utterance: Hello, yes, this is Ron James.
  - role: Student
    utterance: Hello Mr. James. This is Taro Suzuki from the Maintenance Division.
      Residence staff told me there is a stain on a wall in one of the rooms. Perhaps,
      a water pipe is broken inside the wall. Can you call a plumber?
  - role: Teacher
    utterance: Okay. When would you like the plumber to come?
  - role: Student
    utterance: As soon as possible, please. Also, before you ask them to send someone,
      please get an estimate first? We need to check the cost.
  - role: Teacher
    utterance: Ok, I will do so and confirm with you first before I ask them to come.
  - role: Student
    utterance: That’s great. Thank you.
  - role: Teacher
    utterance: No problem.
  roleplay1_target_vocabulary:
