  - category_en: Outlining next steps
    category_ja: 次の手順を説明する
    items:
    - The next step will involve reviewing all candidate interviews.
  writing_task_model:
    subject: Administrative Position - Next Steps
    body: 'Dear Ms. Andrews,

      Thank you for taking the time to attend the interview for the administrative
      position at the Japanese consulate in New York. It was great meeting you and
      learning more about your experience and background.

      We were very impressed with your knowledge of Japan and your professional background.
      Your experience matches well with the skills we are looking for in this position.

      The next step will involve reviewing all candidate interviews. If you move forward,
      we will ask you to complete a personality profile and attend a second interview.

      We will contact you again within the next week to inform you of our decision.

      Thank you again for your interest in joining our team. If you have any questions
      in the meantime, please feel free to reach out to me.

      Best regards,

      Taro Suzuki

      Administration Manager

      Japanese Consulate in New York'
