  writing_task_model:
    subject: Change of Date for Dinner at the Japanese Embassy
    body: 'Dear Mr. Lee,

      I hope you are doing well. I am writing to let you know that the date for the
      dinner at the Japanese Embassy has changed.

      The event was planned for August 4th at 7:00 PM, but it will now be held on
      September 4th at the same time. The location and program will stay the same.

      I am sorry for this change and any trouble it may cause. We hope that you and
      your guest can still attend.

      Please let us know if you can join us. If you have any questions, feel free
      to ask.

      We look forward to seeing you at the event.

      Best regards,

      Misaki Takahashi

      Public Diplomacy Department

      Japanese Embassy'
