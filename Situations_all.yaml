- situation_id: G01
  cefr_target: A2
  purpose_objectives:
    en: 'Take a message on the phone.

      Take a call from someone asking to speak to your supervisor or colleague while
      they are away, explain the reason for their absence, confirm the caller''s affiliation,
      answer the caller''s questions, and leave a brief message.'
    ja: '電話で伝言を受ける。

      上司や同僚の不在中にかかってきた電話を受け、不在の理由を説明し、相手の所属等を確認の上、相手の質問に答え、簡単なメッセージを預かることができる。'
  roleplays:
  - id: 1
    en: You received a phone call for your boss. Your boss is on a business trip overseas
      and coming back to the office the day after tomorrow. Let the caller know and
      ask if he or she would like to leave a message.
    ja: あなたの上司宛に電話がかかってきました。上司は海外出張中で戻りは明後日になります。電話を掛けてきた相手にその旨を伝え、伝言を残すかどうか聞いてください。
  - id: 2
    en: You received a phone call for your boss. Your boss is out of the office for
      the afternoon and will return to the office tomorrow. Let the caller know and
      ask if he or she would like to leave a message.
    ja: あなたの上司宛に電話がかかってきました。上司は午後、外出をしており、オフィスに戻ってくるのは明日です。電話を掛けてきた相手にその旨を伝え、伝言を残すかどうか聞いてください。
  writing_task:
    description_en: 'Following the phone call in Roleplay 1, write an email to Mr.
      Addams about the message from Mr. Anderson.

      Your email should:

      state when you received the call,

      pass on any important information shared during the call,

      ensure clarity and accuracy in relaying the message.'
    description_ja: 'ロールプレイ1に基づき、アンダーソン氏からの電話について、アダムズ氏に報告するメールを作成してください。

      以下を含めてください：

      電話を受けた日時、

      電話の内容および重要事項の伝達、

      情報を正確かつ明確に伝えること。'
  roleplay1_key_expressions:
