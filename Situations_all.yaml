  roleplay_model:
  - role: Student
    utterance: Excuse me, Rosario?
  - role: Teacher
    utterance: Yes, Mr. Suzuki. What can I do for you?
  - role: Student
    utterance: I need your help with something. Next month, we are going to receive
      some visitors from Tokyo and we need to book their hotel rooms. Would you be
      able to help me with this?
  - role: Teacher
    utterance: Sure. Where will they stay?
  - role: Student
    utterance: Well, we have to decide. Where do you think is best?
  - role: Teacher
    utterance: What’s the budget?
  - role: Student
    utterance: Well, we have a budget of 300 dollars per night per person. There will
      be two visitors staying in separate rooms.
  - role: Teacher
    utterance: I see. So that’s a mid-range hotel. Do they need to be close to the
      consulate?
  - role: Student
    utterance: Yes, that would be preferred.
  - role: Teacher
    utterance: I see. Well, I can think of two options. There’s the Intercontinental
      and the Hilton. Both are reasonable in terms of the facilities and location.
  - role: Student
    utterance: Which one has better access to public transport? They will need to
      get around by themselves for some of the time.
  - role: Teacher
    utterance: Well, that’s probably the Hilton. It’s right near the subway and of
      course, there’s a long line of cabs just outside.
  - role: Student
    utterance: Okay then. Could you please book two rooms at the Hilton? I’ll send
      you an email with their names, dates, and flight details.
  - role: Teacher
    utterance: Sure. I’ll send you the confirmation from the hotel after I make the
      reservation.
  - role: Student
    utterance: Thank you.
  - role: Teacher
    utterance: No problem.
