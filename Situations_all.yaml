  writing_task_key_expressions:
  - category_en: Clearly providing reassurance and advice
    category_ja: 安心させ、具体的な助言を伝える
    items:
    - Please do not worry and please find another way to the hotel.
  - category_en: Clearly instructing about manners
    category_ja: 礼儀正しい行動を明確に指示する
    items:
    - When you get to the hotel, please apologize to Ms Sato.
  writing_task_model:
    subject: Heavy Traffic
    body: 'Hi John,

      Thanks for your call about the traffic. I called Ms Sato. I explained the heavy
      traffic situation. She can wait for you.

      Please do not worry and please find another way to the hotel. Apple Maps may
      have a faster way. If you cannot move, please call me again. I will call Ms.
      Sato to explain the situation.

      When you get to the hotel, please apologize to Ms Sato. Please help her with
      her luggage and bring her to the consulate.

      Let me know if I can help you.

      Best,

      Taro Suzuki'
