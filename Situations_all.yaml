- situation_id: D05
  cefr_target: B2
  purpose_objectives:
    en: 'Explaining procedures.

      Clearly and in detail explain to newcomers or successors the detailed procedures,
      tips for efficient handling, and points to watch out for in the workplace, and
      answer their questions to resolve their misunderstandings.'
    ja: '手順を説明する。

      職場で担当業務の細かい手順や手際よく処理するコツ、注意すべき点などについて、新しく入った人や後任者に明確に詳しく説明したり、相手の誤解を解決するように質問に答えたりすることができる。'
  roleplays:
  - id: 1
    en: Next month you will change departments. You will have a meeting with your
      colleague who will take on one of your duties. Explain the duty in detail and
      give clear instructions. At the end, give extra advice on how to do the job
      well.
    ja: 来月、あなたは部署を異動することになりました。あなたは、あなたの業務の一つを引き継ぐ同僚と打合せを行います。その業務について詳しく説明し、明確な指示を与えてください。打合せを終える前、その仕事をうまくこなすためのアドバイスを更に行ってください。
  - id: 2
    en: Next month, your colleague will change departments. You will have a meeting
      with him because you will take over one of his duties. He will explain the duty
      to you. You need to ask questions and clarify points throughout the discussion.
      Finally, reiterate what you need to do to confirm.
    ja: 来月、あなたの同僚が部署を異動することになりました。あなたは、その同僚の業務の一つを引き継ぐことになるので、その同僚と打合せを行います。その同僚はあなたにその業務を説明します。あなたは、打合せ中、質問や不明点を明確にする必要があります。打合せを終える前、確認のため、あなたがしなければならないことを繰り返し述べてください。
  writing_task:
    description_en: 'You are moving to a new department and need to explain one of
      your current duties to a colleague who will be taking it over.

      Write an email that:

      explains the duty in detail,

      provides clear instructions on how to perform it effectively,

      includes advice to help your colleague excel in this responsibility,

      is thorough, supportive, and encouraging.'
    description_ja: '部署異動に伴い、自分の業務の一部を引き継ぐ同僚に向けて、詳細な引き継ぎメールを送ります。

      以下を含めてください：

      業務内容の詳細な説明、

      効率的に業務を遂行するための明確な手順、

      より良く遂行するための助言やヒント、

      支援的かつ丁寧な口調を心がけてください。'
  roleplay1_key_expressions:
  - category_en: Explaining a procedure
    category_ja: 手順を説明する
    items:
    - Every month, usually at the beginning of the month, I first check the inventory
      and prepare an order based on what we have in stock.
  - category_en: Sharing helpful information
    category_ja: 役に立つ情報を共有する
    items:
    - Our paper supplies, and ink, are kept in the cabinet next to the printer.
  - category_en: Referring to another source
    category_ja: 別の情報源を参照する
    items:
    - Beth also knows how to do it, so you can check with her.
  roleplay_model:
  - role: Student
    utterance: Hello John. Are you ready for today?
  - role: Teacher
    utterance: Hi Taro. Sure. You’re going to explain the procedure for ordering paper,
      right?
  - role: Student
    utterance: That’s right. We deal with a provider of office supplies for all our
      office equipment needs. So, we need to ensure that we order through them, because
      we provide us with a discount.
  - role: Teacher
    utterance: Got it. Who’s the supplier?
  - role: Student
    utterance: It’s Office Goods Pty Ltd. I have their catalogue here, and I also
      have the business card of the person whom I deal with directly. His name is
      Andrew McCabe.
  - role: Teacher
    utterance: I see.
  - role: Student
    utterance: So, every month, usually at the beginning of the month, I first check
      the inventory and prepare an order based on what we have in stock.
  - role: Teacher
    utterance: Got it.
  - role: Student
    utterance: Our paper supplies, and ink, are kept in the cabinet next to the printer.
      That is also where I keep the order sheet. I have blank copies printed so I
      can keep a record of the orders, but all the actual ordering happens online.
  - role: Teacher
    utterance: I see.
  - role: Student
    utterance: We order enough boxes of A4 and A3 printer paper to last the month.
      We don’t experience that many changes month to month, so it’s pretty much the
      same order each time, but I like to keep some spare packs of paper just in case
      something comes up.
  - role: Teacher
    utterance: Okay.
  - role: Student
    utterance: We want to have 20 boxes of A4 and 15 boxes of A3 at the start of each
      month.
  - role: Teacher
    utterance: Got it. 20 A4, and 15 A3.
  - role: Student
    utterance: That’s right. Then, based on the number of boxes currently in stock,
      I place the order on the Office Goods website using our account. The account
      number is on the top of the order form, here, and the password is ‘officesupplies’,
      all one word, and all lower-case letters.
  - role: Teacher
    utterance: ‘officesupplies’. Got it.
  - role: Student
    utterance: After you submit the order, it usually arrives in about 3 days. That’s
      it.
  - role: Teacher
    utterance: It sounds pretty easy.
  - role: Student
    utterance: It is. I don’t think you’ll have a problem with it. But if you do,
      Beth also knows how to do it, so you can check with her.
  - role: Teacher
    utterance: Shall do. Thanks.
  - role: Student
    utterance: No problem.
