- situation_id: H07
  cefr_target: A2
  purpose_objectives:
    en: 'Obtaining goods and services.

      Can order a meal.'
    ja: '商品やサービスを入手する。

      食事の注文ができる。'
  roleplays:
  - id: 1
    en: You are visiting the consulate in Brisbane. It’s lunchtime and you are in
      a local Italian restaurant. Order your lunch, and a drink. Also, ask the waiter
      if you can pay by credit card and get a receipt.
    ja: あなたはブリスベンの領事館を訪れています。昼時、あなたは地元のイタリアンレストランにいます。ランチと飲み物を注文してください。また、ウェイターにクレジットカードで支払えるかどうか尋ね、領収書をもらってください。
  - id: 2
    en: You are visiting the Embassy in London. You are going to have breakfast in
      the hotel’s restaurant. Order your breakfast. Also, ask the waiter if you must
      pay at the table, or if the meal will be charged to the room.
    ja: あなたはロンドンの大使館を訪問しています。あなたはホテルのレストランで朝食をとる予定です。朝食を注文してください。また、テーブルで支払うのか、それとも食事代は部屋に請求されるのか、ウェイターに尋ねてください。
  writing_task:
    description_en: 'Based on Role Play 1, write an email reporting your lunch experience
      at an Italian restaurant in Brisbane to a colleague.

      Write an email that:

      describes what you ordered for food and drink,

      explains how you paid for the meal,

      mentions whether you received a receipt,

      is clear and simple.'
    description_ja: 'ロールプレイ1に基づき、ブリスベンのイタリアンレストランでのランチ体験を同僚に報告するメールを作成してください。

      以下を含めてください：

      注文した食事と飲み物、

      支払い方法、

      領収書を受け取れたかどうか、

      簡潔でわかりやすい表現を使用してください。'
  roleplay1_key_expressions:
  - category_en: Ordering food
    category_ja: 料理の注文
    items:
    - Can I have the spaghetti carbonara, please?
  - category_en: Confirming an order
    category_ja: ご注文の確認
    items:
    - Yes, that’s correct.
  - category_en: Inquiring about payment procedures
    category_ja: お支払い方法についてのお問い合わせ
    items:
    - Also, can I pay by credit card and get a receipt?
  roleplay_model:
  - role: Teacher
    utterance: Good afternoon, welcome to Trattoria Italiana. How can I assist you?
  - role: Student
    utterance: Hello. Can I Have the spaghetti carbonara, please.
  - role: Teacher
    utterance: Sure, would you like anything to drink with that?
  - role: Student
    utterance: Yes, I'll have a glass of sparkling water, please.
  - role: Teacher
    utterance: Alright, one spaghetti carbonara and a glass of sparkling water. Is
      that it?
  - role: Student
    utterance: Yes, that’s correct.
  - role: Teacher
    utterance: Is there anything else I can get for you?
  - role: Student
    utterance: No, that's all, thank you. Also, can I pay by credit card and get a
      receipt?
  - role: Teacher
    utterance: Yes, of course. We accept credit card payments, and I'll make sure
      to provide you with a receipt. Your total will be $15.50.
  - role: Student
    utterance: Great, thank you.
  - role: Teacher
    utterance: You're welcome. Your meal will be ready shortly.
  - role: Student
    utterance: Thank you.
  roleplay1_target_vocabulary:
