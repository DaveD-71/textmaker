  writing_task_model:
    subject: Confirming Reservation and Request for Prices
    body: 'Dear Maria san,

      I want to confirm our reservation for office space at your hotel. We need this
      for preparing a conference.

      We will need the following items from September 2 to September 20 (three weeks):

      - 8 tables

      - 24 chairs

      - 2 photocopiers

      - 4 printers

      - 8 telephones

      Could you please send a clear list of the rental cost for each item? Also, please
      confirm the dates for renting each item.

      If you think of other useful items, please add them to your list too.

      Thank you very much. Let me know if you have questions.

      Best regards,

      Taro Suzuki

      Japanese Consulate'
