      日本の文化イベントで、担当する大使館ブースの展示内容の紹介や注意事項など、明快に流暢にごく自然にアナウンスをし、来客との会話の中で、来客が喚起した興味ある事柄に対応し、臨機応変に応答することができる。'
  roleplays:
