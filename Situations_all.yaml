- situation_id: C03
  cefr_target: B2
  purpose_objectives:
    en: 'Making suggestions.

      In planning a Japanese cultural event, be able to express one''s own opinion
      on what kind of planning would be best, taking into account local needs, budgetary
      constraints, and feasibility. To be able to propose a plan for a better cultural
      event, taking i'
    ja: '提案する。

      日本の文化イベントを企画する際、現地のニーズ、予算の制約、実現可能性などを考慮し、どのような企画が良いのか自分の意見を述べることができる。現地スタッフの意見を取り入れながら、よりよい文化イベントの企画を提案することができる。'
  roleplays:
  - id: 1
    en: You work at the consulate in Sydney. You are attending a meeting to plan the
      next Japanese cultural event at the embassy. You want to suggest an event about
      Japanese crafts. A local staff member suggests Sports Day as Australian’s love
      of sport is renowned. Discuss and decide which type of event to choose, taking
      into account budget limitations, the feasibility of holding the event (season,
      cost, attendance by local citizens), and of course, the opinions of your counterpart.
    ja: あなたはシドニーにある領事館に勤務しています。あなたは大使館で行われる次の日本文化イベントを計画するための会議に出席しています。あなたは日本の工芸品に関するイベントを提案したいと思っています。現地スタッフは、オーストラリア人のスポーツ好きは有名なので、スポーツデイを提案しました。予算の制限、開催可能性（季節、費用、地元市民の参加）、そしてもちろん相手の意見も考慮して、どのようなイベントを実施するか話し合って決めましょう。
  - id: 2
    en: You work at the consulate in Toronto. You are attending a meeting to plan
      the next Japanese cultural event at the embassy. You want to suggest an event
      about Japanese festivals. A local staff member suggests Sports Day as Australian’s
      love of sport is renowned. Discuss and decide which type of event to choose,
      taking into account budget limitations, the feasibility of holding the event
      (season, cost, attendance by local citizens), and of course, the opinions of
      your counterpart.
    ja: あなたはトロントの領事館に勤務しています。あなたは大使館で行われる次の日本文化イベントを計画するための会議に出席しています。あなたは日本の祭りをテーマにしたイベントを提案したいと思っています。現地スタッフは、オーストラリア人のスポーツ好きは有名なので、スポーツデイを提案しました。予算の制限、開催可能性（シーズン、費用、地元市民の参加）、そしてもちろん相手の意見も考慮して、どのようなイベントを実施するか話し合って決めましょう。
  writing_task:
    description_en: 'Following the discussion in Roleplay 1, your boss has asked you
      to summarize the proposed Japanese cultural event at the embassy. The suggestion
      was to focus on Japanese crafts.

      Write an email to your boss that:

      summarizes the proposed event about Japanese crafts,

      explains why this theme was chosen, highlighting its feasibility, relevance
      to the local audience, and cost-effectiveness within the allocated budget,

      addresses any concerns raised during the discussion,

      reaffirms why this is the best option for the embassy.'
    description_ja: 'ロールプレイ1の会話を受けて、上司から次回の日本文化イベントの提案内容をまとめるよう依頼されました。提案されたテーマは「日本の工芸品」です。

      上司に宛てて、以下の内容を含むメールを書いてください：

      日本の工芸品イベントの概要、

      このテーマを選んだ理由（実現可能性、現地との関連性、予算内での実施可能性）、

      会議で出た懸念点への対応、

      なぜこのイベントが最良の選択であるかの再確認。'
  roleplay1_key_expressions:
  - category_en: Asking for ideas
    category_ja: アイデアを求める
    items:
    - What were you thinking?
  - category_en: Making a suggestion
    category_ja: 提案をする
    items:
    - Well, we haven’t done any Japanese crafts in a while, so I thought we could
      consider something like bonsai, or ikebana, or shuji.
  - category_en: Considering costs
    category_ja: 費用を考慮する
    items:
    - Well, I think bonsai can be quite expensive if we have to buy plants for each
      participant and the gardening tools. If we do shuji the traditional Japanese
      way, the sumi… the ink and the brushes can be expensive.
  roleplay_model:
  - role: Teacher
    utterance: Okay. So, thanks Taro for coming to this meeting.
  - role: Student
    utterance: No problem. I’ve been looking forward to it.
  - role: Teacher
    utterance: Great. So today we want to decide the theme for our next event.
  - role: Student
    utterance: What were you thinking?
  - role: Teacher
    utterance: Well, Sports Day is coming up on October 10, so I thought it would
      be good to do something about Japanese sports.
  - role: Student
    utterance: That’s an interesting idea. Although, I remember last year we held
      a judo exhibition. We didn’t get many visitors.
  - role: Teacher
    utterance: Hmmm. Okay. What do you think we should do?
  - role: Student
    utterance: Well, we haven’t done any Japanese crafts in a while, so I thought
      we could consider something like bonsai, or ikebana, or shuji, you know… oh
      what’s the work for it in English?
  - role: Teacher
    utterance: Calligraphy?
  - role: Student
    utterance: Yes, that’s it.
  - role: Teacher
    utterance: Well, you’ve raised some interesting ideas.
  - role: Student
    utterance: What’s the budget for the event?
  - role: Teacher
    utterance: For just an exhibition for one afternoon, I think we can allocate between
      500 and 700 dollars.
  - role: Student
    utterance: I see. If we want people to experience the craft, we will probably
      have to buy some supplies. That could get a little expensive.
  - role: Teacher
    utterance: I see what you mean. What would be the cheapest?
  - role: Student
    utterance: From the three ideas I suggested?
  - role: Teacher
    utterance: Yes. You spoke about bonsai, ikebana and shuji.
  - role: Student
    utterance: Well, I think bonsai can be quite expensive if we have to buy plants
      for each participant and the gardening tools. If we do shuji the traditional
      Japanese way, the sumi… the ink and the brushes can be expensive. Ikebana might
      be an option. Can we take flowers from the gardens around the embassy?
  - role: Teacher
    utterance: I don’t see why not. Let me run it past the grounds keeper and see,
      but I think it should be possible. I guess it will depend on the season and
      the flowers in bloom.
  - role: Student
    utterance: Well, if we can do that, that would definitely keep costs down. And
      I think it would be nice to have seasonal flowers. We’d just have to pay for
      a teacher to come and hold a class on afternoon.
  - role: Teacher
    utterance: That sounds very reasonable. Let me look into it and get back to you.
      But for now, let's plan an ikebana event.
  - role: Student
    utterance: Sure.
  - role: Teacher
    utterance: Thanks for your help Taro. You’ve given me some good ideas.
  - role: Student
    utterance: Any time.
