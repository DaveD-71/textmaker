  writing_task_key_expressions:
  - category_en: Asking for detailed product information
    category_ja: 商品の詳細情報を求める
    items:
    - What paper sizes and types do you have?
  - category_en: Proposing a discussion
    category_ja: 会議や話し合いを提案する
    items:
    - If possible, I would like to have a meeting to talk more about this.
  writing_task_model:
    subject: Questions About Paper Products
    body: 'Dear Mr. Sanders,

      I hope you are well.

      I am writing to ask for more details about your paper products. Thank you for
      the information you gave me on the phone today. I have some more questions:

      1. What paper sizes and types do you have?

      2. When do you deliver?

      3. What are the payment rules?

      4. What are your prices?

      5. Do you offer discounts for large orders?

      If possible, I would like to have a meeting to talk more about this. Please
      tell me when you are available.

      I look forward to your reply.

      Best regards,

      Taro Suzuki

      Administration Section

      Japanese Consulate'
