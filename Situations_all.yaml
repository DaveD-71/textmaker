- situation_id: F02
  cefr_target: B1
  purpose_objectives:
    en: 'Interviewing.

      While conducting a field survey, you can contact the other party and ask for
      the details of the specific information related to the survey.'
    ja: '面談する。

      現地調査に際して、相手先と連絡を取り、調査に係る具体的な情報の詳細を尋ねることができる。'
  roleplays:
  - id: 1
    en: You work in the Accounting Department at a diplomatic mission abroad. You
      have been asked to report the cost of child education costs to the Japan head
      office. You need to contact both international schools and local schools to
      check the education costs and the number of Japanese students at the schools.
    ja: あなたは在外公館で会計を担当しています。本省から子女教育費について報告するよう依頼されました。赴任先のインターナショナルスクールと現地校に連絡をとり、学校で教育を受けるために必要な費用、また日本人生徒の人数を確認してください。
  - id: 2
    en: You work at the Embassy in Canberra. You are participating in a field survey
      about the cost to the taxpayers for childcare (kindergartens, nurseries, day
      care) in Australia. Call the Australian Bureau of Statistics and ask them to
      provide you with the latest data, specifically the cost of childcare, broken
      down by state and territory.
    ja: あなたはキャンベラの大使館に勤務しています。あなたは、オーストラリアのチャイルドケア（幼稚園、保育園、託児所）の納税者負担額に関する現地調査に参加しています。オーストラリア統計局に電話し、最新のデータ、特に州・準州別に分類されたチャイルドケアの納税者負担額の提示を依頼してください。
  writing_task:
    description_en: 'Following Roleplay 1, you need to report on local school options
      to the Japan head office.

      Write an email to a local school that:

      inquiries about the cost of child education,

      requests detailed information on tuition fees and any additional expenses,

      asks about the number or percentage of Japanese students enrolled.

      Keep your tone polite, professional, and specific.'
    description_ja: 'ロールプレイ1に基づき、日本の本部に現地の学校事情について報告する必要があります。

      以下を含めて、現地の学校に問い合わせるメールを作成してください：

      子どもの教育にかかる費用についての質問、

      学費およびその他の関連費用に関する詳細な情報の依頼、

      日本人学生の在籍人数または割合についての確認。

      文体は丁寧かつ専門的で、質問内容を明確にしてください。'
  roleplay1_key_expressions:
  - category_en: Requesting to speak to someone
    category_ja: 誰かと話すことを要望する
    items:
    - May I speak to Ms. Malone, please?
  - category_en: Giving a reason for making contact
    category_ja: 連絡を取る理由を述べる
    items:
    - We are calling all the schools in the area to make a report of the educational
      costs for Japanese children last year.
  - category_en: Confirming an e-mail address
    category_ja: メールアドレスを確認する
    items:
    - Ok, please let me confirm. That’s h dot s-a-t-o-at-mofa-dot-m-b-dot-g-o-dot-jp.
  roleplay_model:
  - role: Teacher
    utterance: Hello, Myrtle High School.
  - role: Student
    utterance: Hello, this is Hikari Sato from the Accounting Department at the Consulate-General
      of Japan. May I speak to Ms. Malone, please?
  - role: Teacher
    utterance: Yes, speaking. How may I help you?
  - role: Student
    utterance: I am calling schools in the area to write a report on school costs
      for Japanese children last year.
  - role: Teacher
    utterance: Ok. Hold on for a minute while I search for the file (short pause)
      …okay, here we are.
  - role: Student
    utterance: How many Japanese students are there in your school?
  - role: Teacher
    utterance: We have fourteen students who are Japanese citizens.
  - role: Student
    utterance: Great, thank you. Can you send me a list of all their costs by e-mail?
      For example, school fees, travel costs, etc.
  - role: Teacher
    utterance: Sure, what is your email address?
  - role: Student
    utterance: It’s h.sato@mb.mofa.go.jp
  - role: Teacher
    utterance: Ok, please let me confirm. That’s h-dot-s-a-t-o-at-mofa-dot-go-dot-jp.
  - role: Student
    utterance: That’s right.
  - role: Teacher
    utterance: Thank you very much, I will email you shortly after talking with the
      principal. Is there anything else I can help you with?
  - role: Student
    utterance: No, you have been very helpful. Thank you. Goodbye.
  - role: Teacher
    utterance: You’re welcome. Goodbye.
