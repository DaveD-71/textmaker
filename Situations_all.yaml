  writing_task_model:
    subject: Feedback on Staff Interviews
    body: 'Dear Watanabe-san,

      I hope you are well. I am writing to share my thoughts on the interviews for
      the local staff position.

      Candidate 1: Mr. David Jones

      - He has experience in customer service and speaks well with others.

      - He is friendly and had a good attitude in the interview.

      - He does not have much office experience and may need training.

      - With support, he could improve and do well.

      Candidate 2: Ms. Suzuan Igorov

      - She has worked in office jobs and can manage tasks well.

      - She is organized and careful with details.

      - She was a little nervous and not very confident when speaking.

      - Even so, she has strong experience for this job.

      I think Ms. Igorov is the best choice. Her skills and past work fit the role
      well.

      Thank you for reading my feedback. Let me know if you need more details.

      Best regards,

