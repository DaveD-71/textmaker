  writing_task_model:
    subject: Phone Call from Mr. Anderson
    body: 'Dear Mr. Addams,

      I hope you are well.

      Mr. John Anderson from The Free Water Project called today. You were not in
      the office, so I told him you will be back tomorrow. He wants to talk with you
      soon about his proposal.

      He will send you an email. He asked you to check it soon. He did not leave any
      other message.

      Please let me know if I can help. I can send him a quick reply if you need more
      time.

      Best regards,

      Ryuta Sakamoto'
