    category_ja: 条件を明確にする
    items:
    - The maximum amount you can request is one-third of your next monthly salary.
  - category_en: Offering help or information
    category_ja: 支援やさらなる説明を申し出る
    items:
    - If you have further questions, feel free to contact me.
  writing_task_model:
    subject: Personal Loan Request - Summary
    body: 'Dear Paul san,

      Thank you for our discussion about your request for a salary advance. I’d like
      to summarize the key points clearly:

      - The embassy can approve an advance payment, but there are important conditions.

      - The maximum amount you can request is one-third of your next monthly salary.

      - This advance payment means your next salary payment will be reduced accordingly.

      - Such an advance can only be provided once during your employment.

      - Approval from our head office in Tokyo is required, which usually takes a
      few days.

      Please consider these conditions carefully. Let me know if you wish to proceed,
      and I''ll start the approval process immediately.

      If you have further questions, feel free to contact me.

      Best regards,

      Taro Suzuki

      Japanese Consulate in Sydney'
