- situation_id: E05
  cefr_target: B1
  purpose_objectives:
    en: 'Explaining cultural events.

      You can exchange supplementary explanations about the background, values, spiritual
      culture, etc. of the exhibition contents at the Japanese cultural event in response
      to questions from visitors.'
    ja: '文化イベントを説明する。

      日本文化イベントにおける展示内容について、来訪者からの質問を受けて背景や価値観・精神文化などについて補足説明のやりとりをすることができる。'
  roleplays:
  - id: 1
    en: You work in the consulate in Chicago. In an effort to increase tourism to
      Japan, you are participating in an expo to promote travel to Japan during summer.
      Your booth focuses on summer festivals across Japan. Answer questions about
      Japanese summer festivals.
    ja: あなたはシカゴの領事館に勤務しています。日本への観光客を増やすため、夏の日本旅行を促進する博覧会に参加することになりました。あなたのブースは日本各地の夏祭りに焦点をあてています。日本の夏祭りに関する質問に答えてください。
  - id: 2
    en: You work in the consulate Melbourne. You are participating in an exhibition
      on international foods as part of an effort to increase exports from Japan to
      Australia. Answer questions about Japanese foods and Japanese food culture.
    ja: あなたはメルボルンの領事館に勤務しています。あなたは、日本からオーストラリアへ輸出を増やす活動の一環として、国際的な食品に関する展示会に参加しています。日本食や日本の食文化についての質問に答えてください。
  writing_task:
    description_en: 'Following Roleplay 1, write a blog post introducing Japanese
      summer festivals.

      Include:

      their cultural meaning and appeal,

      types such as matsuri, fireworks, and bon odori,

      popular festivals held across Japan,

      vivid descriptions to help tourists imagine the experience.

      Use an engaging and informative tone.'
    description_ja: 'ロールプレイ1に基づき、日本の夏祭りを紹介するブログ投稿を書いてください。

      以下を含めてください：

      夏祭りの文化的意義や魅力、

      代表的な祭りの種類（例：祭り、花火大会、盆踊り）、

      日本各地で開催される人気の夏祭り、

      観光客に伝える魅力や臨場感のある描写。

      魅力的で情報豊富な文体で書いてください。'
  roleplay1_key_expressions:
  - category_en: Initiating conversation
    category_ja: 会話を始める
    items:
    - Are you interested in Japanese summer festivals?
  - category_en: Introducing a topic
