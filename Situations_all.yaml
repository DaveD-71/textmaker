- situation_id: E01
  cefr_target: B1
  purpose_objectives:
    en: 'Requesting goods and services.

      Able to make necessary arrangements with vendors and deal with problems in setting
      up a large conference administrative office.'
    ja: '商品やサービスを依頼する。

      大きな会議の事務局立ち上げにあたり、業者等への必要な手配を行い、問題への対処を行うことができる。'
  roleplays:
  - id: 1
    en: A big conference is going to be held soon. You need office space for preparation.
      Reserve a hotel room for this purpose and ask the staff to prepare 8 long tables,
      24 office chairs, 2 photocopiers, 4 printers, and 8 telephones. If there are
      other things you think you will need, ask the hotel staff to prepare them too.
      You need to rent these items for three weeks. Ask the staff to list each item
      in the estimate.
    ja: 大きな会議が間もなく開催されるため、ホテルの一室を借りて事務局を立ち上げます。部屋を予約し、長机8台、事務椅子24脚、コピー機2台、プリンター4台、電話8機、他必要な機材をホテルのスタッフに依頼してください。借りる期間は3週間です。見積書には、すべてのアイテムを記載するよう依頼してください。
  - id: 2
    en: You work at the Embassy in Canberra. A big conference is going to be held
      there from the start of July for two weeks. You need office space for preparation.
      For this purpose, you will reserve a hotel room near the conference. Call the
      hotel you have chosen and ask the staff to prepare the equipment you need. If
      there are other things you think you will need, ask the hotel staff to prepare
      them too. You need to rent these items for the duration of the conference. Ask
      the staff to list each item in the estimate.
    ja: あなたはキャンベラの大使館に勤務しています。来年の7月に大きな会議が2週間ほど開催されます。その準備のため、オフィススペースが必要です。会議場の近くにあるホテルの部屋を予約してください。ホテルに電話をして、必要な備品を用意してもらってください。その他、必要だと思われるものがあれば、それらも用意してもらってください。これらの備品は、会議期間中、レンタルする必要があります。すべてのアイテムを見積もりに記載するよう依頼してください。
  writing_task:
    description_en: 'Following Roleplay 1, you need to confirm a hotel room reservation
      for office space preparation ahead of an upcoming conference.

      Write an email to the hotel staff that:

      confirms the reservation,

      specifies the required items, including long tables, office chairs, photocopiers,
      printers, and telephones,

      requests a detailed estimate listing each item,

      confirms the rental duration,

      mentions any additional items you may need for the preparation.'
    description_ja: 'ロールプレイ1に基づき、会議の準備のためホテルの部屋をオフィススペースとして予約しました。その予約内容をホテルスタッフに確認するメールを作成してください。

      以下を含めてください：

      予約の確認、

      必要な備品（長机、オフィスチェア、コピー機、プリンター、電話）の明記、

      各備品の見積書の依頼、

      レンタル期間の確認、

      その他必要な物品があれば記載。'
  roleplay1_key_expressions:
  - category_en: Requesting goods or services
    category_ja: 物やサービスを依頼する
    items:
    - I’d like to book a meeting room at your hotel.
  - category_en: Exchanging detailed information
    category_ja: 詳細な情報を交換する
    items:
    - We need eight long tables and twenty-four office chairs. We also need two copy
      machines, four printers and eight phones.
  - category_en: Confirming an order
    category_ja: 依頼事項を確認する
    items:
    - Could you also send me an estimate with all the details?
  roleplay_model:
  - role: Teacher
    utterance: Good morning. Thank you for calling the Grand Hyatt Hotel, Melbourne.
      How may I help you?
  - role: Student
    utterance: Hello. My name is Taro Suzuki. I work in the General Affairs Department
      of the Embassy of Japan in Canberra. We will send some staff to a conference
      in Melbourne in September, and we need meeting space.
  - role: Teacher
    utterance: I see.
  - role: Student
    utterance: I’d like to book a meeting room at your hotel for twenty people, and
      also order some office machines and furniture.
  - role: Teacher
    utterance: Certainly, sir. What dates will you need the meeting room?
  - role: Student
    utterance: We will need it for three weeks from the beginning of September. The
      exact dates are Monday, September 2 to Friday, September 20.
  - role: Teacher
    utterance: I see. You also said you will need some office equipment and furniture.
      What would you like us to prepare for you?
  - role: Student
    utterance: We need eight long tables and twenty-four office chairs. We also need
      two copy machines, four printers and eight phones.
  - role: Teacher
    utterance: Okay, let me confirm all the details by email.
  - role: Student
    utterance: Sure. That would be fine. Could you also send me an estimate with all
      the details?
  - role: Teacher
    utterance: Certainly. Could I have your email address please?
  - role: Student
    utterance: It’s t.suzuki@cb.mofa.go.jp.
  - role: Teacher
    utterance: Okay. We will send you the estimate today.
  - role: Student
    utterance: Thank you. Goodbye.
  - role: Teacher
    utterance: Goodbye.
