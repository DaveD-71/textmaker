  roleplay_model:
  - role: Student
    utterance: Hello. Are you interested in Japanese summer festivals?
  - role: Teacher
    utterance: They look like fun. What’s it like in Japan in summer.
  - role: Student
    utterance: Well, summer is from early June until late August. It can get hot and
      very humid. It’s a great time to swim at the beach.
  - role: Teacher
    utterance: What are some famous summer activities?
  - role: Student
    utterance: Fireworks displays are common across Japan. But we have not had any
      for two years.
  - role: Teacher
    utterance: Why is that?
  - role: Student
    utterance: The coronavirus pandemic. We hope they will come back this year.
  - role: Teacher
    utterance: I see. So, what usually happens at a fireworks display?
  - role: Student
    utterance: Usually, many people go to a river or a lake. They can watch the fireworks
      there. And, it’s warm because it’s summer. So, many people wear traditional
      clothes called jinbei and yukata. They are light and cool.
  - role: Teacher
    utterance: Can you eat during a fireworks display?
  - role: Student
    utterance: Yes. There are many street stalls. They sell festival food. The event
      takes about an hour. After, many people eat dinner together.
  - role: Teacher
    utterance: It sounds fun.
  - role: Student
    utterance: It’s a popular summer event.
  - role: Teacher
    utterance: Thanks.
  - role: Student
    utterance: Thank you for your time.
