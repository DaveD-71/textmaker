- situation_id: D02
  cefr_target: B2
  purpose_objectives:
    en: 'Interviewing.

      Dealing with communications from the local police and other authorities regarding
      local incidental issues and hearing details of future actions.'
    ja: '面談する。

      現地での事件性の高い問題に関して、現地警察等からの連絡に対処し、今後の措置の詳細を聞くことができる。'
  roleplays:
  - id: 1
    en: You work in the consular office of a diplomatic mission abroad. The local
      police contacted you because they have arrested a Japanese national. Ask the
      police who they arrested, where and why he was arrested, and any required procedures.
      You will also need to arrange a meeting with the arrested Japanese national.
    ja: あなたは在外公館の領事事務所に勤務しています。現地警察から、日本人を逮捕したと連絡がありました。警察に、誰を逮捕したのか、どこで、なぜ逮捕したのか、必要な手続きは何かを尋ねてください。また、逮捕された日本人との面会も手配してください。
  - id: 2
    en: You work in the consular office of the Consulate General in Miami. The local
      police contacted you because they have arrested a Japanese national. He is in
      the country on a student visa, and has been arrested for petty theft from a
      convenience store. Ask the police about any necessary procedures and ask to
      have a meeting with him.
    ja: あなたはマイアミ総領事館の領事事務所に勤務しています。現地警察から、日本人を逮捕したと連絡がありました。その日本人は学生ビザで入国しており、コンビニエンスストアでの軽窃盗で逮捕されました。警察に必要な手続きを尋ね、面会を申し出てください。
  writing_task:
    description_en: 'Following Roleplay 1, write an email to Sergeant Ruina from the
      New York Police Department confirming the meeting regarding the arrest of Mr.
      Yusuke Kobayashi.

      Your email should:

      confirm the date, time, and location of the meeting as discussed during the
      phone call,

      inquire about any specific procedures or documents required,

      maintain a polite and professional tone.'
    description_ja: 'ロールプレイ1に基づき、明朝に予定されている小林祐介氏の逮捕に関する会議について、ニューヨーク市警のルイナ巡査と連絡を取る必要があります。

      以下を含むメールを作成してください：

      会議の日時、場所の確認（電話で話し合った内容に基づく）、

      会議に必要な手続きや書類についての問い合わせ、

      丁寧かつ専門的な表現を用いること。'
  roleplay1_key_expressions:
  - category_en: Requesting basic information
    category_ja: 基本的な情報を求める
    items:
    - May I ask for the name of the person arrested and the reason for the arrest?
  - category_en: Suggesting a schedule
    category_ja: スケジュールを提案する
    items:
    - Is tomorrow morning at 9 a.m. okay?
  - category_en: Repeating information to confirm
    category_ja: 確認のために情報を繰り返す
    items:
    - So just to confirm, that’s Mr. Yusuke Kobayashi and he was arrested for a DUI.
  roleplay_model:
  - role: Student
    utterance: Hello, Consulate General of Japan. This is Yuki Sakamoto speaking.
      How may I help you?
  - role: Teacher
    utterance: Hello, this is Sergeant Brian Ruina from the New York Police Department.
      I’m calling to let you know that we have arrested a Japanese national. He is
      now in our custody.
  - role: Student
    utterance: I see. May I ask the name of the person being detained and the reason
      for the arrest?
  - role: Teacher
    utterance: Yes, his name is Yusuke Kobayashi. He was charged with a DUI, which
      means he was driving under the influence of alcohol. He was visibly drunk when
      our police officer stopped him.
  - role: Student
    utterance: So just to confirm, that’s Mr. Yusuke Kobayashi, and he was arrested
      for a DUI. Where was the arrest made?
  - role: Teacher
    utterance: He was stopped by our police officer downtown on Broadway and Wall
      Street. We will need to keep him overnight.
  - role: Student
    utterance: I see. We would like to meet with Mr. Kobayashi. Could you inform me
      where he is being detained, and when we will be able to meet with him?
  - role: Teacher
    utterance: We’re located at 1 Police Plaza Path in Civic Centre, Manhattan. Is
      tomorrow morning at 9 a.m. okay?
  - role: Student
    utterance: Yes, that’s fine. We will send someone tomorrow.
  - role: Teacher
    utterance: Thank you. Goodbye.
  - role: Student
    utterance: Goodbye.
  roleplay1_target_vocabulary:
  - term: custody
    level: C2
  - term: influence
    level: B2
  - term: visibly
    level: C2
  writing_task_key_expressions:
  - category_en: Confirming agreed details
    category_ja: 取り決めた詳細を確認する
    items:
    - I am writing to confirm our meeting details as discussed.
  - category_en: Asking for details or instructions
    category_ja: 具体的な情報を求める
    items:
    - Could you please let me know if there are any specific procedures or documents
      we need to bring?
  writing_task_model:
    subject: Confirmation of Meeting - Mr. Yusuke Kobayashi
    body: 'Dear Sergeant Ruina,

      Thank you for speaking with me today regarding the arrest of Mr. Yusuke Kobayashi.
      I am writing to confirm our meeting details as discussed.

      Date: Thursday, June 18

      Time: 9:00 a.m.

      Location: New York Police Department, 1 Police Plaza Path, Civic Center, Manhattan

      Could you please let me know if there are any specific procedures or documents
      we need to bring for the meeting?

      Thank you very much for your assistance. I look forward to your reply.

      Best regards,

      Taro Suzuki

      Consulate General of Japan'
  writing_task_target_vocabulary:
  - term: custody
    level: C2
  - term: influence
    level: B2
  - term: visibly
    level: C2
- situation_id: D03
  cefr_target: B2
  purpose_objectives:
    en: 'Dealing with problems.

      When a passenger''s checked baggage is broken or lost by the driver of a rented
      car, for example, the passenger can explain in detail about the condition and
      current status of the baggage at the time of boarding, and discuss how to resolve
      the problem by c'
    ja: 'トラブルに対処する。

      乗客が借り上げ車のドライバーに預けた手荷物が壊れたり紛失したりしたときなど、乗車時の状態や現状について詳しく説明し、責任の所在を明らかにしたり、金銭的補償を要求したりして、問題解決のための話し合いをすることができる。'
  roleplays:
  - id: 1
    en: You are flying from Tokyo to New York. When you arrive at New York, one of
      your checked-in suitcases does not arrive. Go to the counter and explain that
      your suitcase has not arrived, describe the case and provide the luggage check-in
      slip to the staff. Answer any other necessary questions.
    ja: あなたは東京からニューヨークまで飛行機で移動しました。ニューヨークに到着したとき、預けたスーツケースのうちの1つが届いていませんでした。カウンターでスーツケースが届いていないことを説明し、どのようなケースか説明し、荷物預かり証を係員に渡してください。その他、必要な質問に答えてください。
  - id: 2
    en: You are flying from Tokyo to Sydney. When you arrive at Sydney, after waiting
      for your suitcase at the collection area, your suitcase has not arrived. Go
      to the counter and explain that your suitcase has not arrived, describe the
      case and provide the luggage check-in slip to the staff. Answer any other necessary
      questions.
    ja: あなたは東京からシドニーまで飛行機で移動しました。シドニーに到着し、受け取り場所でスーツケースを待っていたところ、スーツケースが届いていませんでした。カウンターでスーツケースが届いていないことを説明し、どのようなケースか説明し、荷物預かり証を係員に渡してください。その他、必要な質問に答えてください。
  writing_task:
    description_en: 'Following Roleplay 1, you are the passenger whose checked-in
      suitcase did not arrive at New York’s airport.

      Write a report to the airline staff that:

      explains the situation clearly,

      describes your suitcase in detail, including color, size, and distinctive features,

      provides the luggage check-in slip,

      expresses concern about the missing luggage and requests assistance in locating
      it,

      is ready to answer any further questions from the staff.'
    description_ja: 'ロールプレイ1に基づき、到着地の空港で預け入れたスーツケースが届かなかった件について航空会社に報告します。

      以下を含めた報告書を書いてください：

      状況の簡潔な説明、

      スーツケースの詳細（色、サイズ、特徴）、

      手荷物預かり証の提示、

      荷物が見つかるよう協力を要請すること、

      スタッフからの追加質問に対応する意思を伝えること。'
  roleplay1_key_expressions:
  - category_en: Stating a problem
    category_ja: 問題を述べる
    items:
    - It looks like one of my bags has not arrived.
  - category_en: Describing objects
    category_ja: 物を描写する
    items:
    - I had a larger bag and a smaller bag.
  - category_en: Requesting help
    category_ja: 助けを求める
    items:
    - Can you help me with that?
  roleplay_model:
  - role: Teacher
    utterance: Hello, sir. How may I help you.
  - role: Student
    utterance: Hi. I’ve been waiting at the baggage claim area and all the bags seem
      to have come off the plane. However, it looks like one of my bags has not arrived.
  - role: Teacher
    utterance: Okay. Was it checked luggage?
  - role: Student
    utterance: Yes. It was checked in at the counter in Narita airport before I boarded
      the plane.
  - role: Teacher
    utterance: Do you have the checked luggage tag?
  - role: Student
    utterance: Yes, I do. Here it is.
  - role: Teacher
    utterance: Thank you. Please wait a moment while I check.
  - role: Student
    utterance: Okay.
  - role: Teacher
    utterance: So, it says here you checked in two pieces of luggage yesterday at
      Narita Airport. Is that correct?
  - role: Student
    utterance: That’s right. As I said before, I checked it in before getting on the
      plane.
  - role: Teacher
    utterance: But only one bag is missing?
  - role: Student
    utterance: That’s right. I had a larger bag and a smaller bag. The smaller bag
      arrived, but the larger one didn’t for some reason.
  - role: Teacher
    utterance: I see. Please wait a moment while I make a phone call.
  - role: Student
    utterance: Okay.
  - role: Teacher
    utterance: Okay. So, it seems your other bag didn’t make it onto the flight. It
      is still at Narita Airport.
  - role: Student
    utterance: Why is that?
  - role: Teacher
    utterance: I’m sorry, sir. I wasn’t given a reason.
  - role: Student
    utterance: I see. So, what should I do? I need the contents of that bag. It has
      documents in it which are essential for an important meeting.
  - role: Teacher
    utterance: The bag will be put on the next flight. It will arrive the day after
      tomorrow as unclaimed luggage. We can send it to where you are staying after
      it passes customs.
  - role: Student
    utterance: I see. Well, that means it might arrive in time for my meeting. Good.
  - role: Teacher
    utterance: This is the unclaimed baggage form. Please write down your name, the
      address of your accommodation here in New York and a contact phone number. We
      will call you when your luggage arrives.
  - role: Student
    utterance: Okay, there is just one thing. The bag which did arrive does not have
      any toiletries and some clothing which I will need before the larger bag arrives.
      Can you help me with that?
  - role: Teacher
    utterance: Yes, we can. We can compensate you a total of 50 dollars.
  - role: Student
    utterance: I see. How do I claim that?
  - role: Teacher
    utterance: I will give you another form. Once you fill that out, we can provide
      the cash.
  - role: Student
    utterance: Okay, that would be great. Thank you.
  - role: Teacher
    utterance: No problem.
  roleplay1_target_vocabulary:
