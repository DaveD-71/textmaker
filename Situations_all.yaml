  roleplays:
  - id: 1
    en: You work in the consulate in Johannesburg. You have planned a trip to the
      consulate in Cape Town to attend an important meeting there this coming Friday.
      However, your counterpart in Cape Town has asked to delay the meeting due to
      other internal issues. Explain to your counterpart why you think the meeting
      should not be delayed. Make sure you point out the reasons why any delay would
      be problematic.
    ja: あなたはヨハネスブルグの領事館に勤務しています。あなたは今週金曜日ケープタウンの領事館で行われる重要な会議に出席するために出張を予定しています。しかし、ケープタウンのあなたのカウンターパートが、内部の他の問題に対応するために会議を延期したいと言ってきました。この会議を延期すべきではないとあなたが考える理由を、カウンターパートに説明してください。その際、延期が問題となる理由を必ず指摘してください。
  - id: 2
    en: You work in the consulate in Houston. You have asked the local staff to prepare
      a special report regarding recent changes in the local businesses in Houston.
      This was requested by MOFA as part of a larger report regarding the US economy.
      The report is due to be sent to Tokyo next week. The local staff have requested
      to extend the deadline by two weeks so they can check the information again.
      Reject the request. Make sure you point out the reasons why any delay would
      be problematic.
    ja: あなたはヒューストンの領事館に勤務しています。あなたは現地スタッフに、ヒューストンの地元企業の最近の変化に関する特別報告書を作成するよう依頼しました。これは外務省から米国経済に関するより大きな報告書の一部として要請されたものです。この報告書は来週東京に送付しなければなりません。現地スタッフが、情報を再度確認するために、期限を2週間延長してほしいと言ってきました。その要求を却下してください。その際、延長が問題となる理由を必ず指摘してください。
  writing_task:
    description_en: 'Following Roleplay 1, a colleague in Cape Town has proposed delaying
      an important meeting.

      Write an email that:

      expresses your concern about the proposed delay,

      explains why the meeting should proceed as planned,

      highlights the consequences of postponing and the urgency of the topics,

      maintains a diplomatic, respectful, and persuasive tone.'
    description_ja: 'ロールプレイ1に基づき、ケープタウンの同僚が重要な会議の延期を提案してきました。

      以下の内容を含めたメールを作成してください：

      会議の延期に対する懸念の表明、

      会議を予定通り実施すべき理由の説明、

      延期によって生じる問題や、会議で取り上げるべき課題の緊急性、

      丁寧で敬意を持ちつつも説得力のある文体を用いること。'
  roleplay1_key_expressions:
  - category_en: Introducing a topic
    category_ja: トピックを紹介する
    items:
    - Listen, I’m calling about the trip to Cape Town on Friday.
  - category_en: Stating a problem
    category_ja: 問題を述べる
    items:
    - Well, you have asked to delay the meeting.
  - category_en: Giving reasons
    category_ja: 理由を述べる
    items:
    - This meeting is important because we will decide much of the report content.
      Delaying the meeting will mean we have to rush the report to get it in on time.
  roleplay_model:
  - role: Teacher
    utterance: Hello. This is Adam Sanders speaking.
  - role: Student
    utterance: Hello Adam. It’s Taro here.
  - role: Teacher
    utterance: Oh, hi Taro. How’s things?
  - role: Student
    utterance: I’m good thanks. Listen, I’m calling about the trip to Cape Town on
      Friday.
  - role: Teacher
    utterance: Yes? What’s up?
  - role: Student
    utterance: Well, you have asked to delay the meeting.
  - role: Teacher
    utterance: Yes, that’s right. Is it a problem?
  - role: Student
    utterance: Actually, yes, I think it is.
  - role: Teacher
    utterance: Okay. Can you tell me why?
  - role: Student
    utterance: Sure. First of all, and most importantly, this meeting was scheduled
      a month ago. We have to prepare the quarterly report on the region and it has
      to be sent to Tokyo early next month. This meeting is important because we will
      decide much of the report content. Delaying the meeting will mean we have to
      rush the report to get it in on time.
  - role: Teacher
    utterance: I see. Yes, you’re right. I hadn’t considered that.
  - role: Student
    utterance: In addition to that, I have already booked my flight and hotel. If
      I cancel them at this late stage, I don’t think I will get all the money back.
  - role: Teacher
    utterance: I see. Okay, well let’s go ahead with the meeting as scheduled then.
      I will shift some appointments around here to make sure it can go ahead as planned.
  - role: Student
    utterance: Thank you. I appreciate that.
  - role: Teacher
    utterance: No problem. I’m looking forward to seeing you on Friday.
  - role: Student
    utterance: Me too. Have a good week.
  - role: Teacher
    utterance: You too Taro. Bye.
  - role: Student
    utterance: Goodbye Adam.
