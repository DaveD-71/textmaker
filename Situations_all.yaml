  writing_task_key_expressions:
  - category_en: Clearly recommending activities
    category_ja: 活動を明確に提案する
    items:
    - I often go to the beach to swim or take a walk.
  - category_en: Clearly conveying enjoyment
    category_ja: 楽しさを明確に表現する
    items:
    - I enjoy trying new dishes, especially Cuban food.
  writing_task_model:
    subject: Fun Things to Do in Miami
    body: 'Hi John,

      I hope you are doing well.

      It was great talking about your trip. Here are some fun things I like to do
      in Miami.

      I love doing outside activities. I often go to the beach to swim or take a walk.
      Miami also has many parks. I like to run or just relax.

      Sometimes, I visit the Miami Art Museum. I also tried a salsa dance class. It
      was fun. It was a great way to experience local culture.

      Miami has great food. I enjoy trying new dishes, especially Cuban food. There
      are also many nice cafes to check out.

      I hope this helps. Let me know if you want more ideas!

      Best,

      Taro Suzuki'
