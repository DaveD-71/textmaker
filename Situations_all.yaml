    category_ja: 良い体験を明確に伝える
    items:
    - The food was tasty, and I liked it very much.
  - category_en: Clearly recommending a venue
    category_ja: 場所を明確に推奨する
    items:
    - I think it is a good place for lunch. I hope you can go there soon.
  writing_task_model:
    subject: Lunch at the Italian restaurant
    body: 'Hi Bob,

      Today, I had lunch at the Italian restaurant near the consulate. I ordered spaghetti
      and sparkling water. The food was tasty, and I liked it very much.

      I paid by credit card. It was easy. After I paid, I asked the waiter for a receipt.
      He gave it to me right away.

      The staff at the restaurant were friendly. The restaurant was not busy. It was
      clean, and the chairs were comfortable. I think it is a good place for lunch.
      I hope you can go there soon.

      Please email me if you have any questions. Have a nice day!

      Best regards,

      Taro Suzuki'
