- situation_id: H09
  cefr_target: A2
  purpose_objectives:
    en: 'Obtaining goods and services.

      Can get simple information about travel, use public transport (e.g., buses,
      trains, taxis), ask and give directions, and buy tickets.'
    ja: '商品やサービスを入手する。

      旅行に関する簡単な情報を入手し、公共交通機関（バス、電車、タクシーなど）を利用し、道を尋ねたり教えたり、切符を買うことができる。'
  roleplays:
  - id: 1
    en: You work at the Japanese consulate in Los Angeles. A visitor calls to inquire
      about transportation options from the airport to their hotel in downtown LA.
      They need clear instructions on how to reach their destination using public
      transportation. Provide them with the necessary information. The visitor has
      come to Los Angeles for a meeting at the consulate.
    ja: あなたはロサンゼルスの日本領事館に勤務しています。訪問者から電話で、空港からロサンゼルスのダウンタウンにあるホテルまでの交通手段についての問い合わせがありました。公共交通機関を利用した目的地への行き方を明確に伝える必要があります。必要な情報を提供してください。その訪問者は領事館での打ち合わせのためにロサンゼルスを訪れています。
  - id: 2
    en: You work at the Japanese consulate in New York City. A guest visits the consulate
      seeking guidance on purchasing a MetroCard for traveling around the city during
      their stay. They are unsure about which type of MetroCard to buy and how to
      use it. Assist the tourist in understanding the options available and how to
      purchase and use a MetroCard. The guest will give a presentation at the consulate
      later in the week.
    ja: あなたはニューヨークの日本領事館に勤務しています。滞在中に市内を移動するためのメトロカードを購入したいと領事館を訪れた訪問者がいます。訪問者は、どのタイプのメトロカードを購入し、どのように使用すればよいのかわかりません。メトロカードの購入方法と使用方法を理解できるよう手助けしてください。この訪問者は後日、領事館でプレゼンテーションを行います。
  writing_task:
    description_en: 'Based on Role Play 1, write an email reply to a visitor requesting
      advice on purchasing tickets to Universal Studios.

      Write an email that:

      provides clear instructions on how to buy tickets,

      includes details such as ticket prices, opening hours, and location,

      is helpful, polite, and easy to follow.'
    description_ja: 'ロールプレイ1に基づき、ユニバーサル・スタジオのチケット購入についてアドバイスを求められた訪問者に、返信のメールを書いてください。

      以下を含めてください：

      チケットの購入方法の説明、

      チケット料金、営業時間、所在地の詳細、

      わかりやすく親切な文体で記述してください。'
  roleplay1_key_expressions:
  - category_en: Asking for information
    category_ja: 情報を求める
    items:
    - Can you help me with directions using public transportation?
  - category_en: Giving directions
    category_ja: 案内する
    items:
    - You'll need to take the FlyAway bus from Terminal 2 to Union Station.
  - category_en: Confirming understanding
    category_ja: 理解の確認
    items:
    - Does that help?
  roleplay_model:
  - role: Student
    utterance: Good morning, Japanese Consulate in Los Angeles. How can I assist you?
  - role: Teacher
    utterance: Hello. This is John Addams. I have a meeting at the consulate tomorrow.
      I just arrived at LAX airport and I need to get to my hotel in downtown LA.
      I’m sorry, but I don’t know LA very well, and I don’t know anyone in the city.
      Can you help me with directions using public transportation?
  - role: Student
    utterance: Of course. Which terminal are you currently at?
  - role: Teacher
    utterance: I'm at Terminal 2.
  - role: Student
    utterance: Great. You'll need to take the FlyAway bus from Terminal 2 to Union
      Station. The bus stop is located outside the terminal. The bus runs every 30
      minutes, and the fare is $9. From Union Station, you can take the Metro Red
      Line to Pershing Square station, which is closest to your hotel. The fare for
      the Metro is $1.75. Does that help?
  - role: Teacher
    utterance: Yes, thank you! That's very helpful.
  - role: Student
    utterance: You're welcome. Have a pleasant stay in Los Angeles!
  - role: Teacher
    utterance: Thank you, goodbye.
  roleplay1_target_vocabulary:
  - term: currently
    level: B2
  - term: direction
    level: A2
  - term: fare
    level: B1
  - term: helpful
    level: B1
  - term: just
    level: A2
  - term: locate
    level: B1
  - term: pleasant
    level: A2
  - term: public
    level: B1
  - term: square
    level: A2
  - term: stay in
    level: B1
  - term: terminal
    level: B2
  - term: union
    level: B1
  writing_task_key_expressions:
  - category_en: Clearly giving practical information
    category_ja: 実用的な情報を明確に提供する
    items:
    - You can buy tickets online for Universal Studios. A ticket costs about $100
      each.
  - category_en: Clearly offering help
    category_ja: 援助を申し出る
    items:
    - Do you need help buying tickets? Please email me. I am happy to help you.
  writing_task_model:
    subject: Tickets for Universal Studios
    body: 'Dear Mr. Addams,

      Thank you for your email.

      You can buy tickets online for Universal Studios. Go to their website. A ticket
      costs about $100 each. The park opens at 9:00 am and closes at 8:00 pm. Universal
      Studios is near downtown Los Angeles. You can take a taxi or the metro. It is
      easy to get there.

      Do you need help buying tickets? Please email me. I am happy to help you.

      Enjoy your visit and have a nice day.

      Best,

      Taro Suzuki

      Japanese Consulate, Los Angeles'
