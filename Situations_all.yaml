- situation_id: C07
  cefr_target: B2
  purpose_objectives:
    en: 'Interviewing.

      Can carry out an effective, fluent interview, departing spontaneously from prepared
      questions, following up and probing interesting replies.'
    ja: '面談する。

      効果的で円滑な面接を行うことができ、予め用意された質問からスムーズに会話を進め、フォローアップしながら興味深い回答を引き出すことができる。'
  roleplays:
  - id: 1
    en: You work at the consulate in New York. You are going to interview a candidate
      for an administrative position in the embassy. You want to know about her education
      and work history, her experience with Japan and Japanese people, and whether
      she would be a good match with the people in the office. Make sure you ask follow-up
      questions to responses to get more detailed information. During the interview,
      the candidate will provide additional information. Make sure to ask follow-up
      questions about that too.
    ja: あなたはニューヨークの領事館に勤務しています。あなたは大使館の事務職の候補者を面接する予定です。あなたは、候補者の学歴や職歴、日本や日本人との付き合い方、職場の人たちとうまくやっていけるかどうかなどを知りたいと考えています。より詳細な情報を得るために、候補者の回答に対してフォローアップの質問をするようにしましょう。面接では、候補者がさらに情報を提供します。それについてもフォローアップの質問をするようにしましょう。
  - id: 2
    en: You work at the consulate in London. You are going to interview a candidate
      for an administrative position in the embassy. You want to know about his education
      and work history, his experience with Japan and Japanese people, and whether
      he would be a good match with the people in the office. Make sure you ask follow-up
      questions to responses to get more detailed information. During the interview,
      the candidate will provide additional information. Make sure to ask follow-up
      questions about that too.
    ja: あなたはロンドンの領事館に勤務しています。あなたは大使館の事務職の候補者を面接する予定です。あなたは、候補者の学歴や職歴、日本や日本人との付き合い方、職場の人たちとうまくやっていけるかどうかなどを知りたいと考えています。より詳細な情報を得るために、候補者の回答に対してフォローアップの質問をするようにしましょう。面接では、候補者がさらに情報を提供します。それについてもフォローアップの質問をするようにしましょう。
  writing_task:
    description_en: 'Following the interview for the administrative position at the
      consulate in New York, you need to send a follow-up email to the candidate.

      Your email should:

      thank her for her time,

      express interest in her qualifications and suitability for the role,

      provide information about the next steps in the hiring process.

      Use professional and courteous language throughout.'
    description_ja: 'ニューヨーク領事館の事務職面接を受けた候補者にフォローアップのメールを送ってください。

      メールには以下を含めてください：

      面接に時間を割いてくれたことへの感謝、

      資格や適性に対する関心、

      今後の採用プロセスについての情報。

      丁寧かつ専門的な表現を使用してください。'
  roleplay1_key_expressions:
  - category_en: Explaining what has come before
    category_ja: これまでの経緯を説明する
    items:
    - We have already taken a look at your application and resume, and today we will
      conduct the initial interview.
  - category_en: Stating future actions based on conditions
    category_ja: 条件に基づいた将来の行動を述べる
    items:
    - Assuming you are successful, we will ask you to complete a personality profile,
      and following that, you’ll participate in a second interview with my boss.
  - category_en: Referring to other documents & sources
    category_ja: 他の資料&情報源を参照する
    items:
    - I see you have worked in admin for quite some time.
  roleplay_model:
  - role: Student
    utterance: Okay Ms Andrews. Please have a seat.
  - role: Teacher
    utterance: Thank you.
  - role: Student
    utterance: So, first, I’m going to explain our selection process. We have already
      taken a look at your application and resume, and today we will conduct the initial
      interview. Assuming you are successful, we will ask you to complete a personality
      profile, and following that, you’ll participate in a second interview with my
      boss. Is that okay?
  - role: Teacher
    utterance: Certainly.
  - role: Student
    utterance: Okay then, let’s begin. I see on your resume you have spent some time
      in Japan. Can you tell me about that?
  - role: Teacher
    utterance: Yes, I was in Japan for three years after I finished university. I
      went there initially for just a year, but fell in love with the country and
      stayed for three.
  - role: Student
    utterance: Wow, that’s quite a stay. Where did you spend most of your time?
  - role: Teacher
    utterance: I was in Osaka for the first year, and then moved up to Tokyo for the
      last two.
  - role: Student
    utterance: Oh, really? Why was that?
  - role: Teacher
    utterance: Well, my partner at the time got a job in Tokyo, and I was able to
      transfer there as well. It worked out for both of us.
  - role: Student
    utterance: I see. So which city did you prefer, and why?
  - role: Teacher
    utterance: Actually, while Tokyo is a lot bigger than Osaka and has many more
      places to go and things to see, to be honest, I preferred the people in Osaka.
  - role: Student
    utterance: It’s not an uncommon story. So, let’s talk about your experience in
      this type of job. I see you have worked in admin for quite some time. Why is
      that?
  - role: Teacher
    utterance: Well, I enjoy the type of work involved. I am quite organized, and
      thorough in my work. It’s just who I am, and I find that my kind of personality
      fits well with this kind of work.
  - role: Student
    utterance: I see. How would your previous boss describe your work?
  - role: Teacher
    utterance: Actually, I’ve included a written reference from him in my application.
      I think he wrote I am both committed to getting work done on time, and a loyal
      employee.
  - role: Student
    utterance: That is certainly positive praise. If there were one thing you would
      like to improve upon, what would it be?
  - role: Teacher
    utterance: Well, I can be a bit of a perfectionist at times, and I have high standards.
      I need to let that go a little sometimes because I have been close with my deadlines
      once or twice.
  - role: Student
    utterance: I see. Yes, sometimes we need to find the right balance.
