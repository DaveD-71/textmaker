    level: B1
  - term: side
    level: A2
  - term: stair
    level: A2
  - term: welcome
    level: A2
  writing_task_key_expressions:
  - category_en: Clearly giving contact details
    category_ja: 要求された情報を明確に提供する
    items:
    - Her name is Emily Thompson. If you have any questions, you can email her at
      e-thompson@mofa.go.jp.
  - category_en: Offering additional help
    category_ja: 更なる支援を申し出る
    items:
    - Let me know if you need any more information.
  writing_task_model:
    subject: Event Organizer Contact Info
    body: 'Dear John,

      Thank you for coming to the reception at the embassy in Boston. It was great
      to meet you, and I hope you had a good time.

      You asked about the person who organized the event. Her name is Emily Thompson.
      She planned the reception and made the guest list. If you have any questions,
      you can email her at e-thompson@mofa.go.jp.

      Let me know if you need any more information. I hope to see you again soon.

      Best,

      Taro Suzuki'
