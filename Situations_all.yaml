- situation_id: E07
  cefr_target: B1
  purpose_objectives:
    en: 'Reporting a decision.

      In the selection of government-sponsored international students, based on the
      opinions of each selection committee member, the opinions summarized by the
      person in charge of selection at the embassy can be conveyed.'
    ja: '決定事項を報告する。

      国費留学生の選考において、各選考委員の意見を踏まえ、大使館における選考担当としてとりまとめた意見を伝えることができる。'
  roleplays:
  - id: 1
    en: 'You work at the embassy in Canberra. Each year, the Japanese government sponsors
      one Australian to study in Japan to promote Japan-Australia exchange. A selection
      committee was held to choose this year’s student. There were three final candidates:
      Candidate 1 visited Japan briefly with family five years ago and studied Japanese
      in high school. Candidate 2 also studied Japanese in high school and has an
      aunt in Kumamoto married to a Japanese man. Candidate 3 has not studied Japanese
      formally, but her grandmother is Japanese, and she has family in Ishikawa. The
      committee selected Candidate 2.'
    ja: あなたはキャンベラの大使館に勤務しています。日本政府は毎年、日豪交流促進を目的に、オーストラリア人を1名、日本へ留学させる後援をしています。今年の留学生を選考する委員会が開かれました。最終候補者は3名。一番目の候補者は、日本に強い関心を持っており、5年前に家族で短期間日本を訪れ、また高校で日本語を勉強しました。二番目の候補者は、高校で日本語を学び、日本人と結婚している叔母が熊本に住んでいて、家族ぐるみの付き合いがあります。三番目の候補者は、日本語を正式に勉強したことはありませんが、祖母が日本人で、石川県に家族がいます。委員会では、二番目の候補者が選ばれました。
  - id: 2
    en: 'You work at the embassy in London. Each year, the Japanese government sponsors
      one UK citizen to study in Japan to promote Japan–UK relations. A committee
      was held to choose this year’s student. The final two candidates were: one who
      did a homestay in Japan four years ago during her last year of high school and
      studied Japanese at university, and another who has never been to Japan but
      passed JLPT Level 2 and is a fan of Japanese culture. The first candidate was
      selected.'
    ja: あなたはロンドンの大使館に勤務しています。日本政府は毎年、日英関係促進のため、英国人を1名、日本へ留学させる後援をしています。今年の留学生を選考する委員会が開かれました。最終候補者は2名。一番目の候補者は、4年前、高校3年生のときに日本にホームステイし、大学で日本語を勉強しました。二番目の候補者は、日本を訪れたことはありませんが、日本語能力試験で2級に合格し、日本のアニメや文化が大好きです。委員会では、一番目の候補者が選ばれました。
  writing_task:
    description_en: 'Following Roleplay 1, Candidate 2 has been selected for a sponsorship
      to study in Japan.

      Write an email that:

      congratulates them on their selection,

      provides details about the sponsorship program, including the study duration
      and financial support,

      outlines expectations during their time in Japan,

      expresses confidence in their ability to represent Australia and support Japan-Australia
      relations.

      Keep your tone positive, informative, and encouraging.'
    description_ja: 'ロールプレイ1に基づき、日本留学の奨学金に選ばれた候補者2へ、祝意を込めたメールを書いてください。

      メールには以下を含めてください：

      選出されたことへの祝辞、

      留学期間や経済的支援など奨学金の概要、

      日本滞在中に求められる期待や責任、

      オーストラリア代表としての活躍への期待の表明。

      前向きで励ましのある文体を心がけてください。'
  roleplay1_key_expressions:
  - category_en: Making a summary statement
    category_ja: 要点を述べる
    items:
    - All of them were promising.
  - category_en: Stating ability
    category_ja: 能力を述べる
    items:
    - It’s okay, but he needs more practice.
  - category_en: Expressing a decision
    category_ja: 決定事項を述べる
    items:
    - The committee decided we should offer him the position.
  roleplay_model:
  - role: Teacher
    utterance: Okay, Taro. Please share the result of the committee meeting.
  - role: Student
    utterance: Sure. After two selection rounds we ended up with three candidates.
      All of them were promising.
  - role: Teacher
    utterance: Please tell us about them.
  - role: Student
    utterance: Okay, the first was David Petersen. He has been to Japan before. He
      went on a trip with his family to Tokyo and Kyoto about five years ago. Because
      of that, he decided to study Japanese in high school.
  - role: Teacher
    utterance: How is his Japanese?
  - role: Student
    utterance: It’s okay, but he needs more practice.
  - role: Teacher
    utterance: I see. Who was the second candidate?
  - role: Student
    utterance: That was Andrew McDermott. He also has a connection to Japan. His aunt
      is married to a Japanese man and they live together in Kumamoto. Andrew also
      studied Japanese in high school. His communication ability is a little better
      than David’s.
  - role: Teacher
    utterance: I see. And the third candidate?
  - role: Student
    utterance: That was Sarah Coleman. She has not really formally studied Japanese
      but she can speak it. Her grandmother is Japanese and she has family in Ishikawa
      prefecture.
  - role: Teacher
    utterance: I see. So, what was the decision?
  - role: Student
    utterance: Well, actually all of the committee members agreed that Andrew McDermott
      would be in the best position to make the most of his time here due to his communication
      skills and the support he can get from his aunt. He also interviewed very well.
      So, the committee decided we should offer him the position.
  - role: Teacher
    utterance: Okay. Thanks for sharing the result.
  - role: Student
    utterance: No problem.
