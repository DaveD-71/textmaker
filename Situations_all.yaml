- situation_id: G03
  cefr_target: A2
  purpose_objectives:
    en: 'Dealing with problems.

      If a product or other item does not arrive as scheduled, you can check the status
      of the shipment and request that it be re-delivered.'
    ja: 'トラブルに対処する。

      予定どおりに商品などが到着しなかった場合に、運送状況の確認をしたり、その後の対処を依頼したりすることができる（再配達など) 。'
  roleplays:
  - id: 1
    en: You work in the consulate in London. You ordered food for a social event on
      Saturday (it’s now Wednesday). You expected the food to arrive yesterday. Call
      the vendor and inquire about the delivery schedule.
    ja: あなたはロンドンの領事館に勤務しています。あなたは土曜日の社交イベントのために食料品を注文しました。（今日は水曜日です。）昨日届く予定だった食料品がまだ届いていません。業者に電話し、配達スケジュールを問い合わせてください。
  - id: 2
    en: You work in the consulate in Rio de Janeiro. You ordered paper for your photocopier.
      You expected the paper to arrive yesterday. Call the vendor and inquire about
      the delivery schedule. Ask the vendor to deliver the paper asap.
    ja: あなたはリオデジャネイロの領事館に勤務しています。あなたはコピー用紙を注文しました。コピー用紙は昨日届く予定でしたが、届いていません。業者に電話し、配達スケジュールを問い合わせてください。業者に至急届けてくれるよう依頼してください。
  writing_task:
    description_en: 'Based on Role Play 1, write an announcement to be posted on the
      local bulletin board about the embassy''s exchange event being held this Saturday.

      Include the following:

      the name, date, time, and location of the event,

      the purpose and main attractions of the event,

      an invitation to community participation,

      use a friendly, easy-to-understand style appropriate for a public bulletin board.'
    description_ja: 'ロールプレイ1に基づき、今週土曜日に開催される大使館の交流イベントを地域の掲示板に告知するための案内文を作成してください。

      以下の内容を含めてください：

      イベント名、日時、場所、

      イベントの目的や主な見どころ、

      地域住民への参加呼びかけ、

      公共の掲示板にふさわしい、親しみやすくわかりやすい文体を使うこと。'
  roleplay1_key_expressions:
  - category_en: Introducing yourself on the phone
    category_ja: 電話での自己紹介
    items:
    - This is Taro Suzuki at the Japanese embassy.
  - category_en: Stating a problem
    category_ja: 問題を述べる
    items:
    - We thought the food would come yesterday. But it didn’t.
  roleplay_model:
  - role: Teacher
    utterance: Good afternoon. Jennings Catering. This is Chris Jennings.
  - role: Student
    utterance: Hello. This is Taro Suzuki at the Japanese embassy.
  - role: Teacher
    utterance: Hello Mr. Suzuki. What can I do for you?
  - role: Student
    utterance: We ordered food from your company two weeks ago. The food is for an
      event this Saturday.
  - role: Teacher
    utterance: Yes, that’s right. Is there a problem?
  - role: Student
    utterance: We thought the food would come yesterday. But it didn’t.
  - role: Teacher
    utterance: Really? That seems a little early. Let me check.
  - role: Student
    utterance: Okay.
  - role: Teacher
    utterance: I’m sorry. There seems to have been a misunderstanding. According to
      my schedule, the food will arrive tomorrow.
  - role: Student
    utterance: I see.
  - role: Teacher
    utterance: Is that okay?
  - role: Student
    utterance: Yes. I just wanted to check.
  - role: Teacher
    utterance: I see. Okay. We will get the food to you tomorrow before lunchtime.
  - role: Student
    utterance: Thank you.
  - role: Teacher
    utterance: No problem. See you tomorrow.
  - role: Student
    utterance: Goodbye.
  - role: Teacher
    utterance: Goodbye.
