      culture.
  writing_task_model:
    subject: Congratulations on Your Study Program
    body: 'Dear Mr. McDermott,

      I am happy to tell you that you have been chosen for the Japan-Australia Study
      Program this year. Congratulations! This is a great chance to study in Japan
      and experience life there.

      You will study in Japan for one year with support from the Japanese government.
      They will pay for your school fees, place to stay, and daily costs, so you can
      focus on your learning and new experiences.

      Your aunt in Kumamoto and your Japanese language skills will help you feel comfortable
      and settle quickly. We hope you will study hard, make new friends, and enjoy
      learning about Japan’s culture and way of life.

      We will send more details soon, including information about your travel and
      where you will stay. If you have any questions, please ask.

      Once again, congratulations! We hope you have a great experience in Japan.

      Best regards,

      Taro Suzuki

      Office Team

      Japanese Embassy in Canberra'
