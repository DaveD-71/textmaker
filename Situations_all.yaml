  - role: Student
    utterance: Okay. I will check our records... Okay. I see your application. Everything
      was done correctly.
  - role: Teacher
    utterance: That’s right. I submitted all the required documents.
  - role: Student
    utterance: Okay. Student visa applications take about four weeks. They can sometimes
      take longer. I’m sorry for the delay.
  - role: Teacher
    utterance: I expected the visa would have arrived by now. I am expected at my
      college in Tokyo in two weeks, and I have already booked my flight.
  - role: Student
    utterance: I see. I understand the situation. All the documents were sent to immigration
      in Tokyo. They make the final decision.
  - role: Teacher
    utterance: I see. Can you let me know when I will get it?
  - role: Student
    utterance: I do not have an exact date. But I do not see a reason for the delay.
      Please wait a few more days. It should arrive soon.
  - role: Teacher
    utterance: Okay. Goodbye.
  - role: Student
