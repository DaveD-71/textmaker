- situation_id: F01
  cefr_target: B1
  purpose_objectives:
    en: 'Requesting goods and services.

      When searching for a place to live, you can request a viewing, explain your
      decision after comparing several housing options.'
    ja: '商品やサービスを依頼する。

      住居探しにおいて内見の希望を伝え、複数の候補の条件等を確認した上で、検討結果を伝えることができる。'
  roleplays:
  - id: 1
    en: You are looking for an apartment. You found a place you are interested in
      on a real estate agent’s website. Contact the real estate agent and tell him
      or her that you would like to see the apartment. You want to see a couple of
      other apartments, too. Tell the agent what kind of apartment you are looking
      for and ask for his or her recommendations.
    ja: あなたはアパートを探しています。不動産業者のウェブサイトで気になる物件を見つけました。不動産業者に連絡し、その物件の内見を希望することを伝えてください。他にもいくつかの物件を見たいと思っています。どのような物件を希望するかを伝え、おすすめの物件を紹介してもらってください。
  - id: 2
    en: You are looking for an apartment. You go to a real estate agent in the area
      close to your work. Tell the agent what kind of apartment you are looking for
      and ask for his or her recommendations. After considering a few options, decide
      which ones you are interested in seeing.
    ja: あなたはアパートを探しています。職場近くの不動産屋に行って、どんな部屋を探しているのかを伝え、おすすめの物件を紹介してもらってください。いくつかの物件を検討した後、どの物件を見るか決めます。
  writing_task:
    description_en: 'Following Roleplay 1, you found a listing online and want to
      schedule a viewing.

      Write an email to the real estate agent that:

      expresses interest in viewing the specific apartment,

      requests a viewing appointment,

      describes the type of apartment you are looking for,

      asks for recommendations for other suitable properties.

      Keep your message polite, clear, and detailed.'
    description_ja: 'ロールプレイ1に基づき、オンラインで見つけたアパートの内覧を希望する内容で不動産業者に連絡する必要があります。

      以下を含むメールを書いてください：

      特定の物件に対する内覧希望の表明、

      内覧希望日時の提案、

      希望しているアパートの条件の説明、

      希望に合う他の物件の推薦依頼。

      丁寧でわかりやすい文章にしてください。'
  roleplay1_key_expressions:
  - category_en: Making requests
    category_ja: 依頼をする
    items:
    - I’d like to arrange an appointment to see the apartment.
  - category_en: Describing a place
    category_ja: 場所を説明する
    items:
    - I am looking for a one-bedroom apartment close to a train station. I want a
      place close to the city centre. I can spend around two thousand dollars a month.
  - category_en: Expressing a preference
    category_ja: 好みを伝える
    items:
    - Preferably (I would like to be) close to the city centre.
  roleplay_model:
  - role: Teacher
    utterance: Sydney Real Estate. Bob Jones speaking. How may I help you?
  - role: Student
    utterance: Hello. My name is Taro Suzuki. I recently moved to Sydney, and I am
      looking for an apartment. I saw your website and found a place I’m interested
      in. I want to arrange an appointment to see the apartment, and two or three
      others you can recommend.
  - role: Teacher
    utterance: Okay, Mr. Suzuki. First, can you tell me what kind of place you are
      looking for?
  - role: Student
    utterance: Sure. I am looking for a one-bedroom apartment close to a train station.
      I want a place close to the city centre. I can spend around two thousand dollars
      a month.
  - role: Teacher
    utterance: Okay. We have a few places that match your needs. Are you free this
      weekend to see them?
  - role: Student
    utterance: Yes, I am free Saturday afternoon.
  - role: Teacher
    utterance: Great. I’ll send you an email with links to the apartment information
      and the meeting information. Could I have your email address please?
  - role: Student
    utterance: Sure. It’s t.suzuki@mofa.go.jp.
  - role: Teacher
    utterance: Thank you. I’ll send you an email today. I look forward to seeing you
      on Saturday.
  - role: Student
    utterance: Thank you. Goodbye.
  - role: Teacher
    utterance: Goodbye.
  roleplay1_target_vocabulary:
  - term: arrange
    level: B1
  - term: estate
    level: B2
  - term: link
    level: B1
  - term: look forward to
    level: B1
  - term: recently
    level: B1
  - term: recommend
    level: B1
  writing_task_key_expressions:
  - category_en: Arranging a viewing
    category_ja: 見学の日時を依頼する
    items:
    - I would like to schedule an appointment at a convenient time.
  - category_en: Stating requirements clearly
    category_ja: 希望条件を明確に述べる
    items:
    - I am looking for a one-bedroom apartment close to a train station, preferably
      near the city center.
  writing_task_model:
    subject: Request to View Apartment
    body: 'Dear Mr. Jones,

      I hope you are well. I saw your listing for the apartment at 113 Oak Road on
      your website, and I am very interested in viewing it. I would like to schedule
      an appointment at a convenient time.

      I am looking for a one-bedroom apartment close to a train station, preferably
      near the city center. My budget is around two thousand dollars per month. I
      would also like a place with a kitchen and good natural light.

      If you have any other apartments that match my needs, please let me know. I
      would like to compare a few options before making a decision.

      Please let me know a suitable time for the viewing. Thank you for your help.

      Best regards,

      Taro Suzuki'
