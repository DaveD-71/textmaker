  writing_task_model:
    subject: Confirmation of Printer Return and Request for Replacement
    body: 'Dear James,

      Thank you very much for speaking with me earlier today about the problems we''ve
      had with the laser printer we bought from your company.

      We have experienced several issues with this printer. First, it often jams when
      we try to print addresses on envelopes, which has delayed important office tasks.
      Secondly, we''ve also noticed that the ink sometimes smudges, making documents
      difficult to read.

      We appreciate your understanding and your quick agreement to replace the printer.
      Could you please confirm the date when the new printer will arrive and when
      the faulty one will be collected?

      Thank you once again for your help and cooperation. Please let me know if you
      need any further details from our side.

      Best regards,

      Taro Suzuki'
