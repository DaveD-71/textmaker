- situation_id: G05
  cefr_target: A2
  purpose_objectives:
    en: 'Giving directions.

      With a driver, you can: direct the dispatch of a vehicle to a destination, discuss
      the route, receive multiple suggestions from the driver, ask questions about
      each route, and then decide and give instructions.'
    ja: '案内する。

      一人のドライバーと、目的地への配車を指示し、ルートの相談をし、ドライバーの複数の提案を受け、各ルートについて質問した上で、決定、指示することができる。（提案したり、出された提案に応じたり、指示を求めたり出したりしながら、次にすることを検討できる。）'
  roleplays:
  - id: 1
    en: You work in the consulate in Los Angeles. A guest from Japan arrived yesterday.
      Call a driver and ask him to pick up the guest from his hotel and bring him
      back to the consulate for a meeting. Answer any questions the driver may have
      about the route to the hotel and back to the consulate.
    ja: あなたはロサンゼルスの領事館に勤務しています。昨日、日本からお客様が到着しました。運転手に電話をして、そのゲストをホテルまで迎えに行き、会議のため領事館まで連れてくるよう依頼してください。運転手がホテルまでの道程と領事館までの帰路について質問してきたら答えてください。
  - id: 2
    en: You work in the embassy in Israel. A guest from Japan is staying in a nearby
      hotel. Call a driver and ask him to pick up the guest from her hotel and bring
      her back to the consulate for a meeting. Answer any questions the driver may
      have about the route to the hotel and back to the consulate.
    ja: あなたはイスラエルの大使館に勤務しています。日本からのお客様が近くのホテルに滞在しています。運転手に電話をして、ゲストをホテルまで迎えに行き、会議のために領事館に連れてくるよう依頼してください。運転手がホテルまでの道程と領事館までの帰路について質問してきたら答えてください。
  writing_task:
    description_en: 'Following Roleplay 1, you need to instruct the driver picking
      up a guest for a meeting.

      Write an email that:

      confirms the meeting time,

      provides directions from the hotel to the consulate,

      includes alternative routes in case of traffic or road closures,

      is brief, clear, and easy to follow.'
    description_ja: 'ロールプレイ1に基づき、ホテルのゲストを迎えに行くドライバーに送るメールを作成してください。

      以下を含めてください：

      ピックアップ時間の確認、

      ホテルから領事館までの道順、

      渋滞や通行止めの場合の代替ルート、

      明確で簡潔な指示を記述すること。'
  roleplay1_key_expressions:
  - category_en: Giving an order
    category_ja: 注文を出す
    items:
    - I need you to pick up a guest.
  - category_en: Asking for options
    category_ja: オプションを求める
    items:
    - What’s the fastest way?
  - category_en: Giving directions based on conditions
    category_ja: 状況に応じた指示を出す
    items:
    - If you have any problems, please call here.
  roleplay_model:
  - role: Teacher
    utterance: Hello. This is Joel.
  - role: Student
    utterance: Hello Joel. This is Taro Suzuki.
  - role: Teacher
    utterance: Hello Mr. Suzuki. How are you?
  - role: Student
    utterance: I’m good thanks. Joel. I need you to pick up a guest.
  - role: Teacher
    utterance: Okay. Can you give me the information?
  - role: Student
    utterance: Sure. His name is Taro Sato. He is staying at the Intercontinental.
      He’s in Room 405.
  - role: Teacher
    utterance: I see. Should I bring him back here?
  - role: Student
    utterance: Yes please. We have a meeting a 1pm.
  - role: Teacher
    utterance: I see. The time’s quite tight. The traffic on the roads today is quite
      heavy. There is construction on the main local road.
  - role: Student
    utterance: I see. What’s the fastest way?
  - role: Teacher
    utterance: Well, I can take the highway. We will have to pay the highway toll.
  - role: Student
    utterance: That’s fine. Please do so. Can you bring him here by 1pm?
  - role: Teacher
    utterance: Yes, if I can take the highway it should be fine.
  - role: Student
    utterance: Great. If you have any problems, please call here.
  - role: Teacher
    utterance: I’ll do that.
  - role: Student
    utterance: Thank you, Joel.
  - role: Teacher
    utterance: No problem.
