- situation_id: F10
  cefr_target: B1
  purpose_objectives:
    en: 'Making inquiries.

      Can obtain more detailed information.'
    ja: '問い合わせをする。

      より詳細な情報を得ることができる。'
  roleplays:
  - id: 1
    en: You are looking for a new supplier of paper products for your office. You
      have looked online at local suppliers. Contact one of them and ask some questions
      about their products, prices, and delivery schedules.
    ja: あなたは、オフィスで使用する紙製品の新しいサプライヤーを探しています。地元のサプライヤーをオンラインで探しました。そのうちの1社に連絡し、製品、価格、納期について質問してください。
  - id: 2
    en: You need to buy some office furniture. You have found a supplier online which
      has some interesting items at reasonable prices. Contact them and ask for more
      information about their products.
    ja: あなたは、オフィス家具を購入する必要があります。あなたは、リーズナブルな価格でいくつかの興味深いアイテムを持っているオンラインサプライヤーを見つけました。連絡をとって、彼らの製品について、より詳細な情報を入手してください。
  writing_task:
    description_en: 'Following Roleplay 1, you previously contacted a local supplier
      about paper products.

      Write a follow-up email that:

      requests more information about product specifications, pricing, and delivery
      schedules,

      expresses interest in a potential business relationship,

      inquires about arranging a meeting to discuss further,

      remains polite, professional, and specific.'
    description_ja: 'ロールプレイ1に基づき、紙製品の業者に初回問い合わせを行った後のフォローアップメールを作成してください。

      以下を含めてください：

      製品仕様、価格、納期に関する追加情報の依頼、

      業務提携への関心表明、

      打ち合わせの可能性についての問い合わせ、

      丁寧で具体的な表現を使用すること。'
  roleplay1_key_expressions:
  - category_en: Expressing wants
    category_ja: 要望を伝える
    items:
    - We are looking for a new paper supplier.
  - category_en: Asking for detailed information
    category_ja: 詳細な情報を求める
    items:
    - I want to know what your terms of payment are. / How about your delivery schedule?
      / Where do you get your paper from?
  - category_en: Stating a condition
    category_ja: 条件を述べる
    items:
    - If we can work with you, I will contact you again.
  roleplay_model:
  - role: Teacher
    utterance: Good afternoon. Thank you for calling Papers and Pens. How can I help
      you today?
  - role: Student
    utterance: Hello. This is Taro Suzuki. I work at the Embassy of Japan here in
      Toronto.
  - role: Teacher
    utterance: Hello Mr. Suzuki. What can I do for you today?
  - role: Student
    utterance: We are looking for a new paper supplier. I looked at your website yesterday
      and I have a few questions.
  - role: Teacher
    utterance: Certainly. What would you like to know?
  - role: Student
    utterance: Well, there are a couple of things. I have looked at your price list
      online, and your prices are competitive.
  - role: Teacher
    utterance: Thank you.
  - role: Student
    utterance: I want to know what your terms of payment are.
  - role: Teacher
    utterance: Sure. We ask our customers to pay the full invoice amount within 30
      days of delivery.
  - role: Student
    utterance: I see. That seems standard.
  - role: Teacher
    utterance: Yes, I think so too.
  - role: Student
    utterance: Okay. How about your delivery schedule? We have had some problems with
      our current supplier not delivering on time.
  - role: Teacher
    utterance: I see. We guarantee next-day delivery anywhere in Toronto if the order
      is placed by 11am. We have two factories, and a number of stores across the
      city, so it’s usually no problem.
  - role: Student
    utterance: I see. Well, that sounds very good.
  - role: Teacher
    utterance: Thank you.
  - role: Student
    utterance: Finally, where do you get your paper from?
  - role: Teacher
    utterance: Ninety percent of our product is locally produced.
  - role: Student
    utterance: That sounds perfect. Okay. Let me talk to my manager. We have a meeting
      today. I would like to recommend your company. If we can work with you, I will
      contact you again.
  - role: Teacher
    utterance: Thank you very much. If you would like some samples of our product,
      or if you would like one of our representatives to visit you to explain our
      products to you, we would be happy to send someone.
  - role: Student
    utterance: Thank you. I will call you again after the meeting.
  - role: Teacher
    utterance: Well good luck with your meeting.
  - role: Student
    utterance: Thank you. Have a nice day.
  - role: Teacher
    utterance: You too.
  - role: Student
    utterance: Goodbye.
  - role: Teacher
    utterance: Goodbye.
