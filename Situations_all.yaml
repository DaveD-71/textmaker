  writing_task_key_expressions:
  - category_en: Inviting guests clearly
    category_ja: 招待を明確に伝える
    items:
    - We invite you to a gathering at the Japanese Consulate in London on Saturday,
      June 5.
  - category_en: Asking clearly for responses
    category_ja: 出席の返事を明確に求める
    items:
    - Please let us know by Friday if you would like to come.
  writing_task_model:
    subject: ''
    body: 'Join Us This Saturday!

      Dear Neighbors,

      You are invited to a gathering at the Japanese Consulate in London on Saturday,
      June 5, at 6 p.m. This is a good chance to meet new people and have a fun evening
      together.

      There will be food, music, and games for everyone. You can try different dishes,
      listen to music, and take part in activities. It will be a fun and easy-going
      time for all guests.

      Please let us know by Friday if you would like to come. If you have any questions,
      you can ask us anytime.

      We look forward to seeing you!

      Best wishes,

      Japanese Consulate in London'
