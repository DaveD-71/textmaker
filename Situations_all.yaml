      leaders well into next year.
  roleplay_model:
  - role: Teacher
    utterance: Today, we are going to hear from Mr. Suzuki who has come from the Embassy
      of Japan to talk a little about Japan’s involvement with business in India.
      Thank you, Mr. Suzuki.
  - role: Student
    utterance: Hello, thank you for having me. I’m going to talk a little about the
      mission of the Embassy of Japan in New Delhi.
  - role: Teacher
    utterance: For our Ambassador, Mr. Suzuki, one of his main goals has been working
      closely with business leaders in India to help improve India-Japan relations.
      Most recently, this has been seen in activities such as his involvement with
      the introduction of the Intelligent Transportation System and the CII partnership
      summit, both in the last few months.
  - role: Teacher
    utterance: I know he plans on continuing to develop this close relationship with
      industry leaders well into next year.
  - role: Teacher
    utterance: Mr. Suzuki, thank you for letting us know Mr. Suzuki’s priorities.
      What do you know of Japan’s investment in India?
  - role: Student
    utterance: Well, last year Japan invested over 9 billion US dollars in Indian
      start-ups. That’s a huge amount. India has been a priority for investment the
      last five years, and I see that continuing next year as well.
  - role: Teacher
    utterance: That’s good news. Thank you, Mr. Suzuki.
  - role: Student
    utterance: You’re welcome. Thank you.
