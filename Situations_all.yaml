- situation_id: E02
  cefr_target: B1
  purpose_objectives:
    en: 'Dealing with problems.

      In the event of equipment failure, communicate the status of the problem and
      negotiate solutions to the various problems involved in repairing the equipment.'
    ja: 'トラブルに対処する。

      機材の不具合に際して、トラブルの状況を伝え、修理にかかる様々な問題解決の交渉を行うことができる。'
  roleplays:
  - id: 1
    en: A photocopier in the office jams very often. In addition, there are unnecessary
      lines when copying. Contact the support centre and ask them to send a repairman.
      Ask for an estimated cost to repair the machine, and how long it will take to
      repair. If the repair will take some time, ask if you can use an alternative
      photocopier for free.
    ja: 最近、コピー機がよく詰まります。またコピーした紙に線が入ってしまいます。サポート・センターにコピー機の点検を依頼してください。修理が必要な場合は、見積りを入手してください。また、修理にかかる時間と、代替機を無償で提供してもらえるか確認してください。
  - id: 2
    en: You are working at the Embassy in Fiji. There have often been problems with
      your internet service recently. During important online meetings, the internet
      has occasionally dropped out and you have had to re-join the meetings each time,
      sometimes missing out on important information. Call your internet service provider,
      explain the problem, and ask them to come to the Embassy to check the line and
      the routers.
    ja: あなたはフィジーの大使館に勤務しています。最近、インターネットサービスにしばしば問題が発生しています。重要なオンライン会議の最中にインターネットが使えなくなることがあり、そのたびに会議に参加し直さなければならず、重要な情報を見逃してしまうことがあります。インターネットサービスプロバイダに電話をして、問題を説明し、大使館に来て回線とルーターをチェックしてもらうよう依頼してください。
  writing_task:
    description_en: 'Following Roleplay 1, you contacted the support center about
      a faulty office photocopier.

      Write an email that:

      explains the issues (frequent paper jams and unnecessary lines when copying),

      requests a repair technician,

      asks for an estimated cost and time required for the repair,

      inquires about the availability of a temporary replacement if needed.

      Your message should be clear, concise, and polite.'
    description_ja: 'ロールプレイ1に基づき、事務所のコピー機の不具合についてサポートセンターに連絡しました。

      以下を含むメールを作成してください：

      コピー機の問題点（頻繁な紙詰まり、不明な線の出現）の説明、

      修理技師の派遣依頼、

      修理にかかる見積もりと所要時間の確認、

      修理に時間がかかる場合の代替機の利用可否についての問い合わせ。

      簡潔かつ丁寧な文体で書いてください。'
  roleplay1_key_expressions:
  - category_en: Stating a problem
    category_ja: 問題を述べる
    items:
    - The photocopier in our office is broken.
  - category_en: Requesting a service
    category_ja: サービスを依頼する
    items:
    - Can you send someone to fix it?
  - category_en: Enquiring about the cost
    category_ja: 費用について問い合わせる
    items:
    - How much will it cost?
  roleplay_model:
  - role: Teacher
    utterance: Hello, Ricoh Support Centre. This is Miriam. How may I help you?
  - role: Student
    utterance: Hello. My name is Ryo Sato. I work for the Consulate General of Japan.
      The photocopier in our office is broken. It’s printing extra lines every time
      I make a copy. Can you send someone to fix it?
  - role: Teacher
    utterance: Yes, certainly. May I know your service contract number, make and model
      number of the photocopier?
  - role: Student
    utterance: Yes, it is the RICOH MP C6503 and the contract number is AB431D.
  - role: Teacher
    utterance: Okay, Mr. Sato. We will send someone over tomorrow morning to do an
      inspection. If the photocopier needs to be repaired, it may take a week.
  - role: Student
    utterance: I see. How much will it cost?
  - role: Teacher
    utterance: The inspection fee is fifty dollars. If the copier needs to be repaired,
      the costs are covered by your service contract.
  - role: Student
    utterance: Thank you. Can we get a replacement for now? We need a photocopier
      at all times.
  - role: Teacher
    utterance: Certainly, we will provide a replacement if necessary, after the inspection.
  - role: Student
    utterance: Thank you.
