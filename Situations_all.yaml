    level: B2
  writing_task_key_expressions:
  - category_en: Alerting about a possible issue
    category_ja: 潜在的な問題を報告する
    items:
    - The residence staff thinks it might be caused by a water leak.
  - category_en: Asking clearly for costs and timelines
    category_ja: 費用や日程を明確に求める
    items:
    - Before any repairs begin, ask them to send a price estimate.
  writing_task_model:
    subject: Plumber Request for Water Leak
    body: 'Dear Repair Team,

      There is a stain on the wall in one of the buildings. The residence staff thinks
      it might be caused by a water leak from a pipe inside the wall. If this is true,
      it could cause more damage.

      Please ask a plumber to check the problem soon. Before any repairs begin, ask
      them to send a price estimate. Also, let me know how long the repairs will take.

      It is important to fix this quickly to prevent further problems. Please confirm
      when the plumber can visit.

      Thank you for your help. Let me know if you need more information.

      Best regards,

      Taro Suzuki'
