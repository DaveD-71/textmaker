    level: B2
  - term: send out
    level: C2
  writing_task_key_expressions:
  - category_en: Advising steps clearly
    category_ja: 問題解決の手順を伝える
    items:
    - Please speak to the restaurant manager about this.
  - category_en: Clearly stating expectations
    category_ja: 期待を明確に伝える
    items:
    - If the new restaurant costs more, please tell them we expect them to cover any
      extra costs.
  writing_task_model:
    subject: Double Booking Issue - Instructions
    body: 'Dear John,

      Thank you for letting me know about the double booking issue at the restaurant
      for our dinner party in three weeks.

      Since we have already sent out invitations and arranged the dignitary''s schedule
      around this event, it is very important that we keep the original date. However,
      we are willing to hold the dinner an hour or two earlier if needed.

      Please speak to the restaurant manager about this. If changing the time is not
      possible, ask if they can find another restaurant for us that is similar in
      quality and price. If the new restaurant costs more, please tell them we expect
      them to cover any extra costs.

      Thanks again for your help. Please let me know what the restaurant says.

      Best regards,

      Taro Suzuki'
