  writing_task_model:
    subject: Request for New Flight Arrangement
    body: 'Dear Airline Customer Service,

      I am writing about my flight from Brisbane to Sydney (Flight QA62) today, March
      15, 2024, at 7:00 PM. Unfortunately, it was canceled.

      I have an important meeting in Sydney tomorrow morning. Your staff said the
      next economy flight available is tomorrow morning, but this would make me late
      for my meeting. They also said there is a business class seat on tonight''s
      flight at 8:00 PM.

      Could you please let me take the business class seat tonight at a reduced price
      because of this inconvenience?

      Thank you very much for your help. Please let me know your decision soon.

      Best regards,

      Taro Suzuki

      Consulate of Japan, Brisbane'
