- situation_id: G06
  cefr_target: A2
  purpose_objectives:
    en: 'Showing appreciation.

      Can establish social contact (e.g., greetings and farewells, introductions,
      giving thanks).'
    ja: '感謝の気持ちを伝える。

      社会的関係を構築する（挨拶や別れ、自己紹介、感謝を伝えるなど）。'
  roleplays:
  - id: 1
    en: You will meet with a local catering company about catering an embassy event.
      It is your first time to meet. Before the meeting starts, greet your counterparts,
      introduce yourself and thank them for attending the meeting.
    ja: 大使館のイベントのケータリングについて、地元のケータリング会社と初めて打ち合わせをします。打合せが始まる前に、相手に挨拶と自己紹介をし、打合せに参加してくれたことに感謝していることを伝えてください。
  - id: 2
    en: You attended an international conference in Hong Kong. The conference has
      ended. Today you participated in a Working Group meeting. Say goodbye to the
      members of the Working Group and thank them for their support. Tell them you
      want to stay in touch.
    ja: あなたは香港で開催された国際会議に出席しました。会議は終了し、今日あなたは、ワーキンググループのミーティングに参加しました。ワーキンググループのメンバーにお別れの挨拶をし、お世話になり感謝していることを伝えましょう。これからも連絡を取り合いたいと伝えてください。
  writing_task:
    description_en: 'Following Roleplay 1, you met with a catering company about an
      upcoming embassy event.

      Write an email that:

      thanks them for the meeting and their time,

      summarizes the key points discussed and decisions made,

      outlines any agreed-upon next steps or required follow-up actions,

      is polite, clear, and professional.'
    description_ja: 'ロールプレイ1に基づき、大使館イベントのケータリングについてケータリング会社と打ち合わせを行いました。

      以下の内容を含めたフォローアップメールを作成してください：

      会議に参加してくれたことと、時間を割いてくれたことへの感謝、

      会議中に話し合われた主なポイントと決定事項の要約、

      合意された次のステップや必要なフォローアップ事項の説明、

      丁寧で明確、かつプロフェッショナルな文体で書くこと。'
  roleplay1_key_expressions:
  - category_en: Confirming someone’s identity
    category_ja: 身元を確認する
    items:
    - Hello, Mr. Andrews?
  - category_en: Showing appreciation
    category_ja: 感謝の意を示す
    items:
    - Thank you for coming to the embassy today.
  - category_en: Confirming information
    category_ja: 情報の確認
    items:
    - Your office is on the other side of town, right?
  roleplay_model:
  - role: Student
    utterance: Hello, Mr. Andrews?
  - role: Teacher
    utterance: Yes, I am John Andrews.
  - role: Student
    utterance: Hello Mr. Andrews. I’m Taro Suzuki. Thank you for coming to the embassy
      today.
  - role: Teacher
    utterance: It’s not a problem. I’m happy to be here.
  - role: Student
    utterance: Your office is on the other side of town, right?
  - role: Teacher
    utterance: Yes, that’s right.
  - role: Student
    utterance: How was the traffic?
  - role: Teacher
    utterance: A little busy, but not too bad.
  - role: Student
    utterance: Okay, let’s go to the meeting room.
  - role: Teacher
    utterance: Sure.
  - role: Student
    utterance: Please follow me.
  roleplay1_target_vocabulary:
  - term: busy
    level: A2
  - term: come to
    level: B2
  - term: follow
    level: A2
  - term: office
    level: A2
  writing_task_key_expressions:
  - category_en: Clearly thanking someone
    category_ja: 感謝を明確に伝える
    items:
    - Thank you for our meeting about the embassy party. Your ideas were very helpful.
  - category_en: Clearly stating event arrangements
    category_ja: イベントの詳細を明確に伝える
    items:
    - The party is on Thursday, March 3, at 1:00 p.m. at the embassy.
  writing_task_model:
    subject: Thank You for Your Help
    body: 'Dear Mr. Andrews,

      Thank you for our meeting about the embassy party. Your ideas were very helpful.

      We planned the menu and chose some dishes. We will have canapés and bruschetta
      for appetizers. The main course will be chicken, fish, or a vegetarian dish.
      We will have small cakes for dessert.

      The party is on Thursday, March 3, at 1:00 p.m. at the embassy. We also discussed
      the delivery time and setup. You will send the food three days before the party.
      I will send another message soon with the final details.

      Please let me know if you have any questions.

      Best,

      Taro Suzuki'
  writing_task_target_vocabulary:
  - term: busy
    level: A2
  - term: come to
    level: B2
  - term: follow
    level: A2
  - term: office
    level: A2
- situation_id: G07
  cefr_target: A2
  purpose_objectives:
    en: 'Giving directions.

      Can discuss what to do next, making and responding to suggestions, and asking
      for and giving directions.'
    ja: '案内する。

      次に何をすべきかを話し合い、提案したり、提案に応えたり、指示を求めたり与えたりすることができる。'
  roleplays:
  - id: 1
    en: You work in the consulate in Calgary. You asked a driver to pick up a visitor
      from her hotel, but the driver is now stuck in traffic and will be late. He
      is calling you to ask for advice. Discuss the options with the driver and tell
      him what he must do.
    ja: あなたはカルガリーの領事館に勤務しています。あなたは運転手に訪問者をホテルへ迎えにいくよう依頼しましたが、運転手は現在、渋滞に巻き込まれ、到着が遅れそうです。運転手はあなたに電話をかけてきて助言を求めました。運転手と選択肢について話し合い、運転手が何をすべきかを伝えてください。
  - id: 2
    en: You work in the consulate in Singapore. You are arranging an end of year party
      for the staff in your office. You will have a short discussion with another
      local staff member about where to go, and what to do. After discussing options,
      tell the local staff member to make the arrangements.
    ja: あなたはシンガポールの領事館に勤務しています。あなたは職場のスタッフのために忘年会の手配をしています。あなたは別の現地スタッフと、どこに行って何をするかについて短い話し合いを行います。選択肢について話し合った後、現地スタッフに手配をするよう伝えてください。
  writing_task:
    description_en: 'Following Roleplay 1, a driver has contacted you about being
      stuck in traffic while picking up a visitor.

      Write a response (email or message) that:

      acknowledges the situation,

      gives clear advice on how to proceed,

      includes next steps (e.g., notify the visitor, take an alternate route, or contact
      the office),

      is concise, clear, and helpful.'
    description_ja: 'ロールプレイ1に基づき、ホテルへゲストを迎えに向かっている途中で渋滞に巻き込まれたドライバーに返信します。

      以下を含む返信（メールまたはテキストメッセージ）を書いてください：

      状況の確認と理解の表明、

      今後取るべき行動に関する指示（訪問者への連絡、代替ルートなど）、

      簡潔で分かりやすく、親切な表現を用いること。'
  roleplay1_key_expressions:
  - category_en: Asking about current location
    category_ja: 現在地について尋ねる
    items:
    - Where are you now?
  - category_en: Asking about future events
    category_ja: 将来の出来事について尋ねる
    items:
    - When will you get to the hotel?
  - category_en: Giving directions based on events
    category_ja: 出来事に基づいた道順を教える
    items:
    - Please call me again when you arrive at the hotel.
  roleplay_model:
  - role: Teacher
    utterance: Hello Tomo. This is Andre.
  - role: Student
    utterance: Hello Andre. How are you?
  - role: Teacher
    utterance: I’m okay. But I’m stuck in traffic. I’m going to be late picking up
      Ms Sato from her hotel. What should I do.
  - role: Student
    utterance: Where are you now?
  - role: Teacher
    utterance: I’m about 5km from the hotel, but there’s a traffic jam and I have
      not moved in the last 20 minutes.
  - role: Student
    utterance: I see. When will you get to the hotel?
  - role: Teacher
    utterance: I don’t know. It could take another 30 to 45 minutes.
  - role: Student
    utterance: Oh, I see. Okay. I will call Ms Sato. We will change the meeting schedule.
      Please call me again when you arrive at the hotel.
  - role: Teacher
    utterance: Okay, I will do that. Thank you for your help.
  roleplay1_target_vocabulary:
