- situation_id: H06
  cefr_target: A2
  purpose_objectives:
    en: 'Using telecommunications.

      Can, given repetition and clarifications, participate in a short, simple phone
      conversation with a known person on a predictable topic, e.g., arrival times,
      arrangements to meet, etc.'
    ja: '電気通信を利用する。

      繰り返し説明することで、到着時間や会う約束など、予測可能なトピックについて、既知の相手と短く簡単な電話での会話を行うことができる。'
  roleplays:
  - id: 1
    en: You receive a phone call from a colleague in the US. He is planning a trip
      to Japan and will visit you. In the phone call, confirm his travel information,
      and the schedule for your first meeting. If necessary, give directions to your
      office.
    ja: アメリカの同僚から電話がかかってきました。その同僚は、日本への旅行を計画しており、あなたを訪問する予定です。その電話で、その同僚の渡航情報とあなたとの面会のスケジュールを確認し、必要であれば、あなたのオフィスへの道順を伝えてださい。
  - id: 2
    en: You work at the Embassy of Japan in Sydney. You sent an important document
      to a local bank. Call the bank to check that the document has been received.
    ja: あなたは在シドニー日本国大使館に勤務しています。あなたは重要な書類を現地の銀行に送りました。銀行に電話して、書類が届いたかどうか確認してください。
  writing_task:
    description_en: 'Based on Role Play 1, write a confirmation email to a colleague
      who will be traveling to Japan regarding the itinerary and initial meeting.

      Write an email that:

      confirms their arrival date, time, and flight number,

      proposes a date, time, and location for your first meeting,

      includes simple directions to your office if needed,

      is clear, friendly, and easy to understand.'
    description_ja: 'ロールプレイ1に基づき、日本に出張予定の同僚に向けて、旅程と初回ミーティングについての確認メールを作成してください。

      以下を含めてください：

      到着日、時間、フライト番号の確認、

      最初のミーティングの日付・時間・場所の提案、

      必要に応じてオフィスへの簡単な行き方の案内、

      わかりやすく、親しみやすいトーンで書いてください。'
  roleplay1_key_expressions:
  - category_en: Introducing yourself on the phone
    category_ja: 電話での自己紹介
    items:
    - Taro Suzuki speaking.
  - category_en: Making an offer to meet
    category_ja: 会う約束をする
    items:
    - Do you want me to meet you at the airport?
  - category_en: Giving street directions
    category_ja: 道案内をする
    items:
    - When you come to our office, take Exit 8 from Kasumigaseki Station. Then, walk
      straight for about 100 meters.
  roleplay_model:
  - role: Student
    utterance: Hello. Taro Suzuki speaking.
  - role: Teacher
    utterance: Taro, it’s John. How are you?
  - role: Student
    utterance: Hello John. I’m good, thanks. How are you?
  - role: Teacher
    utterance: I’m good too. I’m calling to share my travel information with you.
  - role: Student
    utterance: Great. When will you arrive?
  - role: Teacher
    utterance: I’ll arrive in Tokyo next Tuesday at 10am, on flight JK456.
  - role: Student
    utterance: I see. Do you want me to meet you at the airport?
  - role: Teacher
    utterance: No, I know Tokyo very well. I’ll be fine. I’ll check into the hotel
      first, and then go to your office. Can we meet at 3pm?
  - role: Student
    utterance: 3pm? Yes, that will be fine. Do you know where we are?
  - role: Teacher
    utterance: I know you are near Kasumigaseki Station, but I am not too sure exactly
      where.
  - role: Student
    utterance: Sorry. Can you say that again?
  - role: Teacher
    utterance: Sorry
  - role: Teacher
    utterance: That’s great. I look forward to seeing you on Tuesday.
  - role: Student
    utterance: Me too.
  - role: Teacher
    utterance: Goodbye.
  - role: Student
    utterance: Goodbye.
