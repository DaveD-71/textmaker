  purpose_objectives:
    en: 'Making inquiries.

      Can ask and answer questions about plans and intentions.'
    ja: '問い合わせをする。

      計画や意図について質問し、答えることができる。'
  roleplays:
  - id: 1
    en: You work in the consulate in Miami. You and other consulate staff are attending
      a dinner for a local charity. One of the charity organizers sits next to you
      during the meal. Ask him questions about the charity, and the plan for the next
      year.
    ja: あなたはマイアミの領事館に勤務しています。あなたと他の領事館の職員は地元のチャリティーのための夕食会に出席しています。食事中、チャリティーの主催者の一人があなたの隣に座った。このチャリティーについて、また、来年度の計画について質問してください。
  - id: 2
    en: You work in the consulate in Melbourne. You and your colleagues are attending
      a fundraising event for a local not-for-profit organization (NPO). One of the
      event organizers sits next to you during the meal. Ask him questions about the
      NPO, and the plan for the next year.
    ja: あなたはメルボルンの領事館に勤務しています。あなたと同僚は、地元の非営利団体 (NPO) の資金調達イベントに出席しています。食事中、イベントの主催者の一人があなたの隣に座っています。NPOについて、また来年度の計画について質問してください。
  writing_task:
    description_en: 'Following Roleplay 1, you met a charity organizer during a dinner
      in Miami.

      Write an email that:

      thanks them for organizing the event and for the opportunity to attend,

      expresses appreciation for their work,

      asks questions about the charity’s goals and plans for the next year,

      maintains a polite, respectful, and engaging tone.'
    description_ja: 'ロールプレイ1に基づき、マイアミでのディナーイベントで出会ったチャリティー主催者にフォローアップのメールを送ってください。

      以下の内容を含めてください：

      イベントを主催してくれたこと、参加の機会を与えてくれたことへの感謝、

      主催者の活動やチャリティーへの取り組みに対する敬意の表明、

      チャリティーの目標や来年の活動計画についての質問、

      丁寧で親しみやすく、関心の伝わる文体で書くこと。'
  roleplay1_key_expressions:
  - category_en: Asking someone about their employment history
    category_ja: 職歴を聞く
    items:
    - How long have you worked with Direct Relief, Mr. Anderson?
  - category_en: Confirming listening comprehension
    category_ja: リスニングの理解度を確認する
    items:
    - 5 years?
  - category_en: Commenting
    category_ja: コメントする
    items:
    - It sounds like hard work.
  roleplay_model:
  - role: Student
    utterance: How long have you worked with Direct Relief, Mr. Anderson?
  - role: Teacher
    utterance: It’s been five years now. And please, call me John.
  - role: Student
    utterance: Okay, John. 5 years? What do you do there?
  - role: Teacher
    utterance: I’m responsible for creating new opportunities.
  - role: Student
    utterance: That sounds interesting. What does that involve?
  - role: Teacher
    utterance: I liaise with businesses across the country to develop partnerships.
      I work to get donations from businesses, while at the same time creating positive
      PR for them, which they can use to promote their businesses.
  - role: Student
    utterance: I see. It sounds like hard work. Do you have to travel a lot?
  - role: Teacher
    utterance: Yes. I’m usually on the road. I travel most of the year, but I like
      to stay home in winter.
  - role: Student
    utterance: That makes sense. And how has this year been for your charity?
  - role: Teacher
    utterance: We’ve had a good year. We hit our donations target in early November,
      so we’re going to finish the year a little over our targets.
  - role: Student
    utterance: That’s good to hear.
  - role: Teacher
    utterance: Thank you.
