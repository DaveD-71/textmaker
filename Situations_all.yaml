- situation_id: C10
  cefr_target: B2
  purpose_objectives:
    en: 'Making suggestions.

      Can understand and exchange complex information and advice on the full range
      of matters related to their occupational role.'
    ja: '提案する。

      自分の職業上の役割に関連するあらゆる事項について、複雑な情報やアドバイスを理解し、やり取りすることができる。'
  roleplays:
  - id: 1
    en: You work at the consulate in New York. You are participating in a budget meeting.
      Your boss has asked for ideas on how to reduce costs for the next quarter. Share
      your ideas with detailed reasons and supporting statements.
    ja: あなたはニューヨークの領事館に勤務しています。あなたは予算会議に参加しています。あなたの上司は、次の四半期のコストを削減する方法について意見を求めています。詳細な理由と裏付けとなる記述を添えて、あなたの考えを述べてください。
  - id: 2
    en: You work at the consulate in London. Your boss has been charged with improving
      the level of service at the embassy for visa applications and processing. You
      will join a meeting in which you need to share your ideas. Make sure you include
      detailed reasons and supporting statements.
    ja: あなたはロンドンの領事館に勤務しています。あなたの上司は、ビザの申請と手続きに関する大使館のサービスレベルを向上させることを任されました。あなたは会議に参加し、自分のアイデアを共有する必要があります。詳細な理由と裏付けとなる記述を必ず添えてください。
  writing_task:
    description_en: 'Following the budget meeting, your boss has asked you to submit
      a written proposal.

      Your proposal should:

      outline your ideas for reducing costs next quarter,

      provide clear explanations and supporting statements,

      address concerns raised during the meeting,

      suggest practical, realistic solutions.'
    description_ja: '予算会議を受けて、上司から書面による提案を求められました。

      提案書には以下を含めてください：

      来四半期のコスト削減に関するアイデアの提示

      各提案に対する明確な説明と根拠

      会議中に出された懸念への対応

      実現可能で現実的な解決策の提示'
  roleplay1_key_expressions:
  - category_en: Stating an action and a result
    category_ja: 行動と結果を述べる
    items:
    - I’ve been considering how we can cut costs, and I’ve come up with, I think,
      three possible ways of doing so.
  - category_en: Indicating a desirable outcome based on conditions
    category_ja: 条件に基づいた望ましい結果を述べる
    items:
    - If our document processing systems can be aligned with the systems in Tokyo,
      and we move towards digitization of documents, then with a secure network we
      should be able to quickly and easily transfer documents and rapidly increase
      processing times.
  - category_en: Stating the cause of a problem
    category_ja: 問題の原因を述べる
    items:
    - I often think our systems are currently overly bureaucratic and are slowed down
      by the excessive level of checking required.
  roleplay_model:
  - role: Teacher
    utterance: Okay, so as you know from the email I sent you all last week, we’re
      here today to discuss how we can reduce costs. You’ve each had some time to
      think about how costs can be reduced in your departments, and I’d like to go
      around the table and ask each of you to share your ideas one by one. Let’s start
      with you, Taro.
  - role: Student
    utterance: Okay John. Thanks for letting me go first. I’ve been considering how
      we can cut costs, and I’ve come up with, I think, three possible ways of doing
      so. Let me share them and get your feedback.
  - role: Teacher
    utterance: Okay, go ahead.
  - role: Student
    utterance: Well, the first idea is to reduce the amount of overtime hours worked.
      There is a lot of double and triple checking of documents being processed, for
      example, for visa applications, and I think a lot of that can be centralized
      in Tokyo. If our document processing systems can be aligned with the systems
      in Tokyo, and we move towards digitization of documents, then with a secure
      network we should be able to quickly and easily transfer documents and rapidly
      increase processing times. I often think our systems are currently overly bureaucratic
      and are slowed down by the excessive level of checking required. I think this
      could be streamlined.
  - role: Teacher
    utterance: That’s not a bad idea. I have a meeting tomorrow with Tokyo. I’ll bring
      it up and see what the response is. Do you have any other ideas?
  - role: Student
    utterance: Well, yes, I do. It’s similar to the first one, inasmuch as it is a
      reflection of manpower. I was thinking that we could cut the number of part
      time staff we have. Usually, there are 4 staff in the office at any time, but
      that’s not always needed. I thought that on some days, we could get by with
      just three.
  - role: Teacher
    utterance: Hmmm. I’m not sure about that, but it’s certainly something we will
      have to consider. Let me think about that one. You said you have three ideas.
      What is the third one?
  - role: Student
    utterance: Okay. So, the last one is small perhaps, but I was thinking we could
      turn off the lights when we don’t need them. Often there are parts of the building
      where the lights are on all day, but are rarely used. Also, I think we could
      turn all the lights off at lunchtime. Overtime, it could add up.
  - role: Teacher
    utterance: An interesting idea, and easy enough to implement. Sure, let’s do it.
  - role: Student
    utterance: Great.
