- situation_id: E06
  cefr_target: B1
  purpose_objectives:
    en: 'Making decisions.

      For visiting dignitaries from Japan, you can discuss with local officials which
      hotel to choose when there are several candidates and compare and contrast the
      convenience of using each hotel (e.g., distance to the embassy for transportation,
      restaurant options, availability of appropriate rooms and meeting rooms, ease
      of security, etc.).'
    ja: '意思決定をする。

      日本からの要人来訪において、使用するホテルの候補が複数ある場合に、どれを選べばよいかを現地職員と議論し、それぞれのホテルを使用した場合の、利便性（例えば移動を考慮した際の大使館との距離やレストランの選択肢、適切な部屋・会議室の有無、警備のしやすさ等）を比較対照できる。'
  roleplays:
  - id: 1
    en: You work in the consulate in New York. Next month some visitors will come
      from Japan to attend an international conference. You need to choose a convenient
      and comfortable hotel for them. Discuss the options with a local staff member
      and consider the priorities (access to public transportation, restaurants and
      shops, hotel facilities, etc.). At the end of the discussion, choose the best
      hotel.
    ja: あなたはニューヨークの領事館に勤務しています。来月、国際会議に出席するために日本から何人かの訪問者がやってきます。その人たちのために、便利で快適なホテルを選ぶ必要があります。現地スタッフと選択肢について話し合い、優先順位（公共交通機関へのアクセス、レストランやショップ、ホテルの設備など）を検討してください。話し合いの結果、最適なホテルを選びましょう。
  - id: 2
    en: You work in the embassy in Canberra. Next month some visitors will come from
      Japan to have a meeting with their counterparts in the Australian government.
      You need to choose a convenient and comfortable hotel for them. Discuss the
      options with a local staff member and consider the priorities (access to public
      transportation, restaurants and shops, hotel facilities, etc.). At the end of
      the discussion, choose the best hotel.
    ja: あなたはキャンベラの大使館に勤務しています。来月、オーストラリア政府の担当者と会談するために、日本から何人かの訪問者がやってきます。その人たちのために、便利で快適なホテルを選ぶ必要があります。現地スタッフと選択肢について話し合い、優先順位（公共交通機関へのアクセス、レストランやショップ、ホテルの設備など）を検討してください。話し合いの結果、最適なホテルを選びましょう。
  writing_task:
    description_en: 'Following Roleplay 1, you are informing colleagues about hotel
      arrangements for visitors attending an international conference in New York.

      Write an email that:

      names the chosen hotel,

      lists its key amenities, including accommodation quality, proximity to public
      transportation, and nearby restaurants and shops,

      includes any other relevant facilities,

      expresses confidence that it will meet the visitors’ needs.

      Keep the message clear and informative.'
    description_ja: 'ロールプレイ1に基づき、国際会議に出席する来賓のためのホテル予約について、領事館内の同僚に知らせるメールを作成してください。

      以下を含めてください：

      選定したホテル名、

      宿泊施設の快適さ、交通アクセス、周辺のレストランや施設などの利便性、

      その他の関連施設の情報、

      来賓の滞在が快適になることへの自信の表明。

      明確で読みやすい文章にしてください。'
  roleplay1_key_expressions:
  - category_en: Asking for help
    category_ja: 助けを求める
    items:
    - I need your help with something.
  - category_en: Asking for opinions
    category_ja: 意見を求める
    items:
    - Where do you think is best?
  - category_en: Giving detailed information
    category_ja: 詳細な情報を与える
    items:
