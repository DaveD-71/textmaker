  writing_task_model:
    subject: Flight delay from Tokyo
    body: 'Dear Colleagues,

      The flight from Tokyo is late. The delegation will now arrive at 10:00 am. First,
      they planned to arrive at 9:00 am. The weather is bad, so the flight is late.
      Please check your schedules.

      If you have questions, please email me. I will tell you if there is more news.

      Thank you very much for your help. Have a nice day.

      Best regards,

      Taro Suzuki

      Japanese Consulate, San Francisco'
