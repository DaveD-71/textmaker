    en: You work at the Embassy of Japan in New Delhi. The Business Department of
      a local university has invited you to a university festival. Make a brief announcement
      about the mission of the embassy in relation to the department and answer any
      questions.
    ja: あなたはニューデリーの日本大使館に勤務しています。地元の大学の経営学部から大学祭に招待されました。その学部に関わる大使館が果たすべき役割について簡潔に発表し、質問に答えてください。
  - id: 2
    en: You work at the Embassy of Japan in Ontario. The mayor of Ontario has invited
      you to participate in a local city festival and give a presentation on the role
      of the embassy. Make a brief announcement about the mission of the embassy and
      answer any questions.
    ja: あなたはオンタリオ日本大使館に勤務しています。オンタリオ州の市長から、地元のお祭りに招待され、大使館の役割についてプレゼンテーションを行います。大使館が果たすべき役割について簡潔に発表し、質問に答えてください。
  writing_task:
    description_en: 'Write a brief announcement for the attendees of BizFest 202X.

      In your announcement:

      introduce yourself as a representative of the Embassy of Japan,

      explain the embassy’s mission in relation to the Business Department,

      prepare to answer any questions about the embassy’s involvement with the university
      or related topics.

      Your response should be clear, concise, and professional.'
    description_ja: '「BizFest 202X」の参加者に向けた短い案内文を作成してください。

      案内文には以下を含めてください：

      在インド日本国大使館の代表として自己紹介をすること

      ビジネス学部との関わりにおける大使館の使命を説明すること

      大使館と大学の関係や関連する話題についての質問に対応できるよう準備すること

      内容は明確で簡潔、かつ丁寧な文体で書いてください。'
  roleplay1_key_expressions:
  - category_en: Introducing a topic
