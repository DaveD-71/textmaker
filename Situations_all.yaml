- situation_id: C08
  cefr_target: B2
  purpose_objectives:
    en: 'Dealing with problems.

      Can cope linguistically to negotiate a solution to a dispute like an undeserved
      traffic ticket, financial responsibility for damage in a flat, or blame regarding
      an accident.'
    ja: 'トラブルに対処する。

      交通違反の取り締まり、アパートの損害賠償、事故の責任追及などの問題を解決するために、口頭で交渉することができる。'
  roleplays:
  - id: 1
    en: You work at the consulate in Melbourne. You recently purchased a product for
      your office (e.g., a printer, a desk lamp, an office chair). You had problems
      with the product and returned it to the vendor within the warranty period. However,
      the vendor has contacted you because the product was returned damaged. The damage
      is in addition to the original fault. When you shipped the product, you believed
      it was in good condition. You received an email from the vendor. They are now
      saying they cannot accept the return of the product because of the damage that
      was not reported when you made the claim. Call the vendor and resolve the situation.
    ja: あなたはメルボルンの領事館に勤務しています。あなたは最近オフィス用の製品（例：プリンター、机上用照明、オフィスチェア）を購入しました。あなたは製品に問題があり、保証期間内にベンダーに返送しました。しかし、製品が破損して返送されたため、ベンダーからあなたに連絡が入りました。この損傷は、もともとの不具合に加えてのものです。製品を返送したとき、あなたはその製品が良い状態で返送されたと信じています。ベンダーからEメールが届きました。彼らは今、あなたがクレームを出したときに報告されなかった損傷があるため、製品の返品を受け入れることができないと言っています。ベンダーに電話をして、状況を解決してください。
  - id: 2
    en: You work at the consulate in Auckland. You drive to work every day. Today,
      you are running late. You are usually a very careful driver and take care not
      to speed. Today, on your way to work you have been pulled over by a policeman
      for speeding. You believe you were not speeding. You are in a hurry to get to
      work to attend an important meeting. Deal with the situation.
    ja: あなたはオークランドにある領事館で働いています。毎日、車で出勤しています。今日、あなたは遅刻しそうです。普段あなたはとても慎重に運転をしていて、スピードを出さないように気をつけています。今日、あなたは出勤途中にスピード違反で警官に車を停められました。あなたはスピード違反をしていないと信じています。あなたは重要な会議に出席するために出勤を急いでいます。この状況に対応してください。
  writing_task:
    description_en: 'Following Roleplay 1, draft an email to the vendor from whom
      you purchased a faulty product.

      Your email should:

      address the concerns discussed during the phone call,

      express your dissatisfaction with the proposed solutions,

      request a fair and reasonable solution to the problem.

      Maintain a professional tone throughout.'
    description_ja: 'ロールプレイ1での電話の内容を受けて、問題のある製品を購入した業者にメールを書いてください。

      以下を含めてください：

      電話で話し合われた内容への対応、

      提案された解決策への不満の表明、

      公平な解決策の要望。

      文体は丁寧で、かつプロフェッショナルにしてください。'
  roleplay1_key_expressions:
  - category_en: Indicating purpose on the telephone
    category_ja: 電話で目的を伝える
    items:
    - I’m calling in regard to an email I received from your store earlier today.
  - category_en: Disagreeing with a claim
    category_ja: 主張に対して反対する
    items:
    - However, I’m unable to understand how that is possible.
  - category_en: Rejecting a proposal
    category_ja: 提案を拒否する
    items:
    - However, I don’t consider that a reasonable solution to this problem.
  roleplay_model:
  - role: Teacher
    utterance: Good morning. Thank you for calling David Jones, Chadstone. How may
      I help you today?
  - role: Student
    utterance: Hello, this is Taro Suzuki at the Consulate of Japan in Melbourne.
  - role: Teacher
    utterance: Hello, Mr. Suzuki. What can I do for you?
  - role: Student
    utterance: Could you put me through to the electronics department, please?
  - role: Teacher
    utterance: Certainly, please hold the line.
  - role: Student
    utterance: Okay.
  - role: Teacher
    utterance: Hello, this is John in electronics. How can I help you today?
  - role: Student
    utterance: Hello John, this is Taro Suzuki at the Consulate of Japan in Melbourne.
      I’m calling in regard to an email I received from your store earlier today.
  - role: Teacher
    utterance: Okay, Mr. Suzuki. Please let me check our email… Okay, I see what this
      is in regard to. It seems you returned a Toshiba laptop, and it has arrived
      with additional damage to the outside of the machine
  - role: Teacher
    utterance: To be honest with you, I don’t know. You shipped the laptop to us using
      Australia Post, so it took a week to get to us. We will have to conduct an investigation
      and contact the post office. At the moment, we cannot accept the return under
      the conditions of your warranty.
  - role: Student
    utterance: I see. And how long is that expected to take? I currently don’t have
      a personal computer I can use. I am barely getting by with my smartphone, but
      it’s really quite inconvenient. And what should I do if you do not accept the
      return?
  - role: Teacher
    utterance: Instead of replacing the laptop, we can repair it. And there will be
      a cost to replace the outer casing. You may be able to claim that on insurance
      if you have any.
  - role: Student
    utterance: I do have insurance. However, I don’t consider that a reasonable solution
      to this problem. Okay, well then, please contact the post office. When will
      I know the result?
  - role: Teacher
    utterance: It could take up to two weeks.
  - role: Student
    utterance: Okay. Well, I guess I don’t have a choice.
  - role: Teacher
    utterance: I appreciate your patience. We will contact you as soon as we reach
      a decision regarding your claim.
  - role: Student
    utterance: Thank you. Goodbye.
  - role: Teacher
    utterance: Goodbye Mr. Suzuki.
