  writing_task_model:
    subject: Catering for Upcoming Event
    body: 'Dear Mary san,

      I hope you''re well.

      Thank you for the discussion today regarding catering for our upcoming event.

      I understand the appeal of using a caterer popular on social media for promoting
      our event. However, I strongly recommend choosing Best Foods again. We have
      worked with them several times, and they have always provided reliable service
      and excellent food quality.

      Best Foods has proven their reliability and professionalism, especially during
      our last event when they successfully managed unexpected situations smoothly.
      Using them again will ensure the event runs without any issues, avoiding the
      risks involved with trying a new and untested caterer.

      While social media exposure can be beneficial, I believe the success and smooth
      management of the event are most important. If necessary, we could explore other
      ways to promote the event online without risking service quality.

      I hope we can agree on using Best Foods. Please let me know your thoughts.

      Best regards,

      Taro Suzuki

      Consulate of Japan, Auckland'
