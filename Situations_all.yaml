  writing_task_key_expressions:
  - category_en: Providing step-by-step instructions
    category_ja: 明確な指示を与える
    items:
    - Please pick up Mr. Taro Saito from his hotel and bring him to the consulate.
  - category_en: Offering alternative plans clearly
    category_ja: 代替案や緊急時対応を伝える
    items:
    - If you have any problems, please call me.
  writing_task_model:
    subject: Guest Pickup Details
    body: 'Dear Joel,

      I hope you are doing well.

      Please pick up Mr. Taro Saito from his hotel and bring him to the consulate.
      His meeting starts at 1:00 p.m., so he should be here by 12:45 p.m.

      He is staying at the Intercontinental Hotel in Room 405. The hotel is at 123
      Oak Road.

      To save time, please take the highway. If you have any problems, please call
      me.

      Let me know if you have any questions. Thanks for your help.

      Best,

      Taro Suzuki'
